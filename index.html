<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🏰 生存挑战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Microsoft YaHei",sans-serif;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(255,255,255,.8)}
#cross::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#cross::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#hp-wrap{position:absolute;top:10px;left:10px;width:160px;background:rgba(0,0,0,.55);border:2px solid #555;border-radius:4px;padding:3px}
#hp-bar{height:14px;width:100%;background:linear-gradient(#5fe03a,#3fae22);border-radius:2px;transition:width .15s}
#hp-text{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#fff;font-size:10px;font-weight:bold;text-shadow:1px 1px 2px #000}
#info{position:absolute;top:10px;right:10px;color:#fff;font-size:12px;text-shadow:1px 1px 2px #000;text-align:right;line-height:1.8}
#res{font-size:14px;margin-bottom:4px}
#res span{margin-left:10px;padding:2px 6px;border-radius:3px}
#stone-count{background:rgba(136,136,136,.5);color:#ccc}
#iron-count{background:rgba(204,136,68,.5);color:#ffd93d}
#wave-info{color:#f88;font-size:14px}
#score-info{color:#8f8}
#online-info{opacity:.8;font-size:11px}
#hotbar{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(0,0,0,.7);border:2px solid #666;border-radius:8px;z-index:40;pointer-events:auto}
.hs{width:64px;height:64px;background:rgba(255,255,255,.1);border:3px solid #777;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;cursor:pointer;pointer-events:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:border-color .12s,background .12s}
.hs.act{border-color:#ffd93d;background:rgba(255,215,0,.22);box-shadow:0 0 12px rgba(255,215,0,.45)}
.hs .ct{position:absolute;bottom:2px;right:5px;font-size:12px;color:#fff;text-shadow:1px 1px 1px #000}
.hs .lb{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:#aaa;white-space:nowrap}
.hs.act .lb{color:#ffd93d}
#touch{position:fixed;bottom:0;left:0;right:0;height:220px;pointer-events:none;z-index:20}
#joy{position:absolute;left:24px;bottom:24px;width:150px;height:150px;background:rgba(255,255,255,.1);border-radius:50%;border:2px solid rgba(255,255,255,.2);pointer-events:auto}
#joy-k{position:absolute;width:60px;height:60px;background:rgba(255,255,255,.3);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.tb{position:absolute;width:68px;height:68px;background:rgba(255,255,255,.12);border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none}
#b-jump{right:24px;bottom:80px}
#b-act{right:100px;bottom:80px;background:rgba(255,120,60,.22);border-color:rgba(255,120,60,.4);flex-direction:column}
#b-act span{font-size:11px;margin-top:2px}
#b-del{right:24px;bottom:160px;background:rgba(255,60,60,.22);border-color:rgba(255,60,60,.4)}
.tb:active{background:rgba(255,255,255,.3);transform:scale(.92)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
.ov h1{font-size:30px;margin-bottom:8px}.ov .sub{color:#aaa;font-size:13px;margin-bottom:18px;text-align:center;line-height:1.7}
.ov button{padding:12px 36px;font-size:16px;border:none;border-radius:6px;cursor:pointer;margin:5px;color:#fff;font-family:inherit}
.bgo{background:#4a8;font-size:18px}
.brs{background:#f66}
#toast{position:absolute;top:36%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 20px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
#boss-warn{position:absolute;top:20%;left:50%;transform:translateX(-50%);color:#f44;font-size:28px;font-weight:bold;text-shadow:2px 2px 4px #000;opacity:0;transition:opacity .5s;pointer-events:none}
#ov-death{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:100}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:15;box-shadow:inset 0 0 120px 40px rgba(120,0,0,0);transition:box-shadow .15s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div id="cross"></div>
<div id="hp-wrap"><div id="hp-bar"></div><span id="hp-text">100/100</span></div>
<div id="info">
  <div id="res"><span id="stone-count">⬜ 0</span><span id="iron-count">🟠 0</span></div>
  <div id="wave-info">准备开始</div>
  <div id="score-info">🎯 0</div>
  <div id="online-info">玩家 1</div>
</div>

<div id="b-jump" class="tb">⬆</div>
<div id="b-act" class="tb">🔨<span>建造</span></div>

<h1>🏰 生存挑战</h1>
<div class="sub">
⬜ 石头 → 建造围墙阻挡僵尸<br>
🟠 铁块 → 建造箭塔自动射击<br>
🏹 击杀僵尸获取资源，和好友进同一房间即可联机。

</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script type="module">
import*as T from"three";
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const C=(v,a,b)=>Math.max(a,Math.min(b,v));

// ============================ 基础/地图 ============================
const W=112,D=112;
const BL={AIR:0,GRASS:1,DIRT:2,STONE:3,WATER:4,SAND:5,SNOW:6,WOOD:7,LEAF:8};
const BC={1:0x6abe5a,2:0x8a6a43,3:0x8a8a8a,4:0x2a6cc0,5:0xe2d29a,6:0xeef3f6,7:0x6b4a2b,8:0x3f9d4a};
const BW={WALL:10,TOWER:11,TOWER_TOP:12};
const BWC={10:0x999999,11:0x8B4513,12:0xCD853F};
const SOLID=new Set([BL.GRASS,BL.DIRT,BL.STONE,BL.SAND,BL.SNOW,BL.WOOD,BL.LEAF,BW.WALL,BW.TOWER,BW.TOWER_TOP]);
const DEST=new Set([BW.WALL,BW.TOWER,BW.TOWER_TOP]);

function hash2(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function noise2(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);
  const ux=xf*xf*(3-2*xf),uz=zf*zf*(3-2*zf);
  return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz}
function fbm2(x,z,oct){let v=0,a=1,f=1;for(let i=0;i<oct;i++){v+=a*noise2(x*f,z*f);a*=.5;f*=2}return v}

let blocks=new Map(),builtBlocks=new Map();
function getH(x,z){
  const dist=Math.sqrt((x-56)**2+(z-56)**2);
  let h=Math.floor(6+fbm2(x*0.04,z*0.04,4)*5);
  if(dist>46)h+=Math.floor((dist-46)*0.6);
  return Math.min(h,26)}
function key(x,y,z){return x+","+y+","+z}
function blockAt(x,y,z){return blocks.get(key(x,y,z))||0}
function solidAt(x,y,z){return SOLID.has(blockAt(x,y,z))||builtBlocks.has(key(x,y,z))}

function genWorld(){
  blocks.clear();
  for(let x=0;x<W;x++)for(let z=0;z<D;z++){
    const h=getH(x,z);
    const biome=fbm2(x*0.02+50,z*0.02+50,3);
    let top=BL.GRASS;
    if(h<=5)top=BL.SAND;
    else if(h>=12)top=BL.SNOW;
    else if(biome<0.32)top=BL.DIRT;
    else if(biome>0.78)top=BL.SAND;
    for(let y=0;y<=h;y++){
      let t=BL.STONE;
      if(y===h)t=top;else if(y>=h-2)t=BL.DIRT;
      blocks.set(key(x,y,z),t)}
    if(h<=5)for(let y=h+1;y<=6;y++)if(!blocks.get(key(x,y,z)))blocks.set(key(x,y,z),BL.WATER);
  }
  // 平坦出生点
  for(let x=53;x<=59;x++)for(let z=53;z<=59;z++){
    const h=getH(x,z);
    for(let y=1;y<=h;y++)blocks.set(key(x,y,z),y===h?BL.GRASS:BL.DIRT)}
  // 周围围墙
  for(let x=0;x<W;x++){blocks.set(key(x,0,0),BL.STONE);blocks.set(key(x,0,D-1),BL.STONE)}
  for(let z=0;z<D;z++){blocks.set(key(0,0,z),BL.STONE);blocks.set(key(W-1,0,z),BL.STONE)}
}

// ============================ three 基础 ============================
const cv=$("c");
const ren=new T.WebGLRenderer({canvas:cv,antialias:false,powerPreference:"high-performance"});
ren.setPixelRatio(Math.min(devicePixelRatio,1.5));
ren.setSize(innerWidth,innerHeight);
const sc=new T.Scene();
sc.background=new T.Color(0x87ceeb);
sc.fog=new T.Fog(0x87ceeb,70,220);
const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,0.1,400);
const hemi=new T.HemisphereLight(0xbfe3ff,0x6b5a3a,0.8);sc.add(hemi);
const dl=new T.DirectionalLight(0xffffff,1.0);dl.position.set(60,120,30);sc.add(dl);
const rc=new T.Raycaster();
const GEO=new T.BoxGeometry(1,1,1);
const MATS={};
Object.keys(BC).forEach(k=>{MATS[k]=new T.MeshLambertMaterial({color:0xffffff})});
Object.keys(BWC).forEach(k=>{MATS[k]=new T.MeshLambertMaterial({color:BWC[k]})});

let tm={},bm={};
function rebuildTerrain(){
  Object.values(tm).forEach(m=>{if(m)sc.remove(m)});tm={};
  const g3={};
  blocks.forEach((t,k)=>{if(!t)return;if(!g3[t])g3[t]=[];const[x,y,z]=k.split(",").map(Number);g3[t].push(x,y,z)});
  const m4=new T.Matrix4(),tmpC=new T.Color();
  Object.entries(g3).forEach(([t,a])=>{
    const n=a.length/3;if(!n)return;
    const mt=MATS[t]||MATS[1];
    const m=new T.InstancedMesh(GEO,mt,n);
    const base=new T.Color(BC[t]||BC[1]);
    for(let i=0;i<n;i++){
      const bx=a[i*3],bz=a[i*3+2];
      m4.makeTranslation(bx+.5,a[i*3+1]+.5,bz+.5);m.setMatrixAt(i,m4);
      const hj=hash2(bx*1.3+7,bz*1.7+3),v=(hj-0.5)*0.16;
      tmpC.copy(base).offsetHSL((hj-0.5)*0.03,v*0.6,v);
      m.setColorAt(i,tmpC)}
    m.instanceMatrix.needsUpdate=true;
    if(m.instanceColor)m.instanceColor.needsUpdate=true;
    sc.add(m);tm[t]=m});
}
function rebuildBuilt(){
  Object.values(bm).forEach(m=>{if(m)sc.remove(m)});bm={};
  const g={};
  builtBlocks.forEach((t,k)=>{if(!g[t])g[t]=[];const[x,y,z]=k.split(",").map(Number);g[t].push(x,y,z)});
  const m4=new T.Matrix4();
  Object.entries(g).forEach(([t,a])=>{
    const n=a.length/3;if(!n)return;
    const mt=MATS[t]||MATS[10];
    const m=new T.InstancedMesh(GEO,mt,n);
    for(let i=0;i<n;i++){m4.makeTranslation(a[i*3]+.5,a[i*3+1]+.5,a[i*3+2]+.5);m.setMatrixAt(i,m4)}
    m.instanceMatrix.needsUpdate=true;sc.add(m);bm[t]=m});
}
function allBuildMeshes(){return[...Object.values(tm),...Object.values(bm)].filter(m=>!!m)}

// ============================ 玩家 ============================
let myId=Math.random().toString(36).slice(2,10);
let myName="",room="1";
let P={pos:new T.Vector3(56,getH(56,56)+3,56),vel:new T.Vector3(),yaw:0,pitch:0,og:false,dead:false,hp:100,stone:15,iron:3,kills:0,score:0,hcd:0,respawn:0};
let slot=0,hbar=[10,11];
let keys={},jF=0,jB=0,jL=0,jR=0,jJ=0;
const PW=.3,PH=1.7,EY=1.5;

function collides(px,py,pz){
  const x0=Math.floor(px-PW),x1=Math.floor(px+PW);
  const y0=Math.floor(py),y1=Math.floor(py+PH);
  const z0=Math.floor(pz-PW),z1=Math.floor(pz+PW);
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++){
    if(solidAt(x,y,z))return true}return false}
function moveA(a,d){const p=P.pos.clone();p[a]+=d;if(!collides(p.x,p.y,p.z)){P.pos[a]+=d;return false}return true}

function updatePlayer(dt){
  const sp=5;
  const fw=new T.Vector3(-Math.sin(P.yaw),0,-Math.cos(P.yaw));
  const rt=new T.Vector3(Math.cos(P.yaw),0,-Math.sin(P.yaw));
  let mx=0,mz=0;
  if(keys.KeyW||jF)mz-=1;if(keys.KeyS||jB)mz+=1;
  if(keys.KeyA||jL)mx-=1;if(keys.KeyD||jR)mx+=1;
  if(mx||mz){const l=Math.sqrt(mx*mx+mz*mz);mx/=l;mz/=l;
    const mv=fw.clone().multiplyScalar(-mz).add(rt.clone().multiplyScalar(mx)).normalize().multiplyScalar(sp*dt);
    moveA("x",mv.x);moveA("z",mv.z)}
  if((keys.Space||jJ)&&P.og)P.vel.y=8;
  P.vel.y-=22*dt;P.og=false;
  if(moveA("y",P.vel.y*dt)){if(P.vel.y<0)P.og=true;P.vel.y=0}
  P.pos.x=C(P.pos.x,1,W-2);P.pos.z=C(P.pos.z,1,D-2);
  if(P.pos.y<-5){P.pos.y=15;P.vel.set(0,0,0)}
  P.hcd=Math.max(0,P.hcd-dt)}

// ============================ 准星/建造预览 ============================
function getTarget(nx,ny){
  const vx=(nx!==undefined)?nx:0, vy=(ny!==undefined)?ny:0;
  rc.setFromCamera(new T.Vector2(vx,vy),cam);
  const hits=rc.intersectObjects(allBuildMeshes(),false);
  if(!hits.length)return null;
  const p=hits[0].point,n=hits[0].face.normal;
  return{
    x:Math.floor(p.x-n.x*.5),y:Math.floor(p.y-n.y*.5),z:Math.floor(p.z-n.z*.5),
    nx:Math.floor(p.x+n.x*.5),ny:Math.floor(p.y+n.y*.5),nz:Math.floor(p.z+n.z*.5)}}

let hlMesh=null,rangeIndicator=null,previewMesh=null;
function createHL(){
  const g=new T.BoxGeometry(1.03,1.03,1.03);
  hlMesh=new T.LineSegments(new T.EdgesGeometry(g),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.6}));
  hlMesh.visible=false;sc.add(hlMesh);
  rangeIndicator=new T.Mesh(new T.RingGeometry(13.5,14.5,64),new T.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:0.2,side:T.DoubleSide}));
  rangeIndicator.rotation.x=-Math.PI/2;rangeIndicator.visible=false;sc.add(rangeIndicator);
  previewMesh=new T.Mesh(new T.BoxGeometry(1,1,1),new T.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:0.4}));
  previewMesh.visible=false;sc.add(previewMesh)}

// ============================ 建造/拆除 ============================
function doBuild(t){
  if(!t)t=getTarget();if(!t)return;
  if(hbar[slot]===10){
    if(P.stone<=0){showToast("石头不足！");return}
    if(builtBlocks.has(key(t.nx,t.ny,t.nz))||solidAt(t.nx,t.ny,t.nz))return;
    P.stone--;builtBlocks.set(key(t.nx,t.ny,t.nz),BW.WALL);
    rebuildBuilt();showToast("🧱 建造围墙");
    if(netOk)netSend({t:"bw",x:t.nx,y:t.ny,z:t.nz},1);
  }else if(hbar[slot]===11){
    if(P.iron<=0){showToast("铁块不足！");return}
    if(builtBlocks.has(key(t.nx,t.ny,t.nz))||solidAt(t.nx,t.ny,t.nz))return;
    P.iron--;
    const bx=t.nx,by=t.ny,bz=t.nz;
    builtBlocks.set(key(bx,by,bz),BW.TOWER);
    builtBlocks.set(key(bx,by+1,bz),BW.TOWER);
    builtBlocks.set(key(bx,by+2,bz),BW.TOWER);
    builtBlocks.set(key(bx,by+3,bz),BW.TOWER_TOP);
    towers.push({x:bx+.5,y:by+4,z:bz+.5,hp:15,atk:4,range:14,cd:0,key:key(bx,by,bz)});
    rebuildBuilt();showToast("🏹 建造箭塔！");
    if(netOk)netSend({t:"tw",x:bx,y:by,z:bz},1);
  }}
function doDemolish(t){
  if(!t)t=getTarget();if(!t)return;
  const k=key(t.x,t.y,t.z);
  const bt=builtBlocks.get(k);
  if(!bt){showToast("准星没有对准可拆除的方块");return}
  if(bt===BW.WALL){
    builtBlocks.delete(k);P.stone++;
    if(netOk)netSend({t:"rmb",x:t.x,y:t.y,z:t.z},1);
    toast("⬜ 回收石头");
  }else{
    let bx=t.x,by=t.y,bz=t.z,found=false;
    for(let dy=0;dy<4&&!found;dy++){
      const ck=key(t.x,t.y-dy,t.z);
      if(towers.some(tw=>tw.key===ck)){bx=t.x;by=t.y-dy;bz=t.z;found=true}}
    for(let dy=0;dy<4;dy++)builtBlocks.delete(key(bx,by+dy,bz));
    towers=towers.filter(tw=>tw.key!==key(bx,by,bz));
    P.iron+=2;
    if(netOk)netSend({t:"rmt",x:bx,y:by,z:bz},1);
    toast("🟠 回收铁块");
  }
  rebuildBuilt()}

// ============================ 僵尸 ============================
let zombies=[],wave=0,waveT=25,towers=[],bullets=[],dmgNums=[],resAnims=[];
function createZombie(x,z,isBoss){
  const g=new T.Group();
  const bm2=new T.MeshLambertMaterial({color:isBoss?0x440000:0x2d6b2d});
  const body=new T.Mesh(new T.BoxGeometry(.7,.9,.4),bm2);body.position.y=.95;
  const hd=new T.Mesh(new T.BoxGeometry(.45,.45,.45),bm2);hd.position.y=1.65;
  const e1=new T.Mesh(new T.BoxGeometry(.08,.08,.08),new T.MeshBasicMaterial({color:0xff0000}));e1.position.set(-.1,1.7,.24);
  const e2=new T.Mesh(new T.BoxGeometry(.08,.08,.08),new T.MeshBasicMaterial({color:0xff0000}));e2.position.set(.1,1.7,.24);
  const a1=new T.Mesh(new T.BoxGeometry(.18,.5,.18),bm2);a1.position.set(-.45,.9,-.15);a1.rotation.x=-.6;
  const a2=new T.Mesh(new T.BoxGeometry(.18,.5,.18),bm2);a2.position.set(.45,.9,-.15);a2.rotation.x=-.6;
  const l1=new T.Mesh(new T.BoxGeometry(.18,.45,.18),bm2);l1.position.set(-.15,.25,0);
  const l2=new T.Mesh(new T.BoxGeometry(.18,.45,.18),bm2);l2.position.set(.15,.25,0);
  g.add(body,hd,e1,e2,a1,a2,l1,l2);
  // 血条
  const hbG=new T.Group();hbG.position.y=2.3;
  const hbBg=new T.Mesh(new T.PlaneGeometry(1.2,0.2),new T.MeshBasicMaterial({color:0x333333,side:T.DoubleSide}));
  const hbFill=new T.Mesh(new T.PlaneGeometry(1,0.15),new T.MeshBasicMaterial({color:0xff0000,side:T.DoubleSide}));hbFill.position.z=0.01;
  hbG.add(hbBg,hbFill);g.add(hbG);
  const h=getH(Math.floor(x),Math.floor(z));
  g.position.set(x,h+1,z);sc.add(g);
  const zd={hp:isBoss?30:8,maxHp:isBoss?30:8,sp:isBoss?3.5:R(2,3),dead:false,walk:R(0,6.28),flash:0,atkCd:0,boss:isBoss,scale:isBoss?1.5:1,hbFill,hbG};
  g.userData=zd;zombies.push(g);
  if(isBoss)g.scale.setScalar(1.5);
  return g}

function spawnWave(){
  wave++;const isBoss=wave%5===0;
  const n=isBoss?Math.min(6+wave*2,40):Math.min(2+wave,25);
  let sp=0;
  for(let i=0;i<n;i++){
    if(zombies.length>=50)break;
    const a=R(0,Math.PI*2),d=R(22,38);
    const x=C(P.pos.x+Math.cos(a)*d,2,W-3);
    const z=C(P.pos.z+Math.sin(a)*d,2,D-3);
    createZombie(x,z,isBoss);sp++}
  if(isBoss){showBossWarn("💀 BOSS 第"+wave+"波！(×"+sp+")");showToast("BOSS波！巨型僵尸来袭！")}
  else showToast("🧟 第"+wave+"波！(×"+sp+")")}

function applyZombieDamage(zid,dmg){
  // 直接按索引找（单机或主机）
  const z=zombies[zid];if(!z||z.userData.dead)return;
  z.userData.hp-=dmg;z.userData.flash=0.15;
  spawnP(z.position.x,z.position.y+1,z.position.z,0xff4400);
  spawnDmgNum(z.position.x,z.position.y+2,z.position.z,Math.round(dmg));
  if(z.userData.hp<=0)killZ(z)}

function killZ(z){
  z.userData.dead=true;
  const px=z.position.x,py=z.position.y+1,pz=z.position.z;
  if(z.userData.boss){P.iron+=2;P.stone+=3;spawnResAnim(px,py,pz,"iron",2);spawnResAnim(px,py,pz,"stone",3);showToast("💀 BOSS击杀！")}
  else{if(Math.random()<0.3){P.iron++;spawnResAnim(px,py,pz,"iron",1);showToast("🟠 获得铁块！")}
  else{P.stone+=2;spawnResAnim(px,py,pz,"stone",2);showToast("⬜ 获得石头×2")}}
  P.score+=z.userData.boss?20:5;P.kills++;
  if(netOk)netSend({t:"zk",zid},0)}

function updateZombies(dt){
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i],st=z.userData;
    if(st.dead){z.scale.multiplyScalar(.9);if(z.scale.x<.05){sc.remove(z);zombies.splice(i,1)}continue}
    if(st.flash>0){st.flash-=dt;z.children.forEach(c=>{if(c.material&&c.material.emissive)c.material.emissive.setRGB(st.flash*5,st.flash,0)})}
    // 血条朝向
    if(st.hbG){st.hbG.lookAt(cam.position);
      const pct=Math.max(0,st.hp/st.maxHp);
      st.hbFill.scale.x=pct;st.hbFill.position.x=-(1-pct)*0.5;
      st.hbFill.material.color.setHex(pct>0.5?0x00ff00:pct>0.25?0xffff00:0xff0000)}
    st.atkCd=Math.max(0,st.atkCd-dt);
    const d=z.position.distanceTo(P.pos);
    const dir=new T.Vector3();
    if(d<35&&P.hp>0){
      dir.copy(P.pos).sub(z.position);dir.y=0;
      if(dir.lengthSq()>.001)dir.normalize();
      if(d<1.6&&st.atkCd<=0){st.atkCd=1;damagePlayer(st.boss?4:2)}
    }else{
      if(!st.wp||z.position.distanceTo(st.wp)<1.5)
        st.wp=new T.Vector3(z.position.x+R(-10,10),0,z.position.z+R(-10,10));
      dir.copy(st.wp).sub(z.position);dir.y=0;
      if(dir.lengthSq()>.001)dir.normalize()}
    z.position.addScaledVector(dir,st.sp*dt);
    z.position.x=C(z.position.x,1,W-2);z.position.z=C(z.position.z,1,D-2);
    z.position.y=getH(Math.floor(z.position.x),Math.floor(z.position.z))+1;
    if(dir.lengthSq()>.01)z.rotation.y=Math.atan2(dir.x,dir.z);
    st.walk+=dt*8;const sw=Math.sin(st.walk)*.5;
    z.children[4].rotation.x=-sw;z.children[5].rotation.x=sw;
    z.children[6].rotation.x=-sw*.7;z.children[7].rotation.x=sw*.7;
    // 僵尸攻击围墙
    const bx=Math.floor(z.position.x),by=Math.floor(z.position.y),bz=Math.floor(z.position.z);
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
      const wk=key(bx+dx,by,bz+dz);
      if(builtBlocks.get(wk)===BW.WALL&&Math.random()<dt*0.5){
        builtBlocks.delete(wk);for(let j=0;j<4;j++)spawnP(bx+dx+.5,by+.5,bz+dz+.5,0x999999);rebuildBuilt()}}}}

// ============================ 箭塔/子弹 ============================
function updateTowers(dt){
  towers.forEach(tw=>{
    tw.cd=Math.max(0,tw.cd-dt);if(tw.cd>0)return;
    let nearest=null,nd=Infinity;
    zombies.forEach(z=>{if(z.userData.dead)return;
      const d=Math.sqrt((z.position.x-tw.x)**2+(z.position.y+1-tw.y)**2+(z.position.z-tw.z)**2);
      if(d<tw.range&&d<nd){nd=d;nearest=z}});
    if(!nearest)return;
    tw.cd=1.0;
    const dir=new T.Vector3(nearest.position.x-tw.x,(nearest.position.y+1)-tw.y,nearest.position.z-tw.z).normalize();
    // 箭矢
    const arrow=new T.Group();
    const shaft=new T.Mesh(new T.CylinderGeometry(0.03,0.03,1.2,4),new T.MeshLambertMaterial({color:0x8B4513}));
    shaft.rotation.x=Math.PI/2;
    const head=new T.Mesh(new T.ConeGeometry(0.08,0.3,4),new T.MeshLambertMaterial({color:0x666666}));
    head.position.z=-0.75;head.rotation.x=-Math.PI/2;
    arrow.add(shaft,head);arrow.position.set(tw.x,tw.y,tw.z);
    arrow.lookAt(nearest.position.x,nearest.position.y+1,nearest.position.z);sc.add(arrow);
    bullets.push({mesh:arrow,x:tw.x,y:tw.y,z:tw.z,vx:dir.x*20,vy:dir.y*20,vz:dir.z*20,life:2,dmg:tw.atk});
    for(let j=0;j<3;j++)spawnP(tw.x,tw.y+.5,tw.z,0xffaa00);
    if(netOk)netSend({t:"ts",ox:+tw.x.toFixed(1),oy:+tw.y.toFixed(1),oz:+tw.z.toFixed(1),tx:+nearest.position.x.toFixed(1),ty:+(nearest.position.y+1).toFixed(1),tz:+nearest.position.z.toFixed(1)},0);
  })}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.life-=dt;
    if(b.mesh){b.mesh.position.set(b.x,b.y,b.z);b.mesh.lookAt(b.x+b.vx,b.y+b.vy,b.z+b.vz)}
    if(b.life<=0){if(b.mesh)sc.remove(b.mesh);bullets.splice(i,1);continue}
    for(let j=zombies.length-1;j>=0;j--){
      const z=zombies[j];if(z.userData.dead)continue;
      const d=Math.sqrt((z.position.x-b.x)**2+(z.position.y+1-b.y)**2+(z.position.z-b.z)**2);
      if(d<1.5){
        applyZombieDamage(j,b.dmg);
        if(b.mesh)sc.remove(b.mesh);bullets.splice(i,1);break}}}}

let particles=[];

    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=10*dt;p.life-=dt;

function makeTextSprite(text,bgColor,w,h,font){
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const ctx=c.getContext("2d");if(bgColor){ctx.fillStyle=bgColor;ctx.fillRect(0,0,w,h)}
  ctx.fillStyle="#fff";ctx.font=font;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,w/2,h/2);
  return new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false}))}

function spawnDmgNum(x,y,z,dmg){
  const s=makeTextSprite("-"+dmg,"rgba(0,0,0,0)",64,32,"bold 24px Arial");
  s.position.set(x,y,z);s.scale.set(1,.5,1);sc.add(s);
  dmgNums.push({sprite:s,life:1.5,maxLife:1.5})}
function updateDmgNums(dt){
  for(let i=dmgNums.length-1;i>=0;i--){const d=dmgNums[i];
    d.life-=dt;d.sprite.position.y+=dt*2;d.sprite.material.opacity=d.life/d.maxLife;
    if(d.life<=0){sc.remove(d.sprite);d.sprite.material.map.dispose();d.sprite.material.dispose();dmgNums.splice(i,1)}}}

function spawnResAnim(x,y,z,kind,count){

    const s=makeTextSprite(kind==="iron"?"🟠":"⬜","rgba(0,0,0,0)",32,32,"20px Arial");
    s.position.set(x+(Math.random()-.5)*.6,y+Math.random(),z+(Math.random()-.5)*.6);
    s.scale.set(.5,.5,1);sc.add(s);resAnims.push({sprite:s,life:1.5,maxLife:1.5})}}
function updateResAnims(dt){
  for(let i=resAnims.length-1;i>=0;i--){const r=resAnims[i];
    r.life-=dt;r.sprite.position.y+=dt*3;r.sprite.material.opacity=r.life/r.maxLife;
    if(r.life<=0){sc.remove(r.sprite);r.sprite.material.map.dispose();r.sprite.material.dispose();resAnims.splice(i,1)}}}

// ============================ 网络（MQTT联机） ============================
let netOk=false,mqttClient=null;
let peers=new Map(); // peerId -> {pos,yaw,hp,name,last}
let actors=new Map(); // peerId -> mesh
let _nextWave=0,_nextWaveNet=0;

const BROKER1="wss://b21 mqtt.section.io:8884/mqtt";
const BROKER2="wss://broker.emqx.io:8084/mqtt";

function netStart(){
  if(typeof mqtt==="undefined"){showToast("联机模块加载失败（单机模式）");return}
  const opts={clientId:"sv_"+myId,connectTimeout:4000,reconnectPeriod:3000,clean:true};
  function tryConnect(url,idx){
    return new Promise((resolve,reject)=>{
      try{
        const c=mqtt.connect(url,opts);
        const timer=setTimeout(()=>{try{c.end(true)}catch(_){};reject("timeout")},5000);
        c.on("connect",()=>{clearTimeout(timer);resolve(c)});
        c.on("error",e=>{clearTimeout(timer);reject(e)});
      }catch(e){reject(e)}})}
  Promise.race([tryConnect(BROKER1,0),tryConnect(BROKER2,1)]).then(c=>{
    mqttClient=c;netOk=true;showToast("✅ 联机成功");
    c.subscribe("game/"+room+"/#");
    c.publish("game/"+room+"/join",JSON.stringify({id:myId,name:myName}));
    c.on("message",(topic,msg)=>{
      try{handleNet(JSON.parse(msg.toString()))}catch(_){}});
    // 心跳
    setInterval(()=>{if(netOk)netSend({t:"hb",id:myId,name:myName,x:+P.pos.x.toFixed(1),y:+P.pos.y.toFixed(1),z:+P.pos.z.toFixed(1),yaw:+P.yaw.toFixed(2),hp:P.hp},0)},100);
  }).catch(()=>{showToast("联机失败（单机模式）")})}

function netSend(obj,qos){
  if(!mqttClient||!netOk)return;
  try{mqttClient.publish("game/"+room+"/"+myId,JSON.stringify(obj),{qos:qos||0})}catch(_){}}

function handleNet(msg){
  if(msg.id===myId)return;
  if(msg.t==="hb"){
    if(!peers.has(msg.id)){peers.set(msg.id,{pos:new T.Vector3(msg.x,msg.y,msg.z),yaw:msg.yaw,hp:msg.hp,name:msg.name||"??",last:performance.now()});
      // 创建远程角色模型
      const g=new T.Group();
      const bm2=new T.MeshLambertMaterial({color:0x3366ff});
      g.add(new T.Mesh(new T.BoxGeometry(.7,.9,.4),bm2),new T.Mesh(new T.BoxGeometry(.45,.45,.45),bm2));
      g.children[0].position.y=.95;g.children[1].position.y=1.65;
      sc.add(g);actors.set(msg.id,g);
      showToast("👋 "+msg.name+" 加入了游戏")}
    else{
      const p=peers.get(msg.id);p.last=performance.now();
      p.pos.set(msg.x,msg.y,msg.z);p.yaw=msg.yaw;p.hp=msg.hp;p.name=msg.name||p.name}
    // 同步波次
    if(msg.wave!==undefined&&msg.wave>wave){wave=msg.wave;waveT=msg.waveT||25}
  }else if(msg.t==="bw"){
    builtBlocks.set(key(msg.x,msg.y,msg.z),BW.WALL);rebuildBuilt();
  }else if(msg.t==="rmb"){
    builtBlocks.delete(key(msg.x,msg.y,msg.z));rebuildBuilt();
  }else if(msg.t==="tw"){
    const bx=msg.x,by=msg.y,bz=msg.z;
    builtBlocks.set(key(bx,by,bz),BW.TOWER);builtBlocks.set(key(bx,by+1,bz),BW.TOWER);
    builtBlocks.set(key(bx,by+2,bz),BW.TOWER);builtBlocks.set(key(bx,by+3,bz),BW.TOWER_TOP);
    towers.push({x:bx+.5,y:by+4,z:bz+.5,hp:15,atk:4,range:14,cd:0,key:key(bx,by,bz)});
    rebuildBuilt();
  }else if(msg.t==="rmt"){
    for(let dy=0;dy<4;dy++)builtBlocks.delete(key(msg.x,msg.y+dy,msg.z));
    towers=towers.filter(tw=>tw.key!==key(msg.x,msg.y,msg.z));rebuildBuilt();
  }else if(msg.t==="ts"){
    // 远程箭矢视觉
    const dir=new T.Vector3(msg.tx-msg.ox,msg.ty-msg.oy,msg.tz-msg.oz).normalize();
    const arrow=new T.Group();
    const shaft=new T.Mesh(new T.CylinderGeometry(0.03,0.03,1.2,4),new T.MeshLambertMaterial({color:0x8B4513}));
    shaft.rotation.x=Math.PI/2;
    const head=new T.Mesh(new T.ConeGeometry(0.08,0.3,4),new T.MeshLambertMaterial({color:0x666666}));
    head.position.z=-0.75;head.rotation.x=-Math.PI/2;
    arrow.add(shaft,head);arrow.position.set(msg.ox,msg.oy,msg.oz);
    arrow.lookAt(msg.tx,msg.ty,msg.tz);sc.add(arrow);
    bullets.push({mesh:arrow,x:msg.ox,y:msg.oy,z:msg.oz,vx:dir.x*20,vy:dir.y*20,vz:dir.z*20,life:2,dmg:4});
  }else if(msg.t==="zk"){
    const z=zombies[msg.zid];if(z&&!z.userData.dead)killZ(z);
  }else if(msg.t==="wv"){
    // 波次同步
    if(msg.wave>wave){wave=msg.wave;waveT=msg.waveT||25}
  }}

function updatePeers(){
  actors.forEach((mesh,id)=>{
    const p=peers.get(id);
    if(!p||performance.now()-p.last>6000){sc.remove(mesh);actors.delete(id);peers.delete(id);return}
    mesh.position.copy(p.pos);mesh.rotation.y=p.yaw});
  // 同步波次给客户端
  if(netOk&&wave>0)netSend({t:"wv",wave,waveT:Math.max(0,waveT)},0)}

// ============================ 主循环 ============================
let lt=performance.now(),_fc=0;
let particlesList=particles;
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),dt=Math.min((now-lt)/1000,.05);lt=now;
  _fc++;

  // 世界重建（延迟）
  if(_rebuildT&&now>_rebuildT){_rebuildT=0;rebuildTerrain()}
  if(_rebuildBT&&now>_rebuildBT){_rebuildBT=0;rebuildBuilt()}

  if(P.dead){
    if(now>=P.respawn)respawn();
    ren.render(sc,cam);updateUI();return}

  // 玩家
  updatePlayer(dt);
  cam.position.copy(P.pos);cam.position.y+=EY;
  cam.rotation.order="YXZ";cam.rotation.y=P.yaw;cam.rotation.x=P.pitch;

  // 僵尸（主机模拟）
  updateZombies(dt);

  // 波次
  waveT-=dt;
  if(waveT<=0&&P.hp>0){spawnWave();waveT=Math.max(15,30-wave)}

  // 箭塔/子弹
  updateTowers(dt);updateBullets(dt);
  updateDmgNums(dt);updateResAnims(dt);updateParticles(dt);
  updatePeers();

  // 准星/建造预览
  const tgt=getTarget();
  if(tgt&&hlMesh){
    hlMesh.visible=true;hlMesh.position.set(tgt.x+.5,tgt.y+.5,tgt.z+.5);
    previewMesh.visible=true;previewMesh.position.set(tgt.nx+.5,tgt.ny+.5,tgt.nz+.5);
    if(hbar[slot]===11){
      rangeIndicator.visible=true;rangeIndicator.position.set(tgt.nx+.5,tgt.ny+.1,tgt.nz+.5);
      previewMesh.material.color.setHex(P.iron>=2?0x00ff00:0xff0000);
    }else{
      rangeIndicator.visible=false;
      previewMesh.material.color.setHex(P.stone>0?0x00ff00:0xff0000);
    }
  }else if(hlMesh){hlMesh.visible=false;rangeIndicator.visible=false;previewMesh.visible=false}

  ren.render(sc,cam);updateUI()}
let _rebuildT=0,_rebuildBT=0;
// 测试用暴露
window.P=P;window.zombies=zombies;window.towers=towers;window.blocks=blocks;window.builtBlocks=builtBlocks;window.doBuild=doBuild;window.doDemolish=doDemolish;window.selectSlot=i=>{slot=i};window.getTarget=getTarget;window.damagePlayer=damagePlayer;window.solidAt=solidAt;window.getH=getH;window.key=key;window.BW=BW;

// ============================ 启动 ============================
function startGame(){
  $("overlay").style.display="none";
  myName=($("name").value||"玩家").slice(0,12);
  room=($("room").value||"1").replace(/[^a-zA-Z0-9]/g,"")||"1";
  genWorld();rebuildTerrain();rebuildBuilt();createHL();
  P.pos.set(56,getH(56,56)+3,56);P.vel.set(0,0,0);
  try{cv.requestPointerLock()}catch(_){}
  netStart();
  showToast("⚔️ 建造围墙和箭塔，抵御僵尸！")}

$("btn-go").onclick=startGame;
cv.addEventListener("click",()=>{if(!document.pointerLockElement)cv.requestPointerLock()});
animate();
</script>

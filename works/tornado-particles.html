<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>龙卷风粒子漩涡</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
        canvas { display: block; }

        .info {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            user-select: none;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .title {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.20);
            font-size: 13px;
            letter-spacing: 4px;
            pointer-events: none;
            text-align: center;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="title">✦ 粒子龙卷风 ✦</div>
    <div class="info">🖱 拖拽旋转 &nbsp;·&nbsp; 滚轮缩放</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ─── Scene ───────────────────────────────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070f);
        // subtle fog for depth
        scene.fog = new THREE.FogExp2(0x05070f, 0.004);

        // ─── Camera ──────────────────────────────────────────────────────────────
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(9, 7, 9);

        // ─── Renderer ────────────────────────────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ─── Controls ────────────────────────────────────────────────────────────
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 2.5;
        controls.maxDistance = 45;
        controls.target.set(0, 5.5, 0);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.update();

        // ─── Clock ───────────────────────────────────────────────────────────────
        const clock = new THREE.Clock();

        // ══════════════════════════════════════════════════════════════════════════
        //  STARFIELD
        // ══════════════════════════════════════════════════════════════════════════

        function createStarfield() {
            const group = new THREE.Group();

            // --- white stars (small, numerous) ---
            const smallCount = 2500;
            const g1 = new THREE.BufferGeometry();
            const p1 = new Float32Array(smallCount * 3);
            const s1 = new Float32Array(smallCount);
            for (let i = 0; i < smallCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 80 + Math.random() * 120;
                p1[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                p1[i * 3 + 1] = r * Math.cos(phi);
                p1[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                s1[i] = 0.15 + Math.random() * 0.35;
            }
            g1.setAttribute('position', new THREE.BufferAttribute(p1, 3));
            g1.setAttribute('size', new THREE.BufferAttribute(s1, 1));

            const m1 = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 } },
                vertexShader: `
                    attribute float size;
                    varying float vAlpha;
                    uniform float uTime;
                    void main() {
                        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * (180.0 / -mvPos.z);
                        gl_Position  = projectionMatrix * mvPos;
                        // subtle twinkle
                        float twinkle = 0.7 + 0.3 * sin(uTime * (0.3 + size * 1.5) + position.x * 2.0 + position.z);
                        vAlpha = twinkle;
                    }
                `,
                fragmentShader: `
                    varying float vAlpha;
                    void main() {
                        float d = length(gl_PointCoord - vec2(0.5));
                        if (d > 0.5) discard;
                        float a = 1.0 - smoothstep(0.0, 0.5, d);
                        a = pow(a, 1.8);
                        gl_FragColor = vec4(1.0, 1.0, 1.0, a * vAlpha * 0.85);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
            });
            const stars1 = new THREE.Points(g1, m1);
            group.add(stars1);

            // --- colored stars (fewer, slightly larger) ---
            const colorCount = 400;
            const g2 = new THREE.BufferGeometry();
            const p2 = new Float32Array(colorCount * 3);
            const c2 = new Float32Array(colorCount * 3);
            const s2 = new Float32Array(colorCount);
            const col = new THREE.Color();
            for (let i = 0; i < colorCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 60 + Math.random() * 140;
                p2[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                p2[i * 3 + 1] = r * Math.cos(phi);
                p2[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                col.setHSL(0.55 + Math.random() * 0.35, 0.5, 0.6 + Math.random() * 0.4);
                c2[i * 3]     = col.r;
                c2[i * 3 + 1] = col.g;
                c2[i * 3 + 2] = col.b;
                s2[i] = 0.3 + Math.random() * 0.7;
            }
            g2.setAttribute('position', new THREE.BufferAttribute(p2, 3));
            g2.setAttribute('aColor', new THREE.BufferAttribute(c2, 3));
            g2.setAttribute('aSize', new THREE.BufferAttribute(s2, 1));

            const m2 = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 } },
                vertexShader: `
                    attribute float aSize;
                    attribute vec3 aColor;
                    varying vec3 vColor;
                    varying float vAlpha;
                    uniform float uTime;
                    void main() {
                        vColor = aColor;
                        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = aSize * (180.0 / -mvPos.z);
                        gl_Position  = projectionMatrix * mvPos;
                        float twinkle = 0.6 + 0.4 * sin(uTime * (0.2 + aSize * 1.2) + position.y * 3.0);
                        vAlpha = twinkle;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vAlpha;
                    void main() {
                        float d = length(gl_PointCoord - vec2(0.5));
                        if (d > 0.5) discard;
                        float a = 1.0 - smoothstep(0.0, 0.5, d);
                        a = pow(a, 2.0);
                        gl_FragColor = vec4(vColor, a * vAlpha * 0.7);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
            });
            const stars2 = new THREE.Points(g2, m2);
            group.add(stars2);

            return { group, m1, m2 };
        }

        const starfield = createStarfield();
        scene.add(starfield.group);

        // ══════════════════════════════════════════════════════════════════════════
        //  TORNADO PARTICLES
        // ══════════════════════════════════════════════════════════════════════════

        const PARTICLE_COUNT = 800;
        const STRANDS = 6;               // number of spiral arms
        const PTS_PER_STRAND = PARTICLE_COUNT / STRANDS;
        const TOTAL_HEIGHT = 14;
        const BASE_RADIUS = 4.5;
        const TOP_RADIUS = 0.2;
        const SPIRAL_TURNS = 3.5;
        const TURBULENCE = 0.15;

        // per-particle metadata for animation
        const particleMeta = [];

        // geometry buffers
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(PARTICLE_COUNT * 3);
        const col = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);

        const tmpColor = new THREE.Color();

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const strandIdx = i % STRANDS;
            const t = Math.floor(i / STRANDS) / PTS_PER_STRAND; // 0..1

            // noise offsets for organic feel
            const nX = (Math.random() - 0.5) * TURBULENCE;
            const nZ = (Math.random() - 0.5) * TURBULENCE;
            const nY = (Math.random() - 0.5) * TURBULENCE * 0.5;
            const phase = Math.random() * Math.PI * 2;

            // initial position
            const y = t * TOTAL_HEIGHT;
            const radius = BASE_RADIUS * (1 - t) + TOP_RADIUS * t;
            const angle = t * Math.PI * 2 * SPIRAL_TURNS + (strandIdx / STRANDS) * Math.PI * 2;

            pos[i * 3]     = Math.cos(angle) * radius + nX;
            pos[i * 3 + 1] = y + nY;
            pos[i * 3 + 2] = Math.sin(angle) * radius + nZ;

            // rainbow colour — hue shifts with height and strand
            const hue = (t * 0.72 + strandIdx * 0.025 + 0.0) % 1.0;
            tmpColor.setHSL(hue, 0.85, 0.5 + Math.random() * 0.35);
            col[i * 3]     = tmpColor.r;
            col[i * 3 + 1] = tmpColor.g;
            col[i * 3 + 2] = tmpColor.b;

            // size: larger at bottom, smaller at top, with randomness
            const baseSize = 0.07 + (1 - t) * 0.22;
            sizes[i] = baseSize * (0.7 + Math.random() * 0.6);

            particleMeta.push({
                strandIdx,
                t0: t,
                nX, nZ, nY, phase,
                hue,
                baseSize,
                sat: 0.85,
                light: 0.5 + Math.random() * 0.35,
            });
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
        geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

        // ─── Tornado shader material ─────────────────────────────────────────────
        const tornadoMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPixelRatio: { value: renderer.getPixelRatio() },
            },
            vertexShader: `
                attribute float aSize;
                attribute vec3 aColor;
                varying vec3 vColor;
                varying float vAlpha;
                uniform float uPixelRatio;

                void main() {
                    vColor = aColor;
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    float scale = uPixelRatio * 280.0;
                    gl_PointSize = aSize * (scale / -mvPos.z);
                    gl_Position  = projectionMatrix * mvPos;

                    // slight brightness variation per particle (subtle shimmer)
                    vAlpha = 0.85 + 0.15 * sin(position.x * 5.0 + position.y * 3.0 + position.z * 7.0);
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float d = length(uv);
                    if (d > 0.5) discard;

                    // soft glow: bright core → soft edge
                    float alpha = 1.0 - smoothstep(0.0, 0.5, d);
                    alpha = pow(alpha, 1.6);

                    // slight hot center
                    float core = 1.0 - smoothstep(0.0, 0.2, d);
                    vec3 color = vColor + vec3(0.25) * core;

                    gl_FragColor = vec4(color, alpha * vAlpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });

        const tornado = new THREE.Points(geo, tornadoMaterial);
        scene.add(tornado);

        // ─── Inner core glow (bright central column, small particles) ────────────
        const coreCount = 120;
        const coreGeo = new THREE.BufferGeometry();
        const corePos = new Float32Array(coreCount * 3);
        const coreCol = new Float32Array(coreCount * 3);
        const coreSizes = new Float32Array(coreCount);
        const coreMeta = [];

        for (let i = 0; i < coreCount; i++) {
            const t = i / coreCount;
            const y = t * TOTAL_HEIGHT;
            const spread = 0.15 + t * 0.3;
            corePos[i * 3]     = (Math.random() - 0.5) * spread;
            corePos[i * 3 + 1] = y;
            corePos[i * 3 + 2] = (Math.random() - 0.5) * spread;
            const hue = (t * 0.6 + 0.1) % 1.0;
            tmpColor.setHSL(hue, 0.9, 0.7);
            coreCol[i * 3]     = tmpColor.r;
            coreCol[i * 3 + 1] = tmpColor.g;
            coreCol[i * 3 + 2] = tmpColor.b;
            coreSizes[i] = 0.04 + (1 - t) * 0.12;
            coreMeta.push({ t0: t, phase: Math.random() * Math.PI * 2 });
        }
        coreGeo.setAttribute('position', new THREE.BufferAttribute(corePos, 3));
        coreGeo.setAttribute('aColor', new THREE.BufferAttribute(coreCol, 3));
        coreGeo.setAttribute('aSize', new THREE.BufferAttribute(coreSizes, 1));

        const coreMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPixelRatio: { value: renderer.getPixelRatio() },
            },
            vertexShader: `
                attribute float aSize;
                attribute vec3 aColor;
                varying vec3 vColor;
                uniform float uPixelRatio;
                void main() {
                    vColor = aColor;
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = aSize * (uPixelRatio * 350.0 / -mvPos.z);
                    gl_Position = projectionMatrix * mvPos;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    if (d > 0.5) discard;
                    float a = 1.0 - smoothstep(0.0, 0.5, d);
                    a = pow(a, 1.4);
                    gl_FragColor = vec4(vColor, a * 0.8);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });

        const corePoints = new THREE.Points(coreGeo, coreMat);
        scene.add(corePoints);

        // ─── Ground glow ring ─────────────────────────────────────────────────────
        const ringGeo = new THREE.RingGeometry(3.5, 5.5, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x4466ff,
            transparent: true,
            opacity: 0.06,
            side: THREE.DoubleSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.1;
        scene.add(ring);

        // secondary ring
        const ringGeo2 = new THREE.RingGeometry(2.0, 3.6, 64);
        const ringMat2 = new THREE.MeshBasicMaterial({
            color: 0xff66aa,
            transparent: true,
            opacity: 0.04,
            side: THREE.DoubleSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.x = -Math.PI / 2;
        ring2.position.y = 0.05;
        scene.add(ring2);

        // ══════════════════════════════════════════════════════════════════════════
        //  ANIMATION LOOP
        // ══════════════════════════════════════════════════════════════════════════

        function updateParticles(time) {
            const p = geo.attributes.position.array;
            const c = geo.attributes.aColor.array;
            const s = geo.attributes.aSize.array;
            const flowSpeed = 0.06;   // how fast particles rise
            const spinSpeed = 0.45;   // rotation speed

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const m = particleMeta[i];
                // animate t upward, wrap around
                let t = (m.t0 + time * flowSpeed) % 1.0;

                // ease for more concentration near top/bottom? keep linear for now

                const y = t * TOTAL_HEIGHT;
                const radius = BASE_RADIUS * (1 - t) + TOP_RADIUS * t;
                const angleOffset = (m.strandIdx / STRANDS) * Math.PI * 2;
                const spiralAngle = t * Math.PI * 2 * SPIRAL_TURNS + angleOffset + time * spinSpeed;

                // add some wobble
                const wobble = 0.08 * Math.sin(t * Math.PI * 4 + time * 0.7 + m.phase);
                const wobble2 = 0.08 * Math.cos(t * Math.PI * 4 + time * 0.7 + m.phase * 1.3);

                p[i * 3]     = Math.cos(spiralAngle) * (radius + wobble) + m.nX;
                p[i * 3 + 1] = y + m.nY + 0.05 * Math.sin(time * 0.5 + m.phase);
                p[i * 3 + 2] = Math.sin(spiralAngle) * (radius + wobble2) + m.nZ;

                // update color for dynamic rainbow (optional)
                const hue = (t * 0.72 + m.strandIdx * 0.025 + 0.0) % 1.0;
                tmpColor.setHSL(hue, m.sat, 0.5 + Math.random() * 0.1);
                c[i * 3]     = tmpColor.r;
                c[i * 3 + 1] = tmpColor.g;
                c[i * 3 + 2] = tmpColor.b;

                // size decreases as particles rise
                s[i] = m.baseSize * (0.4 + 0.6 * (1 - t));
            }

            geo.attributes.position.needsUpdate = true;
            geo.attributes.aColor.needsUpdate = true;
            geo.attributes.aSize.needsUpdate = true;
        }

        function updateCore(time) {
            const p = coreGeo.attributes.position.array;
            const flowSpeed = 0.07;
            const spread = 0.15;

            for (let i = 0; i < coreCount; i++) {
                const m = coreMeta[i];
                let t = (m.t0 + time * flowSpeed) % 1.0;
                const y = t * TOTAL_HEIGHT;
                const r = spread + t * 0.35;
                const angle = time * 0.6 + m.phase;
                p[i * 3]     = Math.cos(angle) * r * (0.3 + 0.7 * Math.random());
                p[i * 3 + 1] = y + 0.03 * Math.sin(time * 0.8 + m.phase);
                p[i * 3 + 2] = Math.sin(angle) * r * (0.3 + 0.7 * Math.random());
            }
            coreGeo.attributes.position.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // update uniforms for star twinkle
            starfield.m1.uniforms.uTime.value = elapsed;
            starfield.m2.uniforms.uTime.value = elapsed;

            // animate tornado particles
            updateParticles(elapsed);
            updateCore(elapsed);

            // animate ground glow rings
            ring.rotation.z = elapsed * 0.08;
            ring.material.opacity = 0.05 + 0.025 * Math.sin(elapsed * 0.3);
            ring2.rotation.z = -elapsed * 0.12;
            ring2.material.opacity = 0.03 + 0.02 * Math.sin(elapsed * 0.4 + 1.0);

            // slight scale pulse on core
            const pulse = 1 + 0.015 * Math.sin(elapsed * 0.5);
            corePoints.scale.set(pulse, 1, pulse);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ══════════════════════════════════════════════════════════════════════════
        //  RESIZE
        // ══════════════════════════════════════════════════════════════════════════

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ══════════════════════════════════════════════════════════════════════════
        //  KEYBOARD SHORTCUT: [Space] toggle auto-rotate
        // ══════════════════════════════════════════════════════════════════════════

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                controls.autoRotate = !controls.autoRotate;
            }
        });

        // small log
        console.log('🌀 龙卷风粒子漩涡已启动 — 拖拽旋转 · 滚轮缩放 · Space 切换自动旋转');
    </script>

</body>
</html>

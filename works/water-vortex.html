<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌊 水旋涡 · 粒子投放</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #050a15; font-family: 'Microsoft YaHei', sans-serif; }
        canvas { display: block; }

        .info {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180,220,255,0.50);
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 0 30px rgba(0,20,60,0.95);
            user-select: none;
            background: rgba(0,20,50,0.40);
            padding: 8px 22px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(100,200,255,0.10);
            white-space: nowrap;
            letter-spacing: 0.5px;
            z-index: 10;
        }
        .info span { display: inline-block; animation: pulseInfo 2.5s ease-in-out infinite; }
        @keyframes pulseInfo { 0%,100%{opacity:0.5} 50%{opacity:1} }

        #dropBtn {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: auto;
            background: rgba(200,220,255,0.08);
            border: 1px solid rgba(100,200,255,0.20);
            color: rgba(200,230,255,0.7);
            padding: 6px 18px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        #dropBtn:hover {
            background: rgba(200,220,255,0.15);
            border-color: rgba(100,200,255,0.4);
            color: rgba(200,230,255,1);
        }
    </style>
</head>
<body>

    <div class="info"><span>🖱 点击投放粒子</span> <span style="opacity:0.4;">·</span> <span>拖拽旋转</span> <span style="opacity:0.4;">·</span> <span>滚轮缩放</span></div>
    <button id="dropBtn">💧 投放粒子</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ═══════════════════════════════════════════════════════════
        //  SCENE SETUP
        // ═══════════════════════════════════════════════════════════
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1e2e);
        scene.fog = new THREE.FogExp2(0x0a1e2e, 0.0025);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(12, 8, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 5;
        controls.maxDistance = 50;
        controls.target.set(0, 2.5, 0);
        controls.autoRotate = false;
        controls.update();

        const clock = new THREE.Clock();

        // ═══════════════════════════════════════════════════════════
        //  WATER VORTEX PARAMETERS
        // ═══════════════════════════════════════════════════════════
        const VORTEX = {
            height: 8,          // total height
            topRadius: 4.5,     // wide top (funnel mouth)
            bottomRadius: 0.3,  // narrow bottom
            funnelDepth: 2.8,   // how deep the funnel dip goes from top
            turns: 3.5,         // spiral rotation count
        };

        // ═══════════════════════════════════════════════════════════
        //  STARFIELD  (subtle, deep blue)
        // ═══════════════════════════════════════════════════════════
        function createStarfield() {
            const g = new THREE.Group();
            const wCount = 3000;
            const gw = new THREE.BufferGeometry();
            const pw = new Float32Array(wCount * 3);
            for (let i = 0; i < wCount; i++) {
                const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
                const r = 120 + Math.random() * 250;
                pw[i*3]=r*Math.sin(ph)*Math.cos(th); pw[i*3+1]=r*Math.cos(ph); pw[i*3+2]=r*Math.sin(ph)*Math.sin(th);
            }
            gw.setAttribute('position', new THREE.BufferAttribute(pw, 3));
            const mw = new THREE.PointsMaterial({
                color: 0x337799, size: 0.10, transparent: true, opacity: 0.12,
                depthWrite: false, blending: THREE.AdditiveBlending,
            });
            g.add(new THREE.Points(gw, mw));
            return g;
        }
        scene.add(createStarfield());

        // ═══════════════════════════════════════════════════════════
        //  WATER SURFACE — 半透明水旋涡漏斗
        // ═══════════════════════════════════════════════════════════
        function createWaterSurface() {
            const group = new THREE.Group();

            // --- main funnel mesh (semi-transparent blue) ---
            const segV = 48, segH = 48;
            const vertices = [], indices = [], uvs = [];

            for (let j = 0; j <= segV; j++) {
                const v = j / segV;  // 0=bottom, 1=top
                // funnel profile: wider at top, narrow at bottom, dip at top center
                const radius = VORTEX.bottomRadius + (VORTEX.topRadius - VORTEX.bottomRadius) * Math.pow(v, 0.7);
                // y position: bottom to top
                const y = v * VORTEX.height;
                // ripple effect using noise-like sine
                const ripple = 0.03 * Math.sin(v * 12 + 1.5) * (1 - v * 0.7);

                for (let i = 0; i <= segH; i++) {
                    const u = i / segH;
                    const angle = u * Math.PI * 2;
                    const r = radius + ripple;
                    vertices.push(
                        Math.cos(angle) * r,
                        y,
                        Math.sin(angle) * r
                    );
                    uvs.push(u, v);
                }
            }

            for (let j = 0; j < segV; j++) {
                for (let i = 0; i < segH; i++) {
                    const a = j * (segH + 1) + i;
                    const b = a + segH + 1;
                    indices.push(a, b, a + 1);
                    indices.push(b, b + 1, a + 1);
                }
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geom.setIndex(indices);
            geom.computeVertexNormals();

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uLightDir: { value: new THREE.Vector3(0.3, 0.8, 0.5).normalize() },
                },
                vertexShader: `
                    uniform float uTime;
                    varying vec2 vUv;
                    varying vec3 vPos;

                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        float angle = atan(pos.z, pos.x);
                        float radius = length(pos.xz);
                        float h = uv.y;

                        // 5-Octave Gerstner waves for natural water surface
                        float amp[5]; float freq[5]; float spd[5]; float stp[5]; float dx[5]; float dy[5];
                        amp[0]=0.10; freq[0]=1.2; spd[0]=0.6; stp[0]=0.35; dx[0]=1.0; dy[0]=0.4;
                        amp[1]=0.07; freq[1]=1.8; spd[1]=0.7; stp[1]=0.30; dx[1]=0.5; dy[1]=1.0;
                        amp[2]=0.05; freq[2]=2.5; spd[2]=0.5; stp[2]=0.25; dx[2]=1.5; dy[2]=-0.5;
                        amp[3]=0.03; freq[3]=3.5; spd[3]=0.9; stp[3]=0.20; dx[3]=2.0; dy[3]=0.3;
                        amp[4]=0.02; freq[4]=5.0; spd[4]=1.0; stp[4]=0.15; dx[4]=0.8; dy[4]=-0.6;

                        float totalU = 0.0, totalV = 0.0, totalY = 0.0;

                        for (int i = 0; i < 5; i++) {
                            float theta = dx[i] * angle + dy[i] * h * 6.28;
                            float phi = freq[i] * theta + uTime * spd[i];
                            float S = sin(phi);
                            float C = cos(phi);
                            float Qi = stp[i] / (freq[i] * amp[i] * 5.0);
                            totalU += Qi * amp[i] * dx[i] * C;
                            totalV += Qi * amp[i] * dy[i] * C;
                            totalY += amp[i] * S;
                        }

                        float hF = 0.2 + 0.8 * h;
                        float newAngle = angle + totalU * 0.4 * hF;
                        float newR = max(0.05, radius + totalY * 0.55 * hF);
                        float newY = pos.y + totalV * 0.25 * hF;

                        pos.x = newR * cos(newAngle);
                        pos.z = newR * sin(newAngle);
                        pos.y = newY;

                        vec4 mPos = modelMatrix * vec4(pos, 1.0);
                        vPos = mPos.xyz;
                        gl_Position = projectionMatrix * viewMatrix * mPos;
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform vec3 uLightDir;
                    varying vec2 vUv;
                    varying vec3 vPos;

                    void main() {
                        // Screen-space derivative normals (capture Gerstner wave detail)
                        vec3 fdx = dFdx(vPos);
                        vec3 fdy = dFdy(vPos);
                        vec3 N = normalize(cross(fdx, fdy));

                        vec3 V = normalize(cameraPosition - vPos);
                        vec3 L = normalize(uLightDir);
                        vec3 H = normalize(L + V);

                        float fresnel = 1.0 - max(dot(N, V), 0.0);
                        fresnel = pow(fresnel, 3.0);

                        float depth = 1.0 - vUv.y;

                        // ═══ Flowing water texture ═══
                        float angle = atan(vPos.x, vPos.z);
                        float radius = length(vPos.xz);

                        float c1 = 0.5 + 0.5 * sin(angle * 4.0 + uTime * 0.6 + vUv.y * 5.0);
                        float c2 = 0.5 + 0.5 * sin(angle * 6.0 - uTime * 0.8 + vUv.y * 7.0 + 1.2);
                        float rd = 0.5 + 0.5 * sin(radius * 3.0 - uTime * 0.5 + vUv.y * 4.0);
                        float vt = 0.5 + 0.5 * sin(vUv.y * 10.0 - uTime * 0.7 + angle * 3.0);
                        float dt = 0.5 + 0.5 * sin(vUv.x * 25.0 + vUv.y * 18.0 + uTime * 1.0);
                        float flow = c1 * 0.30 + c2 * 0.25 + rd * 0.20 + vt * 0.15 + dt * 0.10;

                        // ═══ Caustic light patterns ═══
                        float caust1 = 0.5 + 0.5 * sin(angle * 8.0 + vUv.y * 12.0 + uTime * 0.8);
                        float caust2 = 0.5 + 0.5 * sin(angle * 5.0 - vUv.y * 15.0 + uTime * 1.2 + radius * 2.0);
                        float caust3 = 0.5 + 0.5 * sin(angle * 12.0 + vUv.y * 8.0 - uTime * 0.6 + radius * 3.0);
                        float caustics = caust1 * caust2 * 0.7 + caust3 * 0.3;
                        caustics = pow(caustics, 1.5);

                        // ═══ Blinn-Phong specular ═══
                        float spec = pow(max(dot(N, H), 0.0), 64.0);
                        float specShimmer = pow(max(dot(N, H), 0.0), 128.0) * 0.5;

                        // ═══ Lake water color ═══
                        vec3 deepC = vec3(0.02, 0.12, 0.18);
                        vec3 shalC = vec3(0.06, 0.30, 0.35);
                        vec3 waterC = mix(deepC, shalC, depth);

                        vec3 caustC = vec3(0.15, 0.40, 0.35) * caustics * 0.4;
                        vec3 flowC = vec3(0.10, 0.32, 0.40) * flow * 0.5;

                        vec3 rimC = mix(
                            vec3(0.20, 0.45, 0.55),
                            vec3(0.60, 0.75, 0.85),
                            fresnel
                        ) * fresnel * 0.6;

                        vec3 specC = vec3(0.90, 0.95, 1.0) * (spec * 0.8 + specShimmer);

                        vec3 finalC = waterC + caustC + flowC + rimC + specC;

                        float alpha = 0.20 + 0.40 * (1.0 - vUv.y);
                        alpha += fresnel * 0.15;

                        gl_FragColor = vec4(finalC, alpha);
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.NormalBlending,
            });

            const mesh = new THREE.Mesh(geom, mat);
            group.add(mesh);

            // --- water surface rings (ripple lines on surface) ---
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x4488cc,
                transparent: true,
                opacity: 0.06,
                side: THREE.DoubleSide,
                depthWrite: false,
                wireframe: true,
            });
            const ringGeo = new THREE.CylinderGeometry(VORTEX.topRadius * 0.3, VORTEX.bottomRadius * 0.3, VORTEX.height, 32, 8, true);
            const wireMesh = new THREE.Mesh(ringGeo, ringMat);
            wireMesh.position.y = VORTEX.height / 2;
            group.add(wireMesh);

            return { group, mat };
        }

        const water = createWaterSurface();
        scene.add(water.group);

        // ═══════════════════════════════════════════════════════════
        //  VORTEX PARTICLE SYSTEM  — 黄色大粒子
        // ═══════════════════════════════════════════════════════════
        //  States:  0=FLOATING (awaiting capture)
        //           1=CAPTURED (being sucked to top)
        //           2=SPIRALING (going down the funnel)
        //           3=DYING (at bottom, fade out)
        // ═══════════════════════════════════════════════════════════

        const MAX_PARTICLES = 500;
        const SPAWN_RADIUS = 7;      // how far from center particles spawn
        const CAPTURE_RADIUS = 6;    // within this range, particles get captured
        const FLOAT_HEIGHT_RANGE = 5;

        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(MAX_PARTICLES * 3);
        const col = new Float32Array(MAX_PARTICLES * 3);
        const sz = new Float32Array(MAX_PARTICLES);
        const alphaArr = new Float32Array(MAX_PARTICLES);

        // 初始全部隐藏
        for (let i = 0; i < MAX_PARTICLES; i++) {
            pos[i*3] = 0; pos[i*3+1] = -999; pos[i*3+2] = 0;
            col[i*3] = 1; col[i*3+1] = 0.85; col[i*3+2] = 0.3;
            sz[i] = 0;
            alphaArr[i] = 0;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
        geo.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
        geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphaArr, 1));

        const particleMat = new THREE.ShaderMaterial({
            uniforms: {
                uPR: { value: renderer.getPixelRatio() },
            },
            vertexShader: `
                attribute float aSize; attribute vec3 aColor; attribute float aAlpha;
                varying vec3 vC; varying float vA; uniform float uPR;
                void main() {
                    vC = aColor;
                    vec4 m = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = aSize * (uPR * 360.0 / -m.z);
                    gl_Position = projectionMatrix * m;
                    vA = aAlpha;
                }
            `,
            fragmentShader: `
                varying vec3 vC; varying float vA;
                void main() {
                    float d = length(gl_PointCoord - 0.5);
                    if (d > 0.5) discard;
                    // soft circle with glow
                    float alpha = pow(1.0 - smoothstep(0.0, 0.5, d), 1.2);
                    float core = 1.0 - smoothstep(0.0, 0.15, d);
                    vec3 color = vC + vec3(0.2, 0.1, 0.0) * core;
                    gl_FragColor = vec4(color, alpha * vA);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const particleSystem = new THREE.Points(geo, particleMat);
        scene.add(particleSystem);

        // particle metadata
        const P = [];
        let nextParticleId = 0;

        function spawnParticle(x, y, z) {
            // find a dead slot or use next
            let idx = -1;
            for (let i = 0; i < MAX_PARTICLES; i++) {
                if (P[i] && P[i].state === -1) { idx = i; break; }
            }
            if (idx === -1) {
                if (P.length >= MAX_PARTICLES) return null;
                idx = P.length;
            }

            const hue = 0.10 + Math.random() * 0.10; // yellow range
            const m = {
                state: 0,  // FLOATING
                x, y, z,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.15,
                vz: (Math.random() - 0.5) * 0.3,
                hue,
                size: 0.12 + Math.random() * 0.15,  // larger particles
                alpha: 0.8 + Math.random() * 0.2,
                // capture
                captureProgress: 0,
                captureStartX: x, captureStartY: y, captureStartZ: z,
                // spiral
                spiralT: 0,
                spiralAngle: 0,
                spiralSpeed: 0,
                // dying
                dieAlpha: 1,
            };
            P[idx] = m;
            return idx;
        }

        function dropParticlesAt(mouseX, mouseY) {
            // convert mouse to 3D position near water surface
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(mouseX, mouseY);
            raycaster.setFromCamera(mouse, camera);

            // find intersection with a horizontal plane at water surface height
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersect = new THREE.Vector3();
            const ray = raycaster.ray;
            const denom = ray.direction.dot(plane.normal);
            if (Math.abs(denom) < 0.001) return;

            const t = -(ray.origin.dot(plane.normal) + plane.constant) / denom;
            if (t < 0) return;

            intersect.copy(ray.origin).add(ray.direction.clone().multiplyScalar(t));

            // spawn cluster of particles around that point
            const centerX = intersect.x, centerZ = intersect.z;
            const count = 5 + Math.floor(Math.random() * 6);
            for (let i = 0; i < count; i++) {
                const ox = (Math.random() - 0.5) * 2.0;
                const oz = (Math.random() - 0.5) * 2.0;
                const y = FLOAT_HEIGHT_RANGE * (0.2 + Math.random() * 0.6);
                spawnParticle(centerX + ox, y, centerZ + oz);
            }
        }

        // spawn some initial particles
        for (let i = 0; i < 30; i++) {
            const ang = Math.random() * Math.PI * 2;
            const r = 1 + Math.random() * (SPAWN_RADIUS - 1);
            spawnParticle(Math.cos(ang) * r, Math.random() * FLOAT_HEIGHT_RANGE * 0.6, Math.sin(ang) * r);
        }

        // === UPDATE PARTICLES ===
        function updateParticles(dt, time) {
            // --- check for mouse-click capture ---
            for (let i = 0; i < P.length; i++) {
                const m = P[i];
                if (!m || m.state === -1) continue;

                switch (m.state) {
                    case 0: { // FLOATING
                        // random drift
                        m.x += m.vx * dt;
                        m.y += m.vy * dt;
                        m.z += m.vz * dt;
                        // random wander
                        m.vx += (Math.random() - 0.5) * 0.5 * dt;
                        m.vy += (Math.random() - 0.5) * 0.3 * dt;
                        m.vz += (Math.random() - 0.5) * 0.5 * dt;
                        // limit speed
                        const spd = Math.sqrt(m.vx*m.vx + m.vy*m.vy + m.vz*m.vz);
                        if (spd > 0.6) { m.vx *= 0.6/spd; m.vy *= 0.6/spd; m.vz *= 0.6/spd; }

                        // boundary
                        if (m.y < -1) { m.y = -1; m.vy *= -0.3; }
                        if (m.y > FLOAT_HEIGHT_RANGE + 1) { m.y = FLOAT_HEIGHT_RANGE + 1; m.vy *= -0.3; }

                        // check if within capture radius of vortex center
                        const dist = Math.sqrt(m.x*m.x + m.z*m.z);
                        if (dist < CAPTURE_RADIUS && m.y < VORTEX.height * 0.9) {
                            // start capture
                            m.state = 1;
                            m.captureProgress = 0;
                            m.captureStartX = m.x;
                            m.captureStartY = m.y;
                            m.captureStartZ = m.z;
                            m.spiralAngle = Math.atan2(m.z, m.x) + (Math.random() - 0.5) * 0.8;
                            m.spiralSpeed = 0.8 + Math.random() * 0.3;
                        }
                        break;
                    }
                    case 1: { // CAPTURED — being pulled to top
                        m.captureProgress += dt * (0.3 + m.captureProgress * 0.4);
                        if (m.captureProgress >= 1) {
                            m.state = 2;
                            m.spiralT = 0.95;  // start near top
                            m.spiralAngle = m.spiralAngle + Math.random() * 0.5;
                        }
                        // position interpolation with spiral
                        const t = m.captureProgress;
                        const e = t * t * (3 - 2 * t); // smoothstep
                        // target: top of vortex
                        const targetR = 0.3 + (1 - e) * 1.2;
                        const targetY = VORTEX.height * 0.98;
                        const targetAngle = m.spiralAngle + t * 4;

                        m.x = Math.cos(targetAngle) * targetR * Math.sin(t * Math.PI);
                        m.y = m.captureStartY + (targetY - m.captureStartY) * e;
                        m.z = Math.sin(targetAngle) * targetR * Math.sin(t * Math.PI);

                        // glow up
                        m.alpha = 0.5 + t * 0.5;
                        break;
                    }
                    case 2: { // SPIRALING — descending the funnel
                        const speedFactor = 1 + (1 - m.spiralT) * 4.0;
                        m.spiralT -= dt * 0.12 * speedFactor;
                        m.spiralAngle += dt * (2.0 + (1 - m.spiralT) * 3.0);

                        if (m.spiralT <= 0) {
                            m.state = 3;
                            m.dieAlpha = 1;
                            break;
                        }

                        // position on funnel
                        const t2 = m.spiralT;
                        const r = VORTEX.bottomRadius + (VORTEX.topRadius - VORTEX.bottomRadius) * Math.pow(t2, 0.7);
                        const y = t2 * VORTEX.height;
                        // add slight wobble
                        const wobble = 0.06 * (1 - t2) * Math.sin(m.spiralAngle * 2 + time * 0.5);

                        m.x = Math.cos(m.spiralAngle) * (r + wobble);
                        m.y = y;
                        m.z = Math.sin(m.spiralAngle) * (r + wobble);

                        // brightness: bright at top, dimming toward bottom
                        m.alpha = 0.85 + 0.15 * Math.sin(time * 0.3 + m.spiralAngle);
                        break;
                    }
                    case 3: { // DYING — fade out at bottom
                        m.dieAlpha -= dt * 0.8;
                        m.alpha = Math.max(0, m.dieAlpha);
                        // small dispersion
                        m.x += (Math.random() - 0.5) * 0.05;
                        m.z += (Math.random() - 0.5) * 0.05;
                        m.y -= dt * 0.1;
                        if (m.dieAlpha <= 0) {
                            m.state = -1; // dead
                        }
                        break;
                    }
                }

                // write buffer data
                const idx = P.indexOf(m);
                if (idx >= 0) {
                    const posArr = geo.attributes.position.array;
                    const colArr = geo.attributes.aColor.array;
                    const szArr = geo.attributes.aSize.array;
                    const alphaArr2 = geo.attributes.aAlpha.array;

                    if (m.state === -1) {
                        posArr[idx*3] = 0; posArr[idx*3+1] = -999; posArr[idx*3+2] = 0;
                        szArr[idx] = 0;
                        alphaArr2[idx] = 0;
                    } else {
                        posArr[idx*3] = m.x;
                        posArr[idx*3+1] = m.y;
                        posArr[idx*3+2] = m.z;

                        // yellow color with brightness based on state
                        const bright = 0.6 + 0.4 * m.alpha;
                        const hueShift = m.hue + (m.state === 2 ? (1 - m.spiralT) * 0.05 : 0);
                        const tmpC = new THREE.Color().setHSL(hueShift, 0.85, 0.45 + 0.40 * m.alpha);
                        colArr[idx*3] = tmpC.r;
                        colArr[idx*3+1] = tmpC.g;
                        colArr[idx*3+2] = tmpC.b;

                        // size: bigger when captured, shrink when dying
                        let size = m.size;
                        if (m.state === 1) size = m.size * (0.6 + 0.4 * m.captureProgress);
                        else if (m.state === 2) size = m.size * (0.8 + 0.2 * (1 - m.spiralT));
                        else if (m.state === 3) size = m.size * m.dieAlpha;

                        szArr[idx] = Math.max(0.03, size);
                        alphaArr2[idx] = m.alpha;
                    }

                    geo.attributes.position.needsUpdate = true;
                    geo.attributes.aColor.needsUpdate = true;
                    geo.attributes.aSize.needsUpdate = true;
                    geo.attributes.aAlpha.needsUpdate = true;
                }
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  WATER RIPPLE (visual effect at top)
        // ═══════════════════════════════════════════════════════════
        const rippleRing = new THREE.Mesh(
            new THREE.RingGeometry(VORTEX.topRadius * 0.5, VORTEX.topRadius * 1.2, 48),
            new THREE.MeshBasicMaterial({
                color: 0x4488ff,
                transparent: true,
                opacity: 0.06,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
            })
        );
        rippleRing.position.y = VORTEX.height * 0.99;
        rippleRing.rotation.x = -Math.PI / 2;
        scene.add(rippleRing);

        // bottom glow
        const bottomGlow = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 16, 16),
            new THREE.MeshBasicMaterial({
                color: 0x2266aa,
                transparent: true,
                opacity: 0.05,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
            })
        );
        bottomGlow.position.y = 0;
        scene.add(bottomGlow);

        // ═══════════════════════════════════════════════════════════
        //  MOUSE / KEYBOARD INTERACTION
        // ═══════════════════════════════════════════════════════════
        renderer.domElement.addEventListener('click', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            dropParticlesAt(x, y);
        });

        document.getElementById('dropBtn').addEventListener('click', () => {
            // drop particles at random positions around the vortex
            for (let i = 0; i < 8; i++) {
                const ang = Math.random() * Math.PI * 2;
                const r = 2 + Math.random() * (SPAWN_RADIUS - 2);
                spawnParticle(Math.cos(ang) * r, Math.random() * FLOAT_HEIGHT_RANGE * 0.5, Math.sin(ang) * r);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); controls.autoRotate = !controls.autoRotate; }
            if (e.code === 'KeyG') { // 'G' for drop
                for (let i = 0; i < 12; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const r = 2 + Math.random() * (SPAWN_RADIUS - 2);
                    spawnParticle(Math.cos(ang) * r, Math.random() * FLOAT_HEIGHT_RANGE * 0.5, Math.sin(ang) * r);
                }
            }
        });

        // ═══════════════════════════════════════════════════════════
        //  ANIMATION LOOP
        // ═══════════════════════════════════════════════════════════
        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            // update water material
            water.mat.uniforms.uTime.value = elapsed;
            // subtly rotate light for dynamic specular
            const lAng = elapsed * 0.015;
            water.mat.uniforms.uLightDir.value.set(
                Math.sin(lAng) * 0.3, 0.8, Math.cos(lAng) * 0.5
            ).normalize();

            // ripple ring
            rippleRing.material.opacity = 0.04 + 0.03 * Math.sin(elapsed * 0.3);
            rippleRing.scale.setScalar(1 + 0.02 * Math.sin(elapsed * 0.4));

            bottomGlow.material.opacity = 0.04 + 0.02 * Math.sin(elapsed * 0.15);

            // update particles
            updateParticles(dt, elapsed);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ═══════════════════════════════════════════════════════════
        //  RESIZE
        // ═══════════════════════════════════════════════════════════
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🌊 水旋涡粒子 — 点击投放黄色粒子 · 旋涡吸入顶端 → 螺旋下坠 → 底部消散');
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方块对战 · 红蓝射击</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}
#cross::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#cross::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#topbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:20px;color:#fff;font-size:13px}
#topbar .team{font-weight:700}
#topbar .red{color:#ff5a5a}#topbar .blue{color:#5aa0ff}
#topbar input{width:78px;background:rgba(255,255,255,.12);border:1px solid #666;color:#fff;border-radius:6px;padding:2px 6px;font-size:12px;pointer-events:auto}
#hp-wrap{position:absolute;left:14px;bottom:14px;width:240px}
#hp-bar{height:20px;background:linear-gradient(#5fe03a,#3fae22);width:100%;border:2px solid #222;border-radius:5px;transition:width .15s}
#hp-text{position:absolute;left:8px;top:0;line-height:20px;font-size:12px;color:#fff;text-shadow:1px 1px 1px #000}
#ammo{position:absolute;left:14px;bottom:42px;color:#fff;font-size:13px;text-shadow:1px 1px 1px #000}
#killfeed{position:absolute;right:10px;top:54px;width:240px;text-align:right;color:#fff;font-size:12px;text-shadow:1px 1px 1px #000}
#killfeed div{margin-bottom:3px}
#center-msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:#fff;font-size:28px;font-weight:700;text-shadow:0 0 8px #000;text-align:center;display:none}
#hint{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);color:#ffd93d;font-size:12px;text-shadow:1px 1px 1px #000;text-align:center;max-width:90%}
#touch{position:fixed;left:0;right:0;bottom:0;height:240px;z-index:20;pointer-events:none}
#joy{position:absolute;left:26px;bottom:26px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
#joy-k{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.35)}
.tb{position:absolute;width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid #888;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;pointer-events:auto;touch-action:none}
.tb:active{background:rgba(255,215,0,.4)}
#b-shoot{right:26px;bottom:96px;background:rgba(180,40,40,.5);border-color:#f66;width:84px;height:84px;font-size:30px}
#b-jump{right:26px;bottom:26px}
#ping{color:#9f9}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,0,0,.55) 100%);opacity:0;transition:opacity .1s}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0}
#toast{position:absolute;top:15%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:700;color:#ffd93d;text-shadow:2px 2px 4px #000,0 0 12px rgba(255,180,0,.5);opacity:0;transition:opacity .25s;white-space:nowrap;z-index:13;pointer-events:none}
#toast.show{opacity:1}
#toast.bad{color:#ff6b4a}
#cross.hot::before,#cross.hot::after{background:#ffd93d}
#cross.hot{width:30px;height:30px}
#hp-wrap.low #hp-bar{background:linear-gradient(#ff5a3a,#d42a10)}
#loading{position:fixed;inset:0;background:#0b0f14;color:#cfe;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:50;font-size:16px}
#loading .t{font-size:22px;margin-bottom:8px}
@media (hover:hover){#touch{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div class="t">方块对战</div><div>正在生成地图…</div></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="hud">
  <div id="cross"></div>
  <div id="topbar">
    <span>房间 <input id="room" value="mc1" maxlength="12"></span>
    <span>昵称 <input id="pname" value="" maxlength="10"></span>
    <span class="team red">红 <b id="rs">0</b></span>
    <span class="team blue">蓝 <b id="bs">0</b></span>
    <span id="ping">离线</span>
  </div>
  <div id="hp-wrap"><div id="hp-bar"></div><span id="hp-text">100/100</span></div>
  <div id="ammo">🔫 步枪 · 自动射击</div>
  <div id="killfeed"></div>
  <div id="center-msg"></div>
  <div id="hint"></div>
</div>
<div id="toast"></div>
<div id="touch">
  <div id="joy"><div id="joy-k"></div></div>
  <div id="b-jump" class="tb">⬆</div>
  <div id="b-shoot" class="tb">🔫</div>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as T from "three";
const $=s=>document.querySelector(s);
const cv=$("#c"),ren=new T.WebGLRenderer({canvas:cv,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
const sc=new T.Scene();sc.background=new T.Color(0x87ceeb);sc.fog=new T.Fog(0x87ceeb,70,220);
const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,0.1,300);
const hemi=new T.HemisphereLight(0xffffff,0x667788,0.85);sc.add(hemi);
const dl=new T.DirectionalLight(0xffffff,0.75);dl.position.set(40,70,30);sc.add(dl);
const amb=new T.AmbientLight(0x556677,0.35);sc.add(amb);
const rc=new T.Raycaster();

/* ---------- world ---------- */
const W=112,D=112;
const BL={AIR:0,GRASS:1,DIRT:2,STONE:3,WATER:4,SAND:5,SNOW:6,WOOD:7,LEAF:8,WALL:9};
const BC={1:0x6abe5a,2:0x8a6a43,3:0x8a8a8a,4:0x2a6cc0,5:0xe2d29a,6:0xeef3f6,7:0x6b4a2b,8:0x3f9d4a,9:0x9aa3ad};
const DEST=new Set([BL.WOOD,BL.LEAF,BL.WALL]);
const SOLID=new Set([1,2,3,4,5,6,7,8,9]);
function hash2(x,z){let h=Math.imul(x|0,374761393)+Math.imul(z|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function noise2(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
 const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);
 const ux=xf*xf*(3-2*xf),uz=zf*zf*(3-2*zf);
 return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz}
function fbm2(x,z,o){let v=0,a=1,f=1;for(let i=0;i<o;i++){v+=a*noise2(x*f,z*f);a*=.5;f*=2}return v}
function getH(x,z){return Math.floor(5+fbm2(x*0.045,z*0.045,4)*6)}
let _seed=1337;function rnd(){_seed=(_seed*1103515245+12345)&0x7fffffff;return _seed/0x7fffffff}
const key=(x,y,z)=>x+","+y+","+z;
let blocks=new Map(),broken=[];
function genWorld(){
 blocks.clear();broken=[];_seed=1337;
 for(let x=0;x<W;x++)for(let z=0;z<D;z++){
  const h=getH(x,z),biome=fbm2(x*0.02+50,z*0.02+50,3);
  let top=BL.GRASS;
  if(h<=5)top=BL.SAND;else if(h>=13)top=BL.SNOW;else if(biome<0.32)top=BL.DIRT;else if(biome>0.78)top=BL.SAND;
   for(let y=Math.max(0,h-3);y<=h;y++){const t=y===h?top:BL.DIRT;blocks.set(key(x,y,z),t)}
  if(h<=5)for(let y=h+1;y<=6;y++)if(!blocks.get(key(x,y,z)))blocks.set(key(x,y,z),BL.WATER);
 }
 for(const [cx,cz] of [[7,7],[W-7,D-7]])
  for(let x=cx-4;x<=cx+4;x++)for(let z=cz-4;z<=cz+4;z++){const h=getH(x,z);   for(let y=Math.max(1,h-3);y<=h;y++)blocks.set(key(x,y,z),y===h?BL.GRASS:BL.DIRT);}
  for(let i=0;i<120;i++){
  const x=4+Math.floor(rnd()*(W-8)),z=4+Math.floor(rnd()*(D-8));
  if((x<13&&z<13)||(x>W-13&&z>D-13))continue;
  const gy=getH(x,z)+1,th=4+Math.floor(rnd()*3);
  for(let y=0;y<th;y++)blocks.set(key(x,gy+y,z),BL.WOOD);
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=th-1;dy<th+3;dy++){
   if(Math.abs(dx)+Math.abs(dz)+Math.max(0,th-dy)>4)continue;
   const k=key(x+dx,gy+dy,z+dz);if(!blocks.get(k))blocks.set(k,BL.LEAF);
  }
 }
  for(const [cx,cz] of [[22,28],[34,28],[60,40],[40,75],[85,85],[28,95],[95,30]])
   for(let i=0;i<5;i++){for(let y=0;y<3;y++)blocks.set(key(cx+i,getH(cx+i,cz)+1+y,cz),BL.WALL);for(let y=0;y<3;y++)blocks.set(key(cx,getH(cx,cz+i)+1+y,cz+i),BL.WALL);}
  // 周边不可破坏石墙作为可见边界
  for(let i=0;i<W;i++){for(let j=0;j<3;j++){
   blocks.set(key(i,getH(i,0)+1+j,0),BL.STONE);blocks.set(key(i,getH(i,D-1)+1+j,D-1),BL.STONE);
   blocks.set(key(0,getH(0,i)+1+j,i),BL.STONE);blocks.set(key(W-1,getH(W-1,i)+1+j,i),BL.STONE);}}
}
/* ---------- block textures (pixel-art atlas) ---------- */
function mkAtlas(){
 const S=64,cv2=document.createElement("canvas");cv2.width=cv2.height=S;const c=cv2.getContext("2d");
 const tile=(col,row,base,vary,fn)=>{for(let i=0;i<16;i++)for(let j=0;j<16;j++){let r,g,b;
   if(fn){const p=fn(i,j);r=p[0];g=p[1];b=p[2];}else{const n=hash2(col*16+i+1,row*16+j+1);const l=1+(n-0.5)*2*vary;r=base[0]*l;g=base[1]*l;b=base[2]*l;}
   c.fillStyle="rgb("+(r|0)+","+(g|0)+","+(b|0)+")";c.fillRect(col*16+i,row*16+j,1,1);}};
 tile(0,0,[106,190,90],0.12);                                                                        // 0 grass top
 tile(1,0,[138,106,67],0.12,(i,j)=>{if(j<4){const n=hash2(i+1,j+1);const l=1+(n-0.5)*0.4;return [90*l,200*l,80*l];}const n=hash2(i+1,j+1);const l=1+(n-0.5)*0.4;return [138*l,106*l,67*l];});// 1 grass side (green strip on top + dirt below)
 tile(2,0,[138,106,67],0.14);                                                                        // 2 dirt
 tile(3,0,[138,138,138],0.16);                                                                       // 3 stone
 tile(0,1,[60,120,200],0.10);                                                                        // 4 water
 tile(1,1,[226,210,154],0.12);                                                                       // 5 sand
 tile(2,1,[238,243,246],0.05);                                                                       // 6 snow
 tile(3,1,[107,74,43],0.12,(i,j)=>{const n=hash2(i+1,j+1);const l=1+(n-0.5)*0.3;if(i%4===0)return [80*l,55*l,32*l];return [120*l,80*l,46*l];});// 7 wood side (bark)
 tile(0,2,[150,105,60],0.12,(i,j)=>{const n=hash2(i+1,j+1);const l=1+(n-0.5)*0.25;const d=Math.hypot(i-7.5,j-7.5);const ring=Math.sin(d*1.4)*30;return [150*l+ring,105*l+ring*0.7,60*l+ring*0.4];});// 8 wood top (rings)
 tile(1,2,[63,157,74],0.30);                                                                         // 9 leaf
 tile(2,2,[154,163,173],0.12,(i,j)=>{const n=hash2(i+1,j+1);const l=1+(n-0.5)*0.3;if(j%5===0||(j%5===2&&Math.abs(i-8)<3))return [120*l,128*l,138*l];return [160*l,168*l,178*l];});// 10 wall (brick)
 const tex=new T.CanvasTexture(cv2);tex.magFilter=T.NearestFilter;tex.minFilter=T.NearestFilter;tex.generateMipmaps=false;
 if(T.SRGBColorSpace)tex.colorSpace=T.SRGBColorSpace;return tex;
}
const ATLAS=mkAtlas();
const MAT_OPAQUE=new T.MeshLambertMaterial({map:ATLAS});
const MAT_WATER=new T.MeshLambertMaterial({map:ATLAS,transparent:true,opacity:0.72});
function _applyTileUV(g,faces){const uv=g.attributes.uv;
 for(let f=0;f<6;f++){const t=faces[f],col=t%4,row=(t/4)|0;const u0=col/4,u1=(col+1)/4,v1=1-row/4,v0=1-(row+1)/4;
  for(let k=0;k<4;k++){const idx=f*4+k;const ou=uv.getX(idx),ov=uv.getY(idx);uv.setXY(idx,ou<0.5?u0:u1,ov<0.5?v0:v1);}}
 uv.needsUpdate=true;}
const BGEO={};
function _geo(faces){const g=new T.BoxGeometry(1,1,1);_applyTileUV(g,faces);return g;}
// BoxGeometry face order: [+X,-X,+Y(top),-Y(bottom),+Z,-Z]
BGEO[BL.GRASS]=_geo([1,1,0,2,1,1]);
BGEO[BL.DIRT]=_geo([2,2,2,2,2,2]);
BGEO[BL.STONE]=_geo([3,3,3,3,3,3]);
BGEO[BL.WATER]=_geo([4,4,4,4,4,4]);
BGEO[BL.SAND]=_geo([5,5,5,5,5,5]);
BGEO[BL.SNOW]=_geo([6,6,6,6,6,6]);
BGEO[BL.WOOD]=_geo([7,7,8,8,7,7]);
BGEO[BL.LEAF]=_geo([9,9,9,9,9,9]);
BGEO[BL.WALL]=_geo([10,10,10,10,10,10]);
let tm={},meta={},solidMeshes=[];
const _m4=new T.Matrix4(),_c=new T.Color();
function rebuildTerrain(){
 Object.values(tm).forEach(m=>{if(m)sc.remove(m)});tm={};meta={};solidMeshes=[];
 const g={};blocks.forEach((t,k)=>{if(!t)return;const[x,y,z]=k.split(",").map(Number);if(!DEST.has(t)&&solidAt(x,y+1,z))return;if(!g[t])g[t]=[];g[t].push(x,y,z)});
 Object.entries(g).forEach(([t,a])=>{
  const n=a.length/3;if(!n)return;const tt=+t;
  const m=new T.InstancedMesh(BGEO[tt]||BGEO[BL.STONE],tt===BL.WATER?MAT_WATER:MAT_OPAQUE,n);const mm=[];
  for(let i=0;i<n;i++){const bx=a[i*3],by=a[i*3+1],bz=a[i*3+2];
   _m4.makeTranslation(bx+.5,by+.5,bz+.5);m.setMatrixAt(i,_m4);
   const hj=hash2(bx*1.3+7,bz*1.7+3);
   _c.setRGB(1,1,1).offsetHSL((hj-0.5)*0.02,(hj-0.5)*0.02,(hj-0.5)*0.08);m.setColorAt(i,_c);mm.push([bx,by,bz])}
  m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;
  sc.add(m);tm[tt]=m;meta[tt]=mm;if(SOLID.has(tt))solidMeshes.push(m);
 });
}
const blockAt=(x,y,z)=>blocks.get(key(x,y,z))||0;
function breakBlock(x,y,z){const t=blocks.get(key(x,y,z));if(!t||!DEST.has(t))return false;blocks.delete(key(x,y,z));broken.push({x,y,z,type:t,regen:performance.now()+12000});scheduleRebuild();return true}
let _rebuildT=0;const scheduleRebuild=()=>{_rebuildT=performance.now()+60};
function checkRegen(now){if(!broken.length)return;let ch=false;broken=broken.filter(b=>{if(now>=b.regen){blocks.set(key(b.x,b.y,b.z),b.type);ch=true;return false}return true});if(ch)scheduleRebuild();}

/* ---------- collision ---------- */
const solidAt=(x,y,z)=>SOLID.has(blockAt(x,y,z));
function aabb(a){return{minx:a.pos.x-0.3,maxx:a.pos.x+0.3,miny:a.pos.y,maxy:a.pos.y+1.8,minz:a.pos.z-0.3,maxz:a.pos.z+0.3}}
function collideX(a,pos){const b=aabb(a);let hit=false;const x=pos?Math.floor(b.maxx):Math.floor(b.minx);
 for(let y=Math.floor(b.miny);y<=Math.floor(b.maxy);y++)for(let z=Math.floor(b.minz);z<=Math.floor(b.maxz);z++)
  if(solidAt(x,y,z)){a.pos.x=pos?x-0.3-1e-3:x+1+0.3+1e-3;hit=true;break;}return hit}
function collideZ(a,pos){const b=aabb(a);let hit=false;const z=pos?Math.floor(b.maxz):Math.floor(b.minz);
 for(let y=Math.floor(b.miny);y<=Math.floor(b.maxy);y++)for(let x=Math.floor(b.minx);x<=Math.floor(b.maxx);x++)
  if(solidAt(x,y,z)){a.pos.z=pos?z-0.3-1e-3:z+1+0.3+1e-3;hit=true;break;}return hit}
function collideY(a,up){const b=aabb(a);let hit=false;const y=up?Math.floor(b.maxy):Math.floor(b.miny);
 for(let x=Math.floor(b.minx);x<=Math.floor(b.maxx);x++)for(let z=Math.floor(b.minz);z<=Math.floor(b.maxz);z++)
  if(solidAt(x,y,z)){if(up)a.pos.y=y-1.8-1e-3;else{a.pos.y=y+1+1e-3;a.onGround=true;}hit=true;break;}return hit}
function tryMove(a,dt){
 a.pos.x+=a.vel.x*dt;if(collideX(a,a.vel.x>0))a.vel.x=0;
 a.pos.z+=a.vel.z*dt;if(collideZ(a,a.vel.z>0))a.vel.z=0;
 const wasUp=a.vel.y>0;a.pos.y+=a.vel.y*dt;if(collideY(a,wasUp))a.vel.y=0;
  if(a.pos.y< -12){a.pos.copy(spawnPoint(a.team));a.vel.set(0,0,0);}
  a.pos.x=Math.max(1.5,Math.min(W-1.5,a.pos.x));
  a.pos.z=Math.max(1.5,Math.min(D-1.5,a.pos.z));
 }
const GRAV=22,SPEED=5;
function updatePhysics(a,mx,mz,dt){
 const fwd=new T.Vector3(-Math.sin(a.yaw),0,-Math.cos(a.yaw));
 const right=new T.Vector3(Math.cos(a.yaw),0,-Math.sin(a.yaw));
 const w=new T.Vector3().addScaledVector(fwd,mz).addScaledVector(right,mx);
 if(w.lengthSq()>0)w.normalize().multiplyScalar(SPEED);
 a.vel.x=w.x;a.vel.z=w.z;a.vel.y-=GRAV*dt;
 tryMove(a,dt);
}
function jump(a){if(a.onGround){a.vel.y=8.2;a.onGround=false}}

/* ---------- players ---------- */
const TEAM={RED:0,BLUE:1},TEAMC=[0xff5a5a,0x5aa0ff];
const spawnPoint=t=>{const c=t===TEAM.RED?[7,7]:[W-7,D-7];return new T.Vector3(c[0]+.5,getH(c[0],c[1])+0.2,c[1]+.5)};
const me={id:"",name:"",team:TEAM.RED,pos:new T.Vector3(),vel:new T.Vector3(),yaw:0,pitch:0,hp:100,alive:true,respawn:0,cd:0,onGround:false};
const actors=new Map();
function newActor(id,name,team,bot){
 const g=new T.Group();
  const mat=c=>new T.MeshLambertMaterial({color:c});
  const legL=new T.Mesh(new T.BoxGeometry(0.22,0.7,0.22),mat(0x333333));legL.position.set(-0.13,0.35,0);
  const legR=new T.Mesh(new T.BoxGeometry(0.22,0.7,0.22),mat(0x333333));legR.position.set(0.13,0.35,0);
  const body=new T.Mesh(new T.BoxGeometry(0.5,0.62,0.3),mat(TEAMC[team]));body.position.y=1.05;
  const armL=new T.Mesh(new T.BoxGeometry(0.16,0.6,0.16),mat(TEAMC[team]));armL.position.set(-0.33,1.05,0);
  const armR=new T.Mesh(new T.BoxGeometry(0.16,0.6,0.16),mat(TEAMC[team]));armR.position.set(0.33,1.05,0);
  const head=new T.Mesh(new T.BoxGeometry(0.46,0.46,0.46),mat(0xffcc99));head.position.y=1.62;
  const gun=new T.Mesh(new T.BoxGeometry(0.1,0.12,0.55),mat(0x222222));gun.position.set(0,0.28,-0.12);armR.add(gun);
  g.add(legL,legR,body,armL,armR,head);
 const hpBg=new T.Mesh(new T.PlaneGeometry(0.9,0.12),new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.6}));hpBg.position.y=2.15;
 const hpFg=new T.Mesh(new T.PlaneGeometry(0.86,0.08),new T.MeshBasicMaterial({color:0x33dd44}));hpFg.position.set(0,2.15,0.01);
 g.add(hpBg,hpFg);

class CubeParticles{
 constructor(max=600){this.max=max;this.geo=new T.BoxGeometry(0.12,0.12,0.12);
  this.mat=new T.MeshBasicMaterial({vertexColors:false});
  this.mesh=new T.InstancedMesh(this.geo,this.mat,max);
  this.mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);this.mesh.frustumCulled=false;sc.add(this.mesh);
  this.data=[];this._m=new T.Matrix4();this._q=new T.Quaternion();this._s=new T.Vector3();}
 spawn(p,v,color,life,size){if(this.data.length>=this.max)this.data.shift();this.data.push({p:p.clone(),v:v.clone(),c:new T.Color(color),life,max:life,size:size||0.12})}
 update(dt){for(let i=this.data.length-1;i>=0;i--){const d=this.data[i];d.life-=dt;if(d.life<=0){this.data.splice(i,1);continue;}d.v.y-=18*dt;d.p.addScaledVector(d.v,dt);}
  const n=this.data.length;this.mesh.count=n;
  for(let i=0;i<n;i++){const d=this.data[i];const s=d.size*Math.max(0.15,d.life/d.max);this._m.compose(d.p,this._q,this._s.set(s,s,s));this.mesh.setMatrixAt(i,this._m);this.mesh.setColorAt(i,d.c);}
  this.mesh.instanceMatrix.needsUpdate=true;if(this.mesh.instanceColor)this.mesh.instanceColor.needsUpdate=true;}
}

function rayBox(o,d,min,max){let tmin=-Infinity,tmax=Infinity;
 for(const ax of["x","y","z"]){const inv=1/d[ax];let t1=(min[ax]-o[ax])*inv,t2=(max[ax]-o[ax])*inv;if(t1>t2){const tt=t1;t1=t2;t2=tt}tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmax<tmin)return -1}
 return tmin>0?tmin:-1}

async function netStart(){
 room=(new URLSearchParams(location.search).get("room")||$("#room").value||"mc1").trim();me.name=($("#pname").value||("玩家"+myId)).slice(0,10);$("#pname").value=me.name;

 if(typeof mqtt==="undefined"){netFail("离线(无MQTT)");return;}
  const opts={clientId:"mc_"+myId,clean:true,connectTimeout:4000,reconnectPeriod:3000};
  const urls=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
  const attempt=u=>new Promise((res,rej)=>{const c=mqtt.connect(u,opts);const to=setTimeout(()=>{try{c.end()}catch(e){}rej("timeout")},4000);c.on("connect",()=>{clearTimeout(to);res(c)});c.on("error",()=>{clearTimeout(to);try{c.end()}catch(e){}rej()});});
  let client;
  try{client=await Promise.race(urls.map(attempt));}catch(e){netFail("联机失败(离线)");return;}
  mq=client;netOk=true;$("#ping").textContent="联机";$("#ping").style.color="#5f5";
  mq.subscribe("mcshooter/"+room+"/s");mq.subscribe("mcshooter/"+room+"/e",{qos:1});

 if(keys["w"]||keys["W"])mz+=1;if(keys["s"]||keys["S"])mz-=1;if(keys["a"]||keys["A"])mx-=1;if(keys["d"]||keys["D"])mx+=1;
 if(touchMove.x||touchMove.y){mx=touchMove.x;mz=-touchMove.y;}
 if(me.alive){if(keys[" "]||touchJump)jump(me);updatePhysics(me,mx,mz,dt);if(firing)fire(me)}else if(me.respawn&&now>=me.respawn){me.alive=true;me.hp=100;me.respawn=0;me.pos.copy(spawnPoint(me.team));me.vel.set(0,0,0);hideCenter()}
  cam.position.copy(me.pos).add(new T.Vector3(0,1.6,0));cam.rotation.order="YXZ";cam.rotation.y=me.yaw;cam.rotation.x=me.pitch;
  if(shAmp>0.001){const s=shAmp;cam.position.x+=(Math.random()-0.5)*s*0.5;cam.position.y+=(Math.random()-0.5)*s*0.5;shAmp=Math.max(0,shAmp-dt*3);}
  if(gunGroup){recoil=Math.max(0,recoil-dt*6);muzzleT=Math.max(0,muzzleT-dt);const moving=(Math.abs(mx)+Math.abs(mz))>0.1&&me.onGround;bobPhase+=dt*(moving?12:3);const by=Math.sin(bobPhase)*0.012*(moving?1:0.4),bx=Math.cos(bobPhase*0.5)*0.01*(moving?1:0.4);gunGroup.position.set(0.32+bx,-0.26+by,-0.5+recoil*0.07);gunGroup.rotation.set(recoil*0.25,0,0);muzzleBox.visible=muzzleT>0;muzzleLight.intensity=muzzleT>0?5*(muzzleT/0.05):0;}
  particles.update(dt);
  const vg=$("#vignette");vg.style.opacity=Math.min(1,vignetteAmp).toFixed(3);
  const fl=$("#flash");fl.style.background=flashCol;fl.style.opacity=Math.min(1,flashAmp).toFixed(3);
  vignetteAmp=Math.max(0,vignetteAmp-dt*1.5);flashAmp=Math.max(0,flashAmp-dt*4);
  if((_fc++&1)===0)updateHover();
  actors.forEach(a=>{
  if(a.bot){botThink(a,now);if(a.respawn&&now>=a.respawn)respawnActor(a);updatePhysics(a,a.inMx,a.inMz,dt)}
  else if(a.targetPos)a.pos.lerp(a.targetPos,0.5);
  if(a.alive){a.mesh.position.copy(a.pos);a.mesh.rotation.y=a.yaw;const sp=a.vel.length();a._ph=(a._ph||0)+dt*(4+sp*2);const sw=Math.sin(a._ph)*Math.min(1,sp/4)*0.6;if(a.legL){a.legL.rotation.x=sw;a.legR.rotation.x=-sw;a.armL.rotation.x=-sw;a.armR.rotation.x=sw;}if(a._hit&&now-a._hit<160)a.body.material.emissive.setHex(0xaa0000);else if(a.body.material.emissive)a.body.material.emissive.setHex(0);a.hpBg.quaternion.copy(cam.quaternion);a.hpFg.quaternion.copy(cam.quaternion);const lb=a.mesh.children.find(c=>c.isSprite);if(lb)lb.quaternion.copy(cam.quaternion)}
 });
  for(let i=tracers.length-1;i>=0;i--){if(now>=tracers[i].exp){sc.remove(tracers[i].l);tracers[i].l.material.dispose();tracers.splice(i,1)}}
 netTick(now);updateHUD();ren.render(sc,cam);requestAnimationFrame(frame);
}

 me.name=($("#pname").value||"玩家"+me.id).slice(0,10);$("#pname").value=me.name;
  genWorld();rebuildTerrain();initGun();me.pos.copy(spawnPoint(me.team));me.yaw=Math.PI;

 if(!isTouch)$("#hint").textContent="PC：点击画面锁定鼠标 · WASD移动 · 左键射击 · 空格跳";
 else $("#hint").textContent="平板：左摇杆移动 · 右半屏拖动看视角 · 红键射击 · 上键跳";
 netStart();setInterval(updateHUD,200);requestAnimationFrame(frame);
}
if(!$("#pname").value)$("#pname").value="玩家"+Math.floor(Math.random()*900+100);
start();

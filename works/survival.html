<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>生存挑战</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#87ceeb;font-family:-apple-system,system-ui,"Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #c{display:block;width:100vw;height:100vh}
  #ui{position:fixed;inset:0;pointer-events:none}
  #cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.85}
  #cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
  #cross:before{left:8px;top:0;width:2px;height:18px}
  #cross:after{top:8px;left:0;height:2px;width:18px}
  #hp-wrap{position:absolute;top:10px;left:12px;width:170px;background:rgba(0,0,0,.55);border:2px solid #555;border-radius:4px;padding:3px}
  #hp-bar{height:14px;width:100%;background:linear-gradient(#5fe03a,#3fae22);border-radius:2px;transition:width .15s}
  #hp-text{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#fff;font-size:10px;font-weight:bold;text-shadow:1px 1px 2px #000}
  #info{position:absolute;top:10px;right:12px;color:#fff;font-size:13px;text-shadow:1px 1px 2px #000;text-align:right;line-height:1.8}
  #res span{margin-left:8px;padding:2px 6px;border-radius:3px;font-size:14px}
  #stone-count{background:rgba(136,136,136,.5)}
  #iron-count{background:rgba(204,136,68,.5);color:#ffd93d}
  #wave-info{color:#f88;font-size:14px}
  #score-info{color:#8f8}
  #hotbar{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(0,0,0,.7);border:2px solid #666;border-radius:8px}
  .hs{width:60px;height:60px;background:rgba(255,255,255,.1);border:3px solid #777;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;pointer-events:auto;transition:border-color .12s,background .12s}
  .hs.act{border-color:#ffd93d;background:rgba(255,215,0,.22);box-shadow:0 0 12px rgba(255,215,0,.45)}
  .hs .ct{position:absolute;bottom:2px;right:5px;font-size:12px;color:#fff;text-shadow:1px 1px 1px #000}
  .hs .lb{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:#aaa;white-space:nowrap}
  .hs.act .lb{color:#ffd93d}
  #boss-warn{position:absolute;top:20%;left:50%;transform:translateX(-50%);color:#f44;font-size:26px;font-weight:bold;text-shadow:2px 2px 4px #000;opacity:0;transition:opacity .5s}
  #hpwrap{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);width:260px;height:18px;background:rgba(0,0,0,.45);border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.4)}
  #hp{height:100%;width:100%;background:linear-gradient(90deg,#3ad13a,#7be36b);transition:width .12s}
  #hint{position:absolute;top:10px;right:12px;color:#fff;text-shadow:0 1px 2px #000;font-size:13px;text-align:right;line-height:1.5;opacity:.85}
  #toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:7px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .25s}
  #center{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:#fff;font-size:26px;font-weight:700;text-shadow:0 2px 6px #000;text-align:center;opacity:0;transition:opacity .3s}
  #joy{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);pointer-events:auto}
  #joyn{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}
  #btns{position:absolute;right:18px;bottom:22px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .btn{width:84px;height:64px;border-radius:14px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}
  .btn:active{background:rgba(255,255,255,.4)}
  #overlay{position:fixed;inset:0;background:linear-gradient(160deg,#2a3a4a,#101820);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:16px;z-index:10}
  #overlay h1{font-size:34px;letter-spacing:4px;text-shadow:0 2px 8px #000}
  #overlay p{max-width:520px;text-align:center;color:#bcd;font-size:14px;line-height:1.7}
  #overlay input{width:260px;padding:10px 12px;border-radius:8px;border:none;font-size:15px;text-align:center;background:#fff;color:#222}
  #start{margin-top:8px;padding:11px 40px;font-size:18px;border:none;border-radius:10px;background:#3ad13a;color:#06320a;font-weight:700;cursor:pointer}
  #start:active{transform:scale(.97)}
  #vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(120,0,0,.0);transition:box-shadow .15s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="cross"></div>
  <div id="hp-wrap"><div id="hp-bar"></div><span id="hp-text">100/100</span></div>
  <div id="info">
    <div id="res"><span id="stone-count">⬜ 0</span><span id="iron-count">🟠 0</span></div>
    <div id="wave-info">准备开始</div>
    <div id="score-info">🎯 0</div>
    <div style="opacity:.8;font-size:12px" id="online-info">玩家 1</div>
    <div id="fps-info" style="opacity:.6;font-size:11px;color:#cfc"></div>
  </div>
  <div id="perf-panel" style="position:fixed;top:6px;left:6px;background:rgba(0,0,0,.7);color:#0f0;font:11px/1.5 monospace;padding:6px 10px;border-radius:4px;z-index:90;display:none;pointer-events:none"></div>
  <div id="qual-btn" style="position:fixed;bottom:80px;right:10px;background:rgba(0,0,0,.6);color:#fff;font:12px sans-serif;padding:6px 12px;border-radius:6px;z-index:90;cursor:pointer;user-select:none;-webkit-user-select:none">⚡ 流畅模式</div>
  <div id="hint">WASD移动 鼠标视角 空格跳<br>左键射击 右键/Q建造 X/R拆除<br>1/2或滚轮切换围墙⬜/箭塔🏹<br>R重生 ESC解锁鼠标</div>
  <div id="boss-warn"></div>
  <div id="hotbar"></div>
  <div id="hpwrap"><div id="hp"></div></div>
  <div id="toast"></div>
  <div id="center"></div>
  <div id="joy"><div id="joyn"></div></div>
  <div id="btns">
    <div class="btn" id="bdel">❌拆除</div>
    <div class="btn" id="bbuild">🔨建造</div>
    <div class="btn" id="bshoot">射击</div>
    <div class="btn" id="bjump">跳</div>
  </div>
</div>
<div id="vignette"></div>
<div id="overlay">
  <h1>生 存 挑 战</h1>
  <p>多人合作生存。地图四角不断刷新僵尸，越往后越凶（每5波出BOSS）。<br>
  ⬜ 石头 → 建造围墙阻挡僵尸　🟠 铁块 → 建造箭塔自动射击<br>
  击杀僵尸获取资源，和好友进同一房间即可联机。</p>
  <input id="name" placeholder="昵称（可空）" maxlength="12">
  <input id="room" placeholder="房间号（如 1）" value="1" maxlength="8">
  <button id="start">进入游戏</button>
</div>
<div class="ov" id="ov-death" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:100">
  <h1 style="font-size:30px;margin-bottom:8px">💀 你被僵尸击倒了</h1>
  <div class="sub" id="dinfo" style="color:#aaa;font-size:14px;margin-bottom:18px"></div>
  <button onclick="location.reload()" style="padding:12px 36px;font-size:16px;border:none;border-radius:6px;background:#f66;color:#fff;cursor:pointer">重新开始</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script type="module">
import * as T from 'three';

/* 全局错误兜底：任何启动失败都显示在开始界面上，不再静默 */
addEventListener('error',e=>{try{
  const o=document.getElementById('overlay'),btn=document.getElementById('start');
  if(btn&&!btn.dataset.ok)btn.textContent='出错了';
  let d=document.getElementById('errbox');
  if(!d&&o){d=document.createElement('div');d.id='errbox';d.style.cssText='color:#f88;font-size:13px;max-width:560px;text-align:center;line-height:1.6';o.insertBefore(d,null);}
  if(d)d.textContent='错误：'+(e.message||e.type||'未知')+'（请把此信息发给开发者）';
}catch(_){}});

/* ============================ 基础 / 地图（参照上一游戏） ============================ */
const W=112, D=112;
const BL={AIR:0,GRASS:1,DIRT:2,STONE:3,WATER:4,SAND:5,SNOW:6,WOOD:7,LEAF:8,WALL:9};
const BC={1:0x6abe5a,2:0x8a6a43,3:0x9a9a9a,4:0x2a6cc0,5:0xe2d29a,6:0xeef3f6,7:0x6b4a2b,8:0x3f9d4a,9:0x9aa3ad};
const SOLID=new Set([1,2,3,4,5,6,7,8,9]);
const DEST=new Set([7,8,9]);
const CORNERS=[[3,3],[W-3,3],[3,D-3],[W-3,D-3]];
const clampX=x=>Math.max(1.5,Math.min(W-1.5,x));
const clampZ=z=>Math.max(1.5,Math.min(D-1.5,z));

function hash2(x,y){let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;}
function noise2(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const tl=hash2(xi,yi),tr=hash2(xi+1,yi),bl=hash2(xi,yi+1),br=hash2(xi+1,yi+1);
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return tl*(1-u)*(1-v)+tr*u*(1-v)+bl*(1-u)*v+br*u*v;}
function fbm2(x,y){let f=0,a=0.5;for(let i=0;i<4;i++){f+=a*noise2(x,y);x*=2;y*=2;a*=0.5;}return f;}
function getH(x,z){const m=fbm2(x*0.027,z*0.027);
  let h=Math.floor(5+m*15);
  const r=Math.hypot(x-W/2,z-D/2);
  if(r>46) h=Math.max(h,Math.floor(12+(r-46)*0.7));
  return Math.max(2,Math.min(26,h));}

let _seed=1337;
function rnd(){_seed=(_seed*1664525+1013904223)>>>0;return _seed/4294967296;}
const key=(x,y,z)=>x+","+y+","+z;
const blocks=new Map();
const builtBlocks=new Map();
const BW={WALL:10,TOWER:11,TOWER_TOP:12};
const BWC={10:0x999999,11:0x8B4513,12:0xCD853F};
let broken=[];

function genWorld(){
  blocks.clear(); broken=[]; _seed=1337;
  for(let x=0;x<W;x++)for(let z=0;z<D;z++){
    const h=getH(x,z), bh=Math.max(2,Math.floor((fbm2(x*0.04+10,z*0.04+10))*4));
    for(let y=Math.max(0,h-3);y<=h;y++){
      let t=BL.DIRT;
      if(y===h){const r=Math.hypot(x-W/2,z-D/2);t=(h<4)?BL.SAND:(h>18?BL.SNOW:BL.GRASS);if(r>50)t=BL.STONE;}
      blocks.set(key(x,y,z),t);
    }
    if(h<4)for(let y=h+1;y<=h+5;y++)blocks.set(key(x,y,z),BL.WATER);
  }
  // 出生点区域铲平
  const cx=Math.floor(W/2), cz=Math.floor(D/2);
  for(let x=cx-3;x<=cx+3;x++)for(let z=cz-3;z<=cz+3;z++){const h=getH(x,z);for(let y=h;y>=h-1;y--)blocks.set(key(x,y,z),BL.GRASS);}
  // 树
  for(let i=0;i<120;i++){const x=4+Math.floor(rnd()*(W-8)),z=4+Math.floor(rnd()*(D-8));const h=getH(x,z);if(h<5||h>16){i--;continue;}blocks.set(key(x,h+1,z),BL.WOOD);blocks.set(key(x,h+2,z),BL.WOOD);blocks.set(key(x,h+3,z),BL.WOOD);for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=0;dy<=1;dy++){if(Math.abs(dx)+Math.abs(dz)+dy>3)continue;blocks.set(key(x+dx,h+3+dy,z+dz),BL.LEAF);}if(rnd()<0.15){x;z;for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)blocks.set(key(x+dx,h+5,z+dz),BL.LEAF);}}
  // 石墙遗迹
  for(let i=0;i<14;i++){const x=8+Math.floor(rnd()*(W-16)),z=8+Math.floor(rnd()*(D-16));if(Math.hypot(x-cx,z-cz)<6)continue;const hh=2+Math.floor(rnd()*3);for(let y=getH(x,z)+1;y<=getH(x,z)+hh;y++)blocks.set(key(x,y,z),BL.WALL);}
  // 四周石墙（可见边界，不可破坏）
  for(let x=0;x<W;x++){for(let y=getH(x,0)+1;y<=getH(x,0)+3;y++)blocks.set(key(x,y,0),BL.STONE);for(let y=getH(x,D-1)+1;y<=getH(x,D-1)+3;y++)blocks.set(key(x,y,D-1),BL.STONE);}
  for(let z=0;z<D;z++){for(let y=getH(0,z)+1;y<=getH(0,z)+3;y++)blocks.set(key(0,y,z),BL.STONE);for(let y=getH(W-1,z)+1;y<=getH(W-1,z)+3;y++)blocks.set(key(W-1,y,z),BL.STONE);}
}

const GEO=new T.BoxGeometry(1,1,1);
const MATS={};
Object.keys(BC).forEach(k=>{MATS[k]=new T.MeshLambertMaterial({color:0xffffff})});
Object.keys(BWC).forEach(k=>{MATS[k]=new T.MeshLambertMaterial({color:BWC[k]})});
let solidMeshes=[],tm={},bm={};
let _rebuildT=0;
function rebuildTerrain(){
  Object.values(tm).forEach(m=>{if(m)sc.remove(m)});tm={};solidMeshes=[];
  const g3={};
  blocks.forEach((t,k)=>{if(!t)return;if(!g3[t])g3[t]=[];const[x,y,z]=k.split(",").map(Number);g3[t].push(x,y,z)});
  const m4=new T.Matrix4();const tmpC=new T.Color();
  Object.entries(g3).forEach(([t,a])=>{
    const n=a.length/3;if(!n)return;
    const m=new T.InstancedMesh(GEO,MATS[t]||MATS[1],n);m.frustumCulled=false;
    const base=new T.Color(BC[t]||BC[1]);
    for(let i=0;i<n;i++){
      m4.makeTranslation(a[i*3]+.5,a[i*3+1]+.5,a[i*3+2]+.5);m.setMatrixAt(i,m4);
      const bx=a[i*3],bz=a[i*3+2];
      const hj=hash2(bx*1.3+7,bz*1.7+3);
      const v=(hj-0.5)*0.16;
      tmpC.copy(base).offsetHSL((hj-0.5)*0.03,v*0.6,v);
      m.setColorAt(i,tmpC);}
    m.instanceMatrix.needsUpdate=true;
    if(m.instanceColor)m.instanceColor.needsUpdate=true;
    sc.add(m);solidMeshes.push(m);tm[t]=m});
}
function rebuildBuilt(){
  Object.values(bm).forEach(m=>{if(m)sc.remove(m)});bm={};
  const g={};
  builtBlocks.forEach((t,k)=>{if(!g[t])g[t]=[];const[x,y,z]=k.split(",").map(Number);g[t].push(x,y,z)});
  const m4=new T.Matrix4();
  Object.entries(g).forEach(([t,a])=>{
    const n=a.length/3;if(!n)return;
    const m=new T.InstancedMesh(GEO,MATS[t]||MATS[10],n);m.frustumCulled=false;
    for(let i=0;i<n;i++){m4.makeTranslation(a[i*3]+.5,a[i*3+1]+.5,a[i*3+2]+.5);m.setMatrixAt(i,m4)}
    m.instanceMatrix.needsUpdate=true;sc.add(m);bm[t]=m});
}
function allBuildMeshes(){return[...Object.values(tm),...Object.values(bm)].filter(m=>!!m);}
function solidAt(x,y,z){return SOLID.has(blockAt(x,y,z))||builtBlocks.has(key(x,y,z));}
function blockAt(x,y,z){return blocks.get(key(x,y,z))||0;}
function breakBlock(x,y,z){const k=key(x,y,z),t=blocks.get(k);if(!t||!DEST.has(t))return false;blocks.delete(k);broken.push([x,y,z,t]);_rebuildT=performance.now()+60;return true;}

/* ============================ three 基础 ============================ */
const cv=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
const sc=new T.Scene();
sc.background=new T.Color(0x87ceeb);
sc.fog=new T.Fog(0x87ceeb,70,220);
const cam=new T.PerspectiveCamera(78,innerWidth/innerHeight,0.05,500);
const sun=new T.DirectionalLight(0xffffff,1.1); sun.position.set(60,120,30); sc.add(sun);
sc.add(new T.HemisphereLight(0xbfe3ff,0x6b5a3a,0.8));
const rc=new T.Raycaster();
const atlasTex=null;

/* ============================ 玩家物理 ============================ */
function aabb(a){return{minx:a.pos.x-0.3,maxx:a.pos.x+0.3,miny:a.pos.y,maxy:a.pos.y+1.8,minz:a.pos.z-0.3,maxz:a.pos.z+0.3};}
function collideX(a,dx){const b=aabb(a);b.minx+=dx;b.maxx+=dx;for(let x=Math.floor(b.minx);x<=Math.floor(b.maxx);x++)for(let y=Math.floor(b.miny);y<=Math.floor(b.maxy);y++)for(let z=Math.floor(b.minz);z<=Math.floor(b.maxz);z++)if(solidAt(x,y,z))return dx>0?x-b.maxx-1e-4:(x+1)-b.minx+1e-4;return dx;}
function collideZ(a,dz){const b=aabb(a);b.minz+=dz;b.maxz+=dz;for(let x=Math.floor(b.minx);x<=Math.floor(b.maxx);x++)for(let y=Math.floor(b.miny);y<=Math.floor(b.maxy);y++)for(let z=Math.floor(b.minz);z<=Math.floor(b.maxz);z++)if(solidAt(x,y,z))return dz>0?z-b.maxz-1e-4:(z+1)-b.minz+1e-4;return dz;}
function collideY(a,dy){const b=aabb(a);b.miny+=dy;b.maxy+=dy;for(let x=Math.floor(b.minx);x<=Math.floor(b.maxx);x++)for(let y=Math.floor(b.miny);y<=Math.floor(b.maxy);y++)for(let z=Math.floor(b.minz);z<=Math.floor(b.maxz);z++)if(solidAt(x,y,z))return dy>0?y-b.maxy-1e-4:(y+1)-b.miny+1e-4;return dy;}
function tryMove(a,dx,dz){dx=collideX(a,dx);dz=collideZ(a,dz);
  if(a.pos.x<1.5)a.pos.x=1.5;if(a.pos.x>W-1.5)a.pos.x=W-1.5;if(a.pos.z<1.5)a.pos.z=1.5;if(a.pos.z>D-1.5)a.pos.z=D-1.5;
  a.pos.x+=dx;a.pos.z+=dz;}
function updatePhysics(dt,a){const sp=a===me?speed:0;let vy=sp*input.y, vz=sp*input.x;
  if(a===me&&input.jump&&a.onGround){a.vel.y=8.2;a.onGround=false;input.jump=false;}
  a.vel.y-=24*dt;
  if(Math.abs(vy)+Math.abs(vz)>0.001){const yaw=(a===me?yaw:a.yaw)+Math.PI/2;const sx=Math.sin(yaw),sz=Math.cos(yaw);tryMove(a,vy*sx+vz*-sz,vy*sz+vz*sx);}
  let dy=a.vel.y*dt;dy=collideY(a,dy);if(dy!==a.vel.y*dt){if(a.vel.y<0)a.onGround=true;a.vel.y=0;}a.pos.y+=dy;
  if(a.pos.y<0){a.pos.y=0;a.vel.y=0;a.onGround=true;}
  const g=getH(Math.round(a.pos.x),Math.round(a.pos.z))+0.05;if(a.pos.y<g){a.pos.y=g;a.vel.y=0;a.onGround=true;}}
function jump(a){if(a.onGround){a.vel.y=8.2;a.onGround=false;}}

/* ============================ 角色模型（玩家） ============================ */
function newActor(id,name,team,local){
  const g=new T.Group();
  const body=new T.Mesh(new T.BoxGeometry(0.5,0.9,0.3),new T.MeshLambertMaterial({color:0x3a7bd5}));body.position.y=0.95;g.add(body);
  const head=new T.Mesh(new T.BoxGeometry(0.4,0.4,0.4),new T.MeshLambertMaterial({color:0xf0c39b}));head.position.y=1.55;g.add(head);
  const legL=new T.Mesh(new T.BoxGeometry(0.18,0.6,0.18),new T.MeshLambertMaterial({color:0x2a4a7a}));legL.position.set(-0.13,0.3,0);g.add(legL);
  const legR=legL.clone();legR.position.x=0.13;g.add(legR);

const _tc=new T.CylinderGeometry(0.045,0.045,1,6); _tc.rotateX(Math.PI/2);
function addTracer(from,to){const len=from.distanceTo(to);const m=new T.Mesh(_tc,new T.MeshBasicMaterial({color:0xfff2a0,transparent:true,opacity:0.9,blending:T.AdditiveBlending,depthWrite:false}));m.scale.set(1,1,len);m.position.copy(from.clone().add(to).multiplyScalar(0.5));m.lookAt(to);m.rotateY(Math.PI/2);sc.add(m);return m;}
function spawnMuzzle(pos,dir){const m=new T.Mesh(new T.BoxGeometry(0.3,0.3,0.3),new T.MeshBasicMaterial({color:0xffd66b,transparent:true,opacity:0.95,blending:T.AdditiveBlending,depthWrite:false}));m.position.copy(pos);sc.add(m);particles.spawn(m.position.clone(),new T.Vector3(0,0,0),0xffd66b,8,0.18);return m;}
function rayBox(o,d,min,max){const ix=1/(d.x||1e-9),iy=1/(d.y||1e-9),iz=1/(d.z||1e-9);const tx1=(min.x-o.x)*ix,tx2=(max.x-o.x)*ix;const tmin=Math.max(Math.min(tx1,tx2),Math.min((min.y-o.y)*iy,(max.y-o.y)*iy),Math.min((min.z-o.z)*iz,(max.z-o.z)*iz));const tmax=Math.min(Math.max(tx1,tx2),Math.max((min.y-o.y)*iy,(max.y-o.y)*iy),Math.max((min.z-o.z)*iz,(max.z-o.z)*iz));return tmax>=0&&tmax>=tmin?tmin:-1;}

function fire(){
  const now=performance.now();
  if(me.cd>now)return; me.cd=now+180;
  recoil=1; muzzleT=now+60; shakeAmt=0.12;
  const origin=cam.position.clone(); const dir=cam.getWorldDirection(new T.Vector3()).clone();
  // 僵尸优先
  let tZ=Infinity,zh=null;
  zombies.forEach(zb=>{if(!zb.alive)return;const min=new T.Vector3(zb.pos.x-0.3*zb.s,zb.pos.y,zb.pos.z-0.3*zb.s);const max=new T.Vector3(zb.pos.x+0.3*zb.s,zb.pos.y+1.8*zb.s,zb.pos.z+0.3*zb.s);const t=rayBox(origin,dir,min,max);if(t>0&&t<tZ){tZ=t;zh=zb;}});
  let hp=null;
  if(tZ<9){
    hp=origin.clone().add(dir.clone().multiplyScalar(tZ));
    const m=addTracer(gunWorld(),hp);setTimeout(()=>sc.remove(m),90);
    particles.spawn(hp.clone(),new T.Vector3(0,0,0),0x6fbf4a,8,0.25);
    applyZombieDamage(zh.id,25);
    spawnDmgNum(hp.x,hp.y+0.6,hp.z,25);
    zh._hit=now; playHit(); shakeAmt=0.18;
  } else {
    const hits=rc.intersectObjects(solidMeshes,false);
    let end=origin.clone().add(dir.clone().multiplyScalar(9));
    if(hits.length&&hits[0].distance<9)end=hits[0].point.clone();

}

/* ============================ 建造系统（参照方块世界塔防） ============================ */
let slot=0,hbar=[10,11]; // 10=围墙(石头) 11=箭塔(铁x2)
let towers=[],bullets=[],dmgNums=[],resAnims=[];
function getTarget(nx,ny){
  rc.set(cam.position,cam.getWorldDirection(new T.Vector3()));
  rc.far=8;
  const hits=rc.intersectObjects(allBuildMeshes(),false);
  if(!hits.length)return null;
  const p=hits[0].point,n=hits[0].face.normal;
  return{
    x:Math.floor(p.x-n.x*.5),y:Math.floor(p.y-n.y*.5),z:Math.floor(p.z-n.z*.5),
    nx:Math.floor(p.x+n.x*.5),ny:Math.floor(p.y+n.y*.5),nz:Math.floor(p.z+n.z*.5)};
}
let hlMesh=null,rangeIndicator=null,previewMesh=null;
function createHL(){
  const g=new T.BoxGeometry(1.03,1.03,1.03);
  hlMesh=new T.LineSegments(new T.EdgesGeometry(g),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.6}));
  hlMesh.visible=false;sc.add(hlMesh);
  rangeIndicator=new T.Mesh(new T.RingGeometry(13.5,14.5,64),new T.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:.2,side:T.DoubleSide}));
  rangeIndicator.rotation.x=-Math.PI/2;rangeIndicator.visible=false;sc.add(rangeIndicator);
  previewMesh=new T.Mesh(new T.BoxGeometry(1,1,1),new T.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:.4}));
  previewMesh.visible=false;sc.add(previewMesh);

function doBuild(t){
  if(!me||!me.alive)return;
  if(!t)t=getTarget();if(!t)return;
  if(builtBlocks.get(key(t.nx,t.ny,t.nz))||blockAt(t.nx,t.ny,t.nz))return;
  if(t.ny>getH(t.nx,t.nz)+8){toast("建得太高了");return}
  const it=hbar[slot];
  if(it===10){
    if(me.stone<=0){toast("石头不足！杀僵尸获取 ⬜");return}
    me.stone--;
    builtBlocks.set(key(t.nx,t.ny,t.nz),BW.WALL);
    if(netOk)netSend({t:"blk",x:t.nx,y:t.ny,z:t.nz,typ:BW.WALL},1);
    rebuildBuilt();toast("🧱 建造围墙");
  }else{
    if(me.iron<2){toast("铁块不足(需2)！僵尸有几率掉落 🟠");return}
    me.iron-=2;
    const bx=t.nx,by=t.ny,bz=t.nz;
    for(let dy=0;dy<3;dy++)builtBlocks.set(key(bx,by+dy,bz),BW.TOWER);
    builtBlocks.set(key(bx,by+3,bz),BW.TOWER_TOP);
    towers.push({x:bx+.5,y:by+4,z:bz+.5,hp:15,atk:4,range:14,cd:0,key:key(bx,by,bz),owner:myId});
    if(netOk)netSend({t:"tw",x:bx,y:by,z:bz,owner:myId},1);
    rebuildBuilt();toast("🏹 建造箭塔！");
  }
}
function removeTowerCells(bx,by,bz){
  for(let dy=0;dy<4;dy++)builtBlocks.delete(key(bx,by+dy,bz));
  towers=towers.filter(tw=>tw.key!==key(bx,by,bz));
}
function doDemolish(t){
  if(!me||!me.alive)return;
  if(!t)t=getTarget();if(!t)return;
  const k=key(t.x,t.y,t.z);
  const bt=builtBlocks.get(k);
  if(!bt){toast("准星没有对准可拆除的方块");return}
  if(bt===BW.WALL){
    builtBlocks.delete(k);me.stone++;
    if(netOk)netSend({t:"rmb",x:t.x,y:t.y,z:t.z},1);
    toast("⬜ 回收石头");
  }else{
    let bx=t.x,by=t.y,bz=t.z,found=false;
    for(let dy=0;dy<4&&!found;dy++){
      const ck=key(t.x,t.y-dy,t.z);
      if(towers.some(tw=>tw.key===ck)){bx=t.x;by=t.y-dy;bz=t.z;found=true}
    }
    removeTowerCells(bx,by,bz);
    me.iron+=2;
    if(netOk)netSend({t:"rmt",x:bx,y:by,z:bz},1);
    toast("🟠 回收铁块");
  }
  rebuildBuilt();
}

/* ============================ 箭塔（参照方块世界塔防） ============================ */
function applyZombieDamage(zid,dmg){
  if(isHost())applyZHit(zid,dmg,myId);
  else if(netOk)netSend({t:"zh",zid,dmg,from:myId},1);
}
function updateTowers(dt){
  towers.forEach(tw=>{
    if(tw.owner!==myId)return; // 塔归建造者客户端模拟，伤害统一走 zh 通道
    tw.cd=Math.max(0,tw.cd-dt);
    if(tw.cd>0)return;
    let nearest=null,nd=Infinity;
    zombies.forEach(z=>{if(!z.alive)return;
      const d=Math.sqrt((z.pos.x-tw.x)**2+(z.pos.y+1-tw.y)**2+(z.pos.z-tw.z)**2);
      if(d<tw.range&&d<nd){nd=d;nearest=z}});
    if(!nearest)return;
    tw.cd=1.0;
    const dir=new T.Vector3(nearest.pos.x-tw.x,(nearest.pos.y+1)-tw.y,nearest.pos.z-tw.z).normalize();
    spawnArrowVisual(tw.x,tw.y,tw.z,dir,nearest.pos);
    if(netOk)netSend({t:"ts",ox:+tw.x.toFixed(1),oy:+tw.y.toFixed(1),oz:+tw.z.toFixed(1),tx:+nearest.pos.x.toFixed(1),ty:+(nearest.pos.y+1).toFixed(1),tz:+nearest.pos.z.toFixed(1)},0);
  });
}
function spawnArrowVisual(x,y,z,dir,targetPos){
  const arrow=new T.Group();
  const shaft=new T.Mesh(new T.CylinderGeometry(.03,.03,1.2,4),new T.MeshLambertMaterial({color:0x8B4513}));
  shaft.rotation.x=Math.PI/2;
  const head=new T.Mesh(new T.ConeGeometry(.08,.3,4),new T.MeshLambertMaterial({color:0x666666}));
  head.position.z=-.75;head.rotation.x=-Math.PI/2;
  arrow.add(shaft,head);
  arrow.position.set(x,y,z);
  arrow.lookAt(targetPos.x,targetPos.y+1,targetPos.z);
  sc.add(arrow);
  const trail=[];
  for(let j=0;j<5;j++){const tp=new T.Mesh(new T.SphereGeometry(.02,4,4),new T.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:.6-j*.1}));tp.visible=false;sc.add(tp);trail.push(tp)}
  bullets.push({mesh:arrow,x:x,y:y,z:z,vx:dir.x*20,vy:dir.y*20,vz:dir.z*20,life:2,dmg:4,trail:trail,trailTimer:0});
}
function freeBullet(i){const b=bullets[i];
  if(b.trail)b.trail.forEach(t=>{sc.remove(t);t.geometry.dispose();t.material.dispose();});
  if(b.mesh){b.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});sc.remove(b.mesh);}
  bullets.splice(i,1);}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.life-=dt;
    if(b.mesh){b.mesh.position.set(b.x,b.y,b.z);b.mesh.lookAt(b.x+b.vx,b.y+b.vy,b.z+b.vz)}
    if(b.trail){b.trailTimer+=dt;
      if(b.trailTimer>0.02){b.trailTimer=0;
        for(let j=b.trail.length-1;j>0;j--){b.trail[j].position.copy(b.trail[j-1].position);b.trail[j].visible=b.trail[j-1].visible}
        b.trail[0].position.set(b.x,b.y,b.z);b.trail[0].visible=true}}
    let done=b.life<=0;
    if(!done){
      zombies.forEach(z=>{if(done||!z.alive)return;
        const d=Math.sqrt((z.pos.x-b.x)**2+(z.pos.y+0.9*z.s-b.y)**2+(z.pos.z-b.z)**2);
        if(d<1.2*z.s+0.3){
          done=true;
          z._hit=performance.now();
          for(let k=0;k<6;k++)particles.spawn(new T.Vector3(b.x,b.y,b.z),new T.Vector3(),0xff4400,1,.15);
          spawnDmgNum(b.x,b.y+.8,b.z,b.dmg);
          applyZombieDamage(z.id,b.dmg);
        }});
    }
    if(done)freeBullet(i);
  }
}

let mq=null, netOk=false, hosts=["wss://broker.emqx.io:8084/mqtt","wss://test.mosquitto.org:8081/mqtt"];
let room="1", myId="u"+Math.random().toString(36).slice(2,8), myName="玩家";
const peers=new Map();
const actors=new Map();
function isHost(){let h=myId;peers.forEach((v,id)=>{if(id<h)h=id;});return h===myId;}
function netSend(o,q){if(mq&&netOk)try{mq.publish("surv/"+room+"/e",JSON.stringify(o),{qos:q||0});}catch(e){}}
function netStart(){
  if(typeof mqtt==='undefined'){netOk=false;console.log('mqtt unavailable - single player');return;}
  let i=0; const tryNext=()=>{ if(i>=hosts.length)return; netOk=false;
    const c=mqtt.connect(hosts[i],{username:"fdl",password:"x",clean:true,reconnectPeriod:0,connectTimeout:4000});
    c.on("connect",()=>{mq=c;netOk=true;i=-1;c.subscribe("surv/"+room+"/e",{qos:1});toast("已联网");});
    c.on("error",()=>{i++;if(i<hosts.length)tryNext();});
    c.on("close",()=>{netOk=false;setTimeout(()=>{if(!netOk&&i>=0){i=0;tryNext();}},3000);});
    c.on("message",(tp,p)=>{try{onNet(JSON.parse(p.toString()));}catch(e){}});
  };
  tryNext();
}
let _st=0;
function netTick(now){
  if(!netOk)return; if(now-_st<33)return; _st=now;
  netSend({t:"s",from:myId,id:myId,n:myName,x:+me.pos.x.toFixed(2),y:+me.pos.y.toFixed(2),z:+me.pos.z.toFixed(2),yw:+yaw.toFixed(3),pt:+pitch.toFixed(3),hp:Math.round(me.hp),a:me.alive?1:0,st:me.stone,ir:me.iron,k:me.kills},1);
}
function onNet(o){
  if(!o||o.from===myId)return;
  if(o.t==="s"){
    const now=performance.now();
    let a=actors.get(o.from);
    if(!a){a=newActor(o.from,o.n||"?",0,false);labelActor(a);actors.set(o.from,a);}
    if(o.n){a.name=o.n;labelActor(a);}
    a.yaw=o.yw;a.pitch=o.pt;a.hp=o.hp;a.alive=o.a===1;a.kills=o.k||0;a.stone=o.st||0;a.iron=o.ir||0;
    const np=new T.Vector3(clampX(o.x),o.y,clampZ(o.z));
    if(a.targetPos)a._prev=a.pos.clone();else a.targetPos=np.clone();
    a.targetPos=np.clone();
    updateActorHp(a);
    a.mesh.visible=a.alive;
    peers.set(o.from,{id:o.from,pos:new T.Vector3(clampX(o.x),o.y,clampZ(o.z)),alive:o.a===1,last:now});
  } else if(o.t==="sh"){
    const o0=new T.Vector3(o.ox,o.oy,o.oz),d=new T.Vector3(o.dx,o.dy,o.dz);
    const end=o0.clone().add(d.clone().multiplyScalar(9));
    const m=addTracer(o0,end);setTimeout(()=>sc.remove(m),90);
    const mp=o0.clone().add(d.clone().multiplyScalar(0.5));spawnMuzzle(mp,d);
  } else if(o.t==="zh"){
    if(isHost())applyZHit(o.zid,o.dmg,o.from);
  } else if(o.t==="zhit"){
    if(o.to===myId)damage(me,o.dmg,{name:"僵尸"});
  } else if(o.t==="zd"){
    const zb=zombies.get(o.zid);if(zb){sc.remove(zb.mesh);zombies.delete(o.zid);}
    (o.loot||"s1").split(",").forEach(part=>{
      const kind=part[0]==="i"?"iron":"stone", n=parseInt(part.slice(1))||1;
      for(let i=0;i<n;i++)spawnDrop(o.x,o.y,o.z,kind);
    });
    if(o.killer===myId)me.kills++;
  } else if(o.t==="blk"){
    if(o.typ>=10){builtBlocks.set(key(o.x,o.y,o.z),o.typ);rebuildBuilt();}
    else{blocks.set(key(o.x,o.y,o.z),o.typ);_rebuildT=performance.now()+30;}
  } else if(o.t==="tw"){
    const bx=o.x,by=o.y,bz=o.z;
    if(!builtBlocks.get(key(bx,by+3,bz))){
      for(let dy=0;dy<3;dy++)builtBlocks.set(key(bx,by+dy,bz),BW.TOWER);
      builtBlocks.set(key(bx,by+3,bz),BW.TOWER_TOP);
      towers.push({x:bx+.5,y:by+4,z:bz+.5,hp:15,atk:4,range:14,cd:0,key:key(bx,by,bz),owner:o.owner});
      rebuildBuilt();
    }
  } else if(o.t==="rmt"){
    removeTowerCells(o.x,o.y,o.z);rebuildBuilt();
  } else if(o.t==="rmb"){
    builtBlocks.delete(key(o.x,o.y,o.z));rebuildBuilt();
  } else if(o.t==="ts"){
    const from=new T.Vector3(o.ox,o.oy,o.oz),to=new T.Vector3(o.tx,o.ty,o.tz);
    const m=addTracer(from,to);setTimeout(()=>sc.remove(m),90);
  } else if(o.t==="bw"){
    bossWarn("💀 BOSS 第"+o.w+"波！");
  } else if(o.t==="wv"){
    _waveNet=o.w;_nextWaveNet=o.n;
  } else if(o.t==="z"){
    const ids=new Set();
    for(const it of o.list){const id=it[0];ids.add(id);
      let zb=zombies.get(id);
      if(!zb){zb=makeZombie(id,it[5]);zombies.set(id,zb);}
      zb.targetPos=new T.Vector3(it[1],it[2],it[3]);zb.hp=it[4];zb.maxhp=zb.maxhp||it[4];
    }
    zombies.forEach((zb,id)=>{if(!ids.has(id)){sc.remove(zb.mesh);zombies.delete(id);}});
  }
}

/* ============================ 僵尸 AI（仅主机模拟） ============================ */
let _wave=1, _nextWave=performance.now()+30000, _zCap=35, _zid=0, _nextSpawn=0, _lastZSnap=0, _lastWv=0;
let _waveNet=1,_nextWaveNet=30;
function spawnBoss(corner){
  const id="z"+(_zid++);
  const cx=corner[0]+(Math.random()*4-2), cz=corner[1]+(Math.random()*4-2);
  const gy=getH(Math.round(cx),Math.round(cz))+0.1;
  const zb=makeZombie(id,3);
  zb.pos.set(cx,gy,cz);
  zb.maxhp=100+_wave*15; zb.hp=zb.maxhp; zb.speed=2.4; zb.dmg=12+_wave*2;
  zombies.set(id,zb);
}
function updateZombies(dt,now){
  if(now>_nextWave){
    _wave++;_nextWave=now+30000;_zCap=Math.min(90,30+_wave*5);
    if(_wave%5===0){
      const nB=1+Math.floor(_wave/10);
      for(let i=0;i<nB;i++)spawnBoss(CORNERS[Math.floor(Math.random()*4)]);
      toast("💀 BOSS波！巨型僵尸来袭！",true);bossWarn("💀 BOSS 第"+_wave+"波！(×"+nB+")");
      if(netOk)netSend({t:"bw",w:_wave},1);
    }else toast("第 "+_wave+" 波！僵尸更强了",true);
    broadcastWv();
  }
  if(isHost()&&now-_lastWv>1000){_lastWv=now;broadcastWv();}
  if(now>_nextSpawn && zombies.size<_zCap){
    const corner=CORNERS[Math.floor(Math.random()*4)];
    const n=1+Math.floor(_wave/2);
    for(let i=0;i<n&&zombies.size<_zCap;i++){
      const id="z"+(_zid++);
      const cx=corner[0]+(Math.random()*4-2), cz=corner[1]+(Math.random()*4-2);
      const gy=getH(Math.round(cx),Math.round(cz))+0.1;
      const rr=Math.random(); const type=(rr<Math.min(0.35,_wave*0.03))?(rr<0.18?1:2):0;
      const maxhp=30+_wave*12, speed=2.0+Math.min(2.6,_wave*0.12), dmg=6+_wave*2;
      const zb=makeZombie(id,type); zb.pos.set(cx,gy,cz); zb.maxhp=maxhp; zb.hp=maxhp; zb.speed=speed; zb.dmg=dmg;
      zombies.set(id,zb);
    }
    _nextSpawn=now+Math.max(1400,5000-_wave*220);
  }
  zombies.forEach(zb=>{
    if(!zb.alive)return;
    let best=null,bd=1e9;
    if(me.alive){const d=zb.pos.distanceTo(me.pos);if(d<bd){bd=d;best=me.pos;}}
    peers.forEach(p=>{if(p.pos&&p.alive){const d=zb.pos.distanceTo(p.pos);if(d<bd){bd=d;best=p.pos;}}});
    if(best){
      const dir=best.clone().sub(zb.pos);dir.y=0;const dist=dir.length();
      if(dist>0.1){dir.normalize();zb.pos.x+=dir.x*zb.speed*dt;zb.pos.z+=dir.z*zb.speed*dt;zb.yaw=Math.atan2(dir.x,dir.z);}
      if(dist<1.35 && now>zb.atkCd){
        zb.atkCd=now+800;
        let vic=null;
        if(me.alive&&zb.pos.distanceTo(me.pos)<1.7)vic={id:myId};
        peers.forEach(p=>{if(p.pos&&p.alive&&zb.pos.distanceTo(p.pos)<1.7)vic={id:p.id};});
        if(vic){ if(vic.id===myId)damage(me,zb.dmg,{name:"僵尸"}); else netSend({t:"zhit",to:vic.id,dmg:zb.dmg,from:myId},1); }
      }
    }
    zb.pos.y=getH(Math.round(zb.pos.x),Math.round(zb.pos.z))+0.1;
    // 拆墙（主机权威，广播 rmb）
    if(builtBlocks.size){
      const bxx=Math.floor(zb.pos.x),byy=Math.round(zb.pos.y+0.9*zb.s),bzz=Math.floor(zb.pos.z);
      for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
        const wk=key(bxx+dx,byy,bzz+dz);
        if(builtBlocks.get(wk)&&Math.random()<dt*0.5){
          builtBlocks.delete(wk);rebuildBuilt();
          particles.spawn(new T.Vector3(bxx+dx+.5,byy+.5,bzz+dz+.5),new T.Vector3(),0x999999,8,.25);
          if(netOk)netSend({t:"rmb",x:bxx+dx,y:byy,z:bzz+dz},1);
        }
      }
    }
  });
}
function broadcastWv(){if(netOk)netSend({t:"wv",w:_wave,n:Math.max(0,Math.ceil((_nextWave-performance.now())/1000))},0);}

class CubeParticles{constructor(){this.geo=new T.BoxGeometry(0.08,0.08,0.08);this.mat=new T.MeshBasicMaterial();this.meshes=[];this.vels=[];this.life=[];this.max=150;for(let i=0;i<this.max;i++){const m=new T.Mesh(this.geo,this.mat.clone());m.visible=false;sc.add(m);this.meshes.push(m);this.vels.push(new T.Vector3());this.life.push(0);}this.p=0;}
  spawn(pos,vel,color,count,scale){for(let i=0;i<count;i++){const idx=this.p;this.p=(this.p+1)%this.max;const m=this.meshes[idx];m.visible=true;m.position.copy(pos);m.material.color.setHex(color);const s=scale*(0.6+Math.random()*0.8);m.scale.set(s,s,s);this.vels[idx].set((Math.random()-0.5)*4,(Math.random()*3+1),(Math.random()-0.5)*4).add(vel);this.life[idx]=0.5+Math.random()*0.3;}}
  update(dt){for(let i=0;i<this.max;i++){if(this.life[i]<=0)continue;this.life[i]-=dt;const m=this.meshes[i];this.vels[i].y-=12*dt;m.position.addScaledVector(this.vels[i],dt);if(this.life[i]<=0)m.visible=false;}}}
const particles=new CubeParticles();

function playShoot(){blip(220,0.08,"square",0.05);}

/* ============================ 主循环 ============================ */
let last=performance.now(), _fc=0, _tgtCache=null;
let _qT=performance.now(), _qC=0, _qLevel=0, _lastFps=0;
function frame(){
  const now=performance.now(); let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; _fc++;
  readInput();
  if(me.alive){
    if(keys.Space&&me.onGround){me.vel.y=8.2;me.onGround=false;}
    updatePhysics(dt,me);
  } else if(me.respawn&&now>=me.respawn){respawn();}

  // 视角
  cam.position.set(me.pos.x,me.pos.y+1.5,me.pos.z);
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  const dir=new T.Vector3(-Math.sin(yaw)*cp,sp,-Math.cos(yaw)*cp);
  const sh=shakeAmt; if(sh>0){cam.position.x+=(Math.random()-0.5)*sh;cam.position.y+=(Math.random()-0.5)*sh;shakeAmt*=0.8;if(shakeAmt<0.01)shakeAmt=0;}
  cam.lookAt(cam.position.clone().add(dir));

  // 武器视图
  gunGroup.position.set(0,-0.22,-0.35);
  gunGroup.rotation.set(0,yaw,0);
  recoil=Math.max(0,recoil-dt*6);
  gunGroup.position.z=-(0.35-recoil*0.08);
  if(muzzleT>now){const mp=gunWorld();} // muzzle spawned in fire()

  // 主机模拟僵尸
  if(isHost())updateZombies(dt,now);

  // 僵尸快照广播
  if(isHost()&&now-_lastZSnap>100){_lastZSnap=now;const list=[];zombies.forEach(zb=>{list.push([zb.id,+zb.pos.x.toFixed(2),+zb.pos.y.toFixed(2),+zb.pos.z.toFixed(2),Math.round(zb.hp),zb.type]);});netSend({t:"z",from:myId,list},0);}

  // 僵尸渲染
  zombies.forEach(zb=>{
    if(zb.targetPos&&!isHost())zb.pos.lerp(zb.targetPos,0.5);
    zb.mesh.position.copy(zb.pos); zb.mesh.rotation.y=zb.yaw;
    zb.mesh.visible=zb.alive;
    if(zb.hbG)zb.hbG.lookAt(cam.position);
    if(zb.hpFg){const r=Math.max(0,zb.hp)/zb.maxhp;zb.hpFg.scale.x=r;zb.hpFg.position.x=-(0.43*zb.s)*(1-r);
      zb.hpFg.material.color.setHex(r>0.5?0x00ff00:r>0.25?0xffff00:0xff0000);}
    if(zb._hit&&now-zb._hit<120){zb.mesh.children.forEach(c=>{if(c.material&&c.material.emissive)c.material.emissive.setHex(0x552222);});}else{zb.mesh.children.forEach(c=>{if(c.material&&c.material.emissive)c.material.emissive.setHex(0x000000);});}
  });

  // 掉落物
  for(let i=pickups.length-1;i>=0;i--){const pk=pickups[i];pk.mesh.rotation.y+=dt*2;pk.mesh.position.y+=Math.sin(now*0.003+pk.spin)*0.003;
    if(me.alive&&pk.mesh.position.distanceTo(me.pos.clone().setY(me.pos.y+0.9))<1.5){
      if(pk.kind==="iron"){me.iron++;toast("+1 🟠 铁块");}else{me.stone++;toast("+1 ⬜ 石头");}
      spawnResAnim(pk.mesh.position.x,pk.mesh.position.y,pk.mesh.position.z,pk.kind,1);
      sc.remove(pk.mesh);pickups.splice(i,1);}}

  // 箭塔 / 弹道 / 反馈
  updateTowers(dt);updateBullets(dt);updateDmgNums(dt);updateResAnims(dt);
  if(mouseL&&me.alive)fire();

  // 建造预览 / 高亮 / 射程圈（射线检测很贵：每3帧做一次并缓存）
  if(me.alive&&_fc%3===0)_tgtCache=getTarget();
  const tgt=me.alive?_tgtCache:null;
  if(tgt&&hlMesh){
    hlMesh.visible=true;hlMesh.position.set(tgt.x+.5,tgt.y+.5,tgt.z+.5);
    previewMesh.visible=true;previewMesh.position.set(tgt.nx+.5,tgt.ny+.5,tgt.nz+.5);
    if(hbar[slot]===11){
      rangeIndicator.visible=true;rangeIndicator.position.set(tgt.nx+.5,tgt.ny+.1,tgt.nz+.5);
      previewMesh.material.color.setHex(me.iron>=2?0x00ff00:0xff0000);
    }else{
      rangeIndicator.visible=false;
      previewMesh.material.color.setHex(me.stone>0?0x00ff00:0xff0000);
    }
  }else if(hlMesh){hlMesh.visible=false;rangeIndicator.visible=false;previewMesh.visible=false}

  // 玩家动画（me 自身仅第一人称，不渲染身体；远程角色渲染）
  // 远程角色插值
  actors.forEach(a=>{if(a.targetPos){if(a._prev){const al=0.5;a.pos.lerp(a.targetPos,0.5);}else a.pos.copy(a.targetPos);a._prev=a.pos.clone();}a.mesh.position.copy(a.pos);a.mesh.rotation.y=a.yaw;
    const moving=(Math.abs(input.y)+Math.abs(input.x))>0;
    const sw=Math.sin(now*0.012)*0.5*(moving?1:0);if(a.legL){a.legL.rotation.x=sw;a.legR.rotation.x=-sw;}
    const h=Math.max(0,a.hp)/100;a.hpFg.scale.x=h;a.hpFg.position.x=-0.43*(1-h);a.hpFg.material.color.setHex(h>0.5?0x3ad13a:h>0.25?0xe3c73a:0xd13a3a);});

  // 重建地形（建造/破坏后）
  if(_rebuildT&&now>_rebuildT){_rebuildT=0;rebuildTerrain();}

  particles.update(dt);

  // HUD
  updateUI();

  if(toastT&&now>toastT){$("toast").style.opacity=0;toastT=0;}

  // 网络
  if(netOk){netTick(now);}
  // 连线清理
  if(now%1000<20){peers.forEach((p,id)=>{if(now-p.last>6000)peers.delete(id);});}

  renderer.render(sc,cam);
  // 性能自适应 + 面板
  _qC++;
  if(now-_qT>3000){
    _lastFps=Math.round(_qC*1000/(now-_qT));_qT=now;_qC=0;
    if(_lastFps<22&&_qLevel===0){_qLevel=1;renderer.setPixelRatio(1);toast("已开启流畅模式");}
    else if(_lastFps<14&&_qLevel===1){_qLevel=2;sc.fog.near=30;sc.fog.far=110;toast("已开启极速模式");}
    const pp=$("perf-panel");
    if(pp){pp.style.display='block';
      const gpu=renderer.capabilities||{};
      pp.textContent='FPS: '+_lastFps+'\n'+
        'DPR: '+renderer.getPixelRatio()+'\n'+
        '几何体: '+renderer.info.render.triangles+' tri / '+renderer.info.render.calls+' draw\n'+
        '纹理: '+renderer.info.memory.textures+'\n'+
        '模式: '+['高','流畅','极速'][_qLevel];}
  }
  requestAnimationFrame(frame);
}

/* ============================ 启动（分帧避免卡死） ============================ */
function start(){
  const btn=$("start");btn.disabled=true;btn.textContent="生成世界中…";
  setTimeout(()=>{
  try{
  myName=($("name").value||"玩家").slice(0,12);
  room=($("room").value||"1").replace(/[^a-zA-Z0-9]/g,"")||"1";
  $("overlay").style.display="none";
  // 第1帧：生成地形数据
  requestAnimationFrame(()=>{
    genWorld();
    // 第2帧：构建网格（最耗GPU的一步）
    requestAnimationFrame(()=>{
      rebuildTerrain();
      // 第3帧：初始化游戏 + 启动循环
      requestAnimationFrame(()=>{
        me=newActor(myId,myName,0,true);
        me.pos.copy(spawnPoint()); me.hp=100; me.kills=0; me.score=0; me.stone=15; me.iron=3; me.cd=0; me.alive=true;
        sc.remove(me.mesh);
        createHL(); initGun();
        btn.dataset.ok=1;
        netStart();
        last=performance.now();
        requestAnimationFrame(frame);
      });
    });
  });
  }catch(err){btn.disabled=false;btn.textContent="启动失败："+err.message;}
  },50);
}
$("start").addEventListener("click",start);
/* 品质切换按钮 */
let _qualHigh=false;
$("qual-btn").addEventListener("click",()=>{
  _qualHigh=!_qualHigh;
  if(_qualHigh){
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    sc.fog.near=70;sc.fog.far=220;
    $("qual-btn").textContent="⚡ 流畅模式";toast("已切换到高画质");
  }else{
    renderer.setPixelRatio(1);
    sc.fog.near=30;sc.fog.far=110;
    $("qual-btn").textContent="✨ 高画质";toast("已切换到流畅模式");
  }
  _qLevel=_qualHigh?0:1;_qT=performance.now();_qC=0;
});
addEventListener("resize",()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
</script>

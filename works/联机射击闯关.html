<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 联机射击闯关</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,.8); }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #health-wrap { position: absolute; top: 18px; left: 18px; width: 240px; background: rgba(0,0,0,.45); border: 3px solid #5b5b5b; border-radius: 4px; padding: 3px; }
  #health-bar { height: 18px; width: 100%; background: linear-gradient(#5fe03a, #3fae22); border-radius: 2px; transition: width .2s, background .3s; }
  #health-wrap.low #health-bar { background: linear-gradient(#ff5a3a, #d42a10); }
  #health-text { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; font-size: 13px; }
  #score { position: absolute; top: 20px; right: 20px; font-size: 18px; font-weight: bold; color: #fff; text-shadow: 1px 1px 3px #000; }
  #ammo { position: absolute; top: 74px; right: 20px; font-size: 14px; font-weight: bold; color: #ffd93d; text-shadow: 1px 1px 3px #000; white-space: nowrap; }
  #daytime { position: absolute; top: 48px; right: 20px; font-size: 14px; color: #fff; text-shadow: 1px 1px 3px #000; }
  #online-info { position: absolute; top: 100px; right: 20px; font-size: 14px; color: #ffd93d; text-shadow: 1px 1px 3px #000; }
  #invbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; background: rgba(0,0,0,.5); border: 3px solid #5b5b5b; border-radius: 4px; }
  .slot { position: relative; width: 58px; height: 58px; background: rgba(255,255,255,.12); border: 2px solid #9a9a9a; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .slot .name { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #eee; text-shadow: 0 0 3px #000; white-space: nowrap; }
  #toast { position: absolute; top: 16%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: bold; color: #ffd93d; text-shadow: 2px 2px 4px #000, 0 0 12px rgba(255,180,0,.5); opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #toast.bad { color: #ff6b4a; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 45%, rgba(200,0,0,.55) 100%); opacity: 0; transition: opacity .1s; }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; }
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(0,0,0,.72); color: #fff; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 58px; margin-bottom: 10px; text-shadow: 3px 3px 0 #3f6b33, 0 0 20px rgba(255,180,0,.4); letter-spacing: 2px; }
  .overlay .sub { font-size: 20px; color: #ffd93d; margin-bottom: 26px; }
  .overlay .tips { font-size: 16px; line-height: 2; color: #d8e8d8; max-width: 640px; }
  .overlay .tips b { color: #ffd93d; }
  .overlay button { margin-top: 30px; font-size: 22px; padding: 14px 46px; cursor: pointer; background: linear-gradient(#7cb94a, #4e8a2c); color: #fff; border: 3px solid #2c5a18; border-radius: 6px; font-weight: bold; letter-spacing: 2px; box-shadow: 0 4px 0 #2c5a18; }
  .overlay button:hover { filter: brightness(1.1); }
  .overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #2c5a18; }
  .overlay.death h1 { color: #ff5a3a; text-shadow: 3px 3px 0 #5a1a0a, 0 0 20px rgba(255,0,0,.5); }
  .overlay input { margin-top: 8px; font-size: 18px; padding: 8px 16px; border-radius: 6px; border: 2px solid #5b5b5b; background: rgba(255,255,255,.15); color: #fff; text-align: center; width: 220px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="hud">
  <div id="crosshair"></div>
  <div id="health-wrap"><div id="health-bar"></div><span id="health-text">200</span></div>
  <div id="score">分数: 0</div>
  <div id="ammo">🔫 普通子弹（无限子弹）</div>
  <div id="daytime">☀️ 白天</div>
  <div id="online-info">玩家 1</div>
  <div id="toast"></div>
  <div id="invbar">
    <div class="slot"><span style="font-size:34px">🔫</span><span class="name">枪械</span></div>
  </div>
</div>
<div class="overlay" id="overlay-start">
  <h1>🔥 联机射击闯关</h1>
  <div class="sub">Minecraft风格 · 多人联机 · 射击僵尸</div>
  <div class="tips">
    <b>WASD</b> 移动 ｜ <b>空格</b> 跳跃 ｜ <b>Shift</b> 冲刺<br>
    <b>左键</b> 开枪射击（子弹无限）<br>
    击杀僵尸得分，和好友进同一房间即可联机！<br>
    僵尸越来越多，坚持到最后！
  </div>
  <div style="margin-top:20px">
    <input id="name" placeholder="你的名字" maxlength="12"><br>
    <input id="room" placeholder="房间号" value="1" maxlength="10">
  </div>
  <button id="start-btn">⚔️ 开始战斗</button>
</div>
<div class="overlay death hidden" id="overlay-death">
  <h1>💀 你被僵尸吃掉了</h1>
  <div class="sub" id="death-score"></div>
  <button id="restart-btn">重新开始</button>
</div>
<div class="overlay hidden" id="overlay-error">
  <h1>⚠️ 加载失败</h1>
  <div class="sub" id="error-msg">资源加载失败</div>
</div>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
<script src="https://unpkg.com/mqtt@5.3.3/dist/mqtt.min.js"></script>
<script type="module">
import * as THREE from 'three';

// ============================ 工具 ============================
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
function showError(msg){$('error-msg').textContent=msg;$('overlay-error').classList.remove('hidden')}
window.addEventListener('error',e=>showError('加载失败：'+(e.message||'网络错误')));

// ============================ 渲染器 ============================
const canvas=$('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ec8f5);
scene.fog=new THREE.Fog(0xa8d8f0,40,140);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,400);
camera.rotation.order='YXZ';

// ============================ 纹理图集 ============================
const TILE=16,GRID=4;
const atlasCanvas=document.createElement('canvas');
atlasCanvas.width=atlasCanvas.height=TILE*GRID;
const ag=atlasCanvas.getContext('2d');
function shade(hex,amt){
  const r=clamp(parseInt(hex.slice(1,3),16)+amt,0,255);
  const g=clamp(parseInt(hex.slice(3,5),16)+amt,0,255);
  const b=clamp(parseInt(hex.slice(5,7),16)+amt,0,255);
  return'rgb('+r+','+g+','+b+')';
}
function drawTile(tx,ty,base,opts){
  opts=opts||{};
  const x0=tx*TILE,y0=ty*TILE;
  ag.fillStyle=base;ag.fillRect(x0,y0,TILE,TILE);
  const dots=opts.dots===undefined?18:opts.dots;
  const amt=opts.amt===undefined?26:opts.amt;
  for(let i=0;i<dots;i++){
    ag.fillStyle=Math.random()<0.5?shade(base,rand(0,amt)):shade(base,-rand(0,amt));
    ag.fillRect(x0+(Math.random()*TILE)|0,y0+(Math.random()*TILE)|0,1,1);
  }
  if(opts.hStripes){for(let y=0;y<TILE;y+=4){ag.fillStyle=shade(base,-16);ag.fillRect(x0,y0+y,TILE,1)}}
  if(opts.vStripes){for(let x=0;x<TILE;x+=4){ag.fillStyle=shade(base,-16);ag.fillRect(x0+x,y0,1,TILE)}}
  if(opts.grassTop){ag.fillStyle='#6ab04c';ag.fillRect(x0,y0,TILE,5);for(let x=0;x<TILE;x++){ag.fillStyle=Math.random()<0.5?'#7ec25c':'#58a040';ag.fillRect(x0+x,y0+((Math.random()*4)|0),1,1)}}
  if(opts.planks){ag.strokeStyle=shade(base,-35);ag.lineWidth=1;for(let y=4;y<TILE;y+=4){ag.beginPath();ag.moveTo(x0,y0+y);ag.lineTo(x0+TILE,y0+y);ag.stroke()}for(let x=4;x<TILE;x+=8){ag.beginPath();ag.moveTo(x0+x,y0);ag.lineTo(x0+x,y0+TILE);ag.stroke()}}
  if(opts.rings){ag.strokeStyle=shade(base,-40);ag.lineWidth=1;for(let r=3;r<8;r+=3){ag.beginPath();ag.arc(x0+TILE/2,y0+TILE/2,r,0,Math.PI*2);ag.stroke()}}
}
drawTile(0,0,'#6ab04c',{dots:30,amt:18});
drawTile(1,0,'#8a5a3a',{grassTop:true});
drawTile(2,0,'#8a5a3a',{dots:30});
drawTile(3,0,'#8a8a8a',{dots:26});
drawTile(0,1,'#e8d29a',{dots:22,amt:20});
drawTile(1,1,'#b58b4e',{planks:true,dots:10});
drawTile(2,1,'#6d4c33',{vStripes:true,dots:20});
drawTile(3,1,'#a97e4f',{rings:true,dots:12});
drawTile(0,2,'#3e8a2f',{dots:40,amt:22});
drawTile(1,2,'#3a6fd8',{dots:14,amt:18});
const T={grassTop:[0,0],grassSide:[1,0],dirt:[2,0],stone:[3,0],sand:[0,1],plank:[1,1],woodSide:[2,1],woodTop:[3,1],leaves:[0,2],water:[1,2]};
const atlasTex=new THREE.CanvasTexture(atlasCanvas);
atlasTex.magFilter=THREE.NearestFilter;atlasTex.minFilter=THREE.NearestFilter;atlasTex.generateMipmaps=false;atlasTex.colorSpace=THREE.SRGBColorSpace;
const MAT_SOLID=new THREE.MeshLambertMaterial({map:atlasTex});
const MAT_WATER=new THREE.MeshLambertMaterial({map:atlasTex,transparent:true,opacity:0.72,depthWrite:false});
function faceUVs(geo,faceIdx,tile){
  const[tx,ty]=tile;
  const u0=tx/GRID,u1=(tx+1)/GRID;
  const v1=(GRID-ty)/GRID,v0=(GRID-ty-1)/GRID;
  const uv=geo.attributes.uv;const s=geo.groups[faceIdx].start;
  uv.setXY(s+0,u0,v0);uv.setXY(s+1,u1,v0);uv.setXY(s+2,u1,v1);uv.setXY(s+3,u0,v1);
}
function blockGeo(tiles){const geo=new THREE.BoxGeometry(1,1,1);for(let i=0;i<6;i++)if(tiles[i])faceUVs(geo,i,tiles[i]);return geo}
const GEO={grass:blockGeo([T.grassSide,T.grassSide,T.grassTop,T.dirt,T.grassSide,T.grassSide]),dirt:blockGeo([T.dirt,T.dirt,T.dirt,T.dirt,T.dirt,T.dirt]),stone:blockGeo([T.stone,T.stone,T.stone,T.stone,T.stone,T.stone]),sand:blockGeo([T.sand,T.sand,T.sand,T.sand,T.sand,T.sand]),plank:blockGeo([T.plank,T.plank,T.plank,T.plank,T.plank,T.plank]),wood:blockGeo([T.woodSide,T.woodSide,T.woodTop,T.woodTop,T.woodSide,T.woodSide]),leaves:blockGeo([T.leaves,T.leaves,T.leaves,T.leaves,T.leaves,T.leaves]),water:blockGeo([T.water,T.water,T.water,T.water,T.water,T.water])};

// ============================ 世界 ============================
const BL={GRASS:1,DIRT:2,STONE:3,SAND:4,PLANK:5,WOOD:6,LEAVES:7,WATER:8};
const W=55,D=55;
const blocks=new Map();
const typePos={};Object.values(BL).forEach(t=>typePos[t]=[]);
const typeMeshes={};
const bKey=(x,y,z)=>x+','+y+','+z;
function addBlock(x,y,z,t){if(t==null)return;if(blocks.has(bKey(x,y,z)))return;blocks.set(bKey(x,y,z),t);typePos[t].push(x,y,z)}
function removeBlock(x,y,z){const k=bKey(x,y,z);const t=blocks.get(k);if(!t)return;blocks.delete(k);const arr=typePos[t];for(let i=0;i<arr.length;i+=3){if(arr[i]===x&&arr[i+1]===y&&arr[i+2]===z){arr.splice(i,3);break}}}
function getBlock(x,y,z){return blocks.get(bKey(x,y,z))}
function isSolid(x,y,z){const t=getBlock(x,y,z);return!!t&&t!==BL.WATER}
function hash2(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)}
function smoothNoise(x,z){const xi=Math.floor(x),zi=Math.floor(z);const xf=x-xi,zf=z-zi;const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);const ux=xf*xf*(3-2*xf),uz=zf*zf*(3-2*zf);return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz}
function surfaceHeight(x,z){return 5+Math.sin(x*0.10)*1.8+Math.cos(z*0.13)*1.5+smoothNoise(x*0.09,z*0.09)*1.6+smoothNoise(x*0.03,z*0.03)*3.2}
const OX=Math.floor(-W/2),OZ=Math.floor(-D/2);
const WATER_LEVEL=3;
(function genTerrain(){
  for(let x=OX;x<OX+W;x++){for(let z=OZ;z<OZ+D;z++){
    const h=Math.round(surfaceHeight(x,z));const top=Math.max(h,WATER_LEVEL);
    for(let y=1;y<=top;y++){let t;if(y<=h){if(y===h)t=h<=WATER_LEVEL?BL.SAND:BL.GRASS;else if(y>=h-3)t=h<=WATER_LEVEL?BL.SAND:BL.DIRT;else t=BL.STONE}else t=BL.WATER;addBlock(x,y,z,t)}
  }}
  let trees=0;
  for(let i=0;i<60&&trees<26;i++){
    const x=OX+2+Math.floor(rand(0,W-4)),z=OZ+2+Math.floor(rand(0,D-4));
    const h=Math.round(surfaceHeight(x,z));
    if(h<=WATER_LEVEL+1||h>=9)continue;trees++;
    const th=3+Math.floor(rand(0,3));
    for(let i2=1;i2<=th;i2++)addBlock(x,h+i2,z,BL.WOOD);
    const top=h+th;
    for(let dy=top-1;dy<=top+2;dy++){for(let dx=-2;dx<=2;dx++){for(let dz=-2;dz<=2;dz++){
      const dist=Math.abs(dx)+Math.abs(dz)+Math.max(0,Math.abs(dy-top));
      if(dist<=3&&!getBlock(x+dx,dy,z+dz))addBlock(x+dx,dy,z+dz,BL.LEAVES);
    }}}
  }
  for(let wx=OX;wx<OX+W;wx++){for(let wz=OZ;wz<OZ+D;wz++){
    if(wx!==OX&&wx!==OX+W-1&&wz!==OZ&&wz!==OZ+D-1)continue;
    const wh=Math.max(Math.round(surfaceHeight(wx,wz)),1);
    for(let wy=wh+1;wy<=wh+3;wy++)addBlock(wx,wy,wz,BL.STONE);
  }}
})();
const _m4=new THREE.Matrix4(),_col=new THREE.Color();
function rebuildType(t){
  if(typeMeshes[t]){scene.remove(typeMeshes[t]);typeMeshes[t]=null}
  const arr=typePos[t],n=arr.length/3;if(n===0)return;
  const mesh=new THREE.InstancedMesh(GEO[t]||GEO.stone,t===BL.WATER?MAT_WATER:MAT_SOLID,n);
  for(let i=0;i<n;i++){
    _m4.makeTranslation(arr[i*3]+0.5,arr[i*3+1]+0.5,arr[i*3+2]+0.5);mesh.setMatrixAt(i,_m4);
    if(t!==BL.WATER){if(t===BL.GRASS)_col.setHSL(rand(0.25,0.36),0.5,rand(0.42,0.6));else if(t===BL.LEAVES)_col.setHSL(rand(0.26,0.4),0.55,rand(0.3,0.46));else{const v=rand(0.9,1.1);_col.setRGB(v,v,v)}mesh.setColorAt(i,_col)}
  }
  mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  scene.add(mesh);typeMeshes[t]=mesh;
}
function rebuildWorld(){Object.values(BL).forEach(rebuildType)}
rebuildWorld();

// ============================ 天空 ============================
const sun=new THREE.Mesh(new THREE.BoxGeometry(6,6,6),new THREE.MeshBasicMaterial({color:0xffdd66}));scene.add(sun);
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x6a5a3a,1);scene.add(hemi);
const dirLight=new THREE.DirectionalLight(0xfff3d6,1.2);scene.add(dirLight);
function updateSky(dt){
  sun.position.set(60,80,30);
  dirLight.position.set(60,80,20);dirLight.target.position.set(0,0,0);
  if(!dirLight.target.parent)scene.add(dirLight.target);
  scene.background.setHex(0x7ec8f5);scene.fog.color.setHex(0xa8d8f0);
  hemi.intensity=1.1;dirLight.intensity=1.25;
}
const clouds=new THREE.Group();
const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x222222});
for(let i=0;i<10;i++){const cg=new THREE.Group();for(let j=0;j<4;j++){const s=rand(3,6);const cb=new THREE.Mesh(new THREE.BoxGeometry(s,1.2,s*0.7),cloudMat);cb.position.set(j*2.3-3.5,rand(-0.6,0.6),rand(-1,1));cg.add(cb)}cg.position.set(rand(-90,90),rand(34,42),rand(-90,90));cg.userData.speed=rand(0.4,0.9);clouds.add(cg)}
scene.add(clouds);
function updateClouds(dt){clouds.children.forEach(c=>{c.position.x+=c.userData.speed*dt;if(c.position.x>100)c.position.x=-100})}

// ============================ 玩家 ============================
const PW=0.3,PH=1.8,EYE=1.62;
const B_MIN=OX+PW+0.05,B_MAX=OX+W-PW-0.05;
const player={pos:new THREE.Vector3(0,0,0),vel:new THREE.Vector3(),yaw:0,pitch:0,health:200,onGround:false,dead:false,hitCd:0};
player.pos.set(0,surfaceHeight(0,0)+3,0);
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){player.yaw-=e.movementX*0.0022;player.pitch-=e.movementY*0.0022;player.pitch=clamp(player.pitch,-1.55,1.55)}});
function collidesAt(px,py,pz){
  const x0=Math.floor(px-PW),x1=Math.floor(px+PW);const y0=Math.floor(py),y1=Math.floor(py+PH);const z0=Math.floor(pz-PW),z1=Math.floor(pz+PW);
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)if(isSolid(x,y,z))return true;return false;
}
function moveAxis(axis,delta){player.pos[axis]+=delta;if(collidesAt(player.pos.x,player.pos.y,player.pos.z)){player.pos[axis]-=delta;return true}return false}
function updatePlayer(dt){
  const fwd=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  const sprint=keys['ShiftLeft']||keys['ShiftRight'];const speed=sprint?7.5:4.6;
  let mx=0,mz=0;
  if(keys['KeyW'])mz+=1;if(keys['KeyS'])mz-=1;if(keys['KeyA'])mx-=1;if(keys['KeyD'])mx+=1;
  const mv=new THREE.Vector3();
  if(mx||mz){mv.addScaledVector(fwd,mz).addScaledVector(right,mx).normalize().multiplyScalar(speed)}
  player.vel.x=mv.x;player.vel.z=mv.z;
  if(keys['Space']&&player.onGround){player.vel.y=8.6;player.onGround=false}
  player.vel.y-=24*dt;player.vel.y=Math.max(player.vel.y,-28);
  if(moveAxis('x',player.vel.x*dt))player.vel.x=0;
  if(moveAxis('z',player.vel.z*dt))player.vel.z=0;
  player.onGround=false;
  if(moveAxis('y',player.vel.y*dt)){if(player.vel.y<0)player.onGround=true;player.vel.y=0}
  if(player.pos.y<-10){player.pos.set(0,surfaceHeight(0,0)+3,0);player.vel.set(0,0,0);toast('⚠️ 坠入虚空，传送回安全区域')}
  player.pos.x=clamp(player.pos.x,B_MIN,B_MAX);player.pos.z=clamp(player.pos.z,B_MIN,B_MAX);
  player.hitCd-=dt;
}

// ============================ 粒子 ============================
class CubeParticles{
  constructor(cap){this.cap=cap;this.pts=[];this.cursor=0;this.mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xffffff}),cap);this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);const m=new THREE.Matrix4();m.makeScale(0,0,0);for(let i=0;i<cap;i++)this.mesh.setMatrixAt(i,m);scene.add(this.mesh)}
  spawn(o){let p=this.pts[this.cursor];if(!p){p={pos:new THREE.Vector3(),vel:new THREE.Vector3(),rot:new THREE.Vector3(),spin:new THREE.Vector3(),col:new THREE.Color()};this.pts[this.cursor]=p}this.cursor=(this.cursor+1)%this.cap;p.alive=true;p.life=p.life0=o.life||1;p.pos.set(o.x,o.y,o.z);p.vel.set(o.vx||0,o.vy||0,o.vz||0);p.rot.set(rand(0,6),rand(0,6),rand(0,6));p.spin.set(rand(-9,9),rand(-9,9),rand(-9,9));p.size=o.size||0.3;p.gravity=o.gravity===undefined?10:o.gravity;p.col.set(o.color===undefined?0xffffff:o.color)}
  update(dt){const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),s=new THREE.Vector3();for(let i=0;i<this.pts.length;i++){const p=this.pts[i];if(!p.alive)continue;p.life-=dt;if(p.life<=0){p.alive=false;m.makeScale(0,0,0);this.mesh.setMatrixAt(i,m);continue}p.vel.y-=p.gravity*dt;p.pos.addScaledVector(p.vel,dt);p.rot.x+=p.spin.x*dt;p.rot.y+=p.spin.y*dt;p.rot.z+=p.spin.z*dt;const sc=p.size*(p.life/p.life0);s.set(sc,sc,sc);e.set(p.rot.x,p.rot.y,p.rot.z);q.setFromEuler(e);m.compose(p.pos,q,s);this.mesh.setMatrixAt(i,m);this.mesh.setColorAt(i,p.col)}this.mesh.instanceMatrix.needsUpdate=true;if(this.mesh.instanceColor)this.mesh.instanceColor.needsUpdate=true}
}

let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function noiseBurst(dur,freq,vol,type){try{const c=ac();const buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const src=c.createBufferSource();src.buffer=buf;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(freq,c.currentTime);f.frequency.exponentialRampToValueAtTime(freq*0.12,c.currentTime+dur);const g=c.createGain();g.gain.value=vol;src.connect(f);f.connect(g);g.connect(c.destination);src.start()}catch(e){}}
function playBoom(s){noiseBurst(0.9*s,500+300*s,0.9)}
function playPop(){noiseBurst(0.25,1800,0.35,'bandpass')}
function playShoot(){noiseBurst(0.14,1400,0.35)}
function playHurt(){try{const c=ac();const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(160,c.currentTime);o.frequency.exponentialRampToValueAtTime(60,c.currentTime+0.25);const g=c.createGain();g.gain.setValueAtTime(0.2,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.3);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.32)}catch(e){}}

const zombies=[];let wave=0;
function createZombie(x,z){
  const g=new THREE.Group();
  const mBody=new THREE.MeshLambertMaterial({color:0x5d8c4a});
  const mDark=new THREE.MeshLambertMaterial({color:0x3f6b33});
  const mSkin=new THREE.MeshLambertMaterial({color:0x9cbb6b});
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.8,0.9,0.4),mBody));
  g.children[0].position.y=1.15;
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.62,0.62,0.62),mSkin));
  g.children[1].position.y=1.92;
  const armL=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.85,0.26),mDark);armL.position.set(-0.56,1.15,0);g.add(armL);
  const armR=armL.clone();armR.position.x=0.56;g.add(armR);
  const legL=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.85,0.32),mDark);legL.position.set(-0.2,0.42,0);g.add(legL);
  const legR=legL.clone();legR.position.x=0.2;g.add(legR);
  const mats=[];g.traverse(o=>{if(o.isMesh)mats.push(o.material)});
  g.userData.z={vel:new THREE.Vector3(),fling:false,dead:false,hp:3+wave,flashT:0,mats,speed:rand(1.4,2.4),wp:null,walk:rand(0,6)};
  g.position.set(x,surfaceHeight(x,z)+0.05,z);scene.add(g);zombies.push(g);return g;
}
function killZombie(z){
  const st=z.userData.z;if(st.dead)return;st.dead=true;
  spawnSmoke(z.position,2);spawnDebris(z.position,2);
  score+=10;$('score').textContent='分数: '+score;
  later(0.5,()=>{if(z.parent)scene.remove(z)});
  zombies.splice(zombies.indexOf(z),1);
  if(netOk)netSend({t:"zk",x:+z.position.x.toFixed(1),y:+z.position.y.toFixed(1),z:+z.position.z.toFixed(1)},0);
}
function updateZombies(dt){
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];const st=z.userData.z;
    if(st.dead){z.scale.setScalar(Math.max(0.001,z.scale.x-dt*2));if(z.scale.x<=0.01){scene.remove(z);zombies.splice(i,1)}continue}
    if(st.flashT>0){st.flashT-=dt;const k=Math.max(0,st.flashT/0.15);for(const m of st.mats)m.emissive.setRGB(k,k*0.12,k*0.08)}
    const toPlayer=new THREE.Vector3(player.pos.x,player.pos.y-1,player.pos.z);
    const dist=z.position.distanceTo(toPlayer);
    const dir=new THREE.Vector3();
    if(st.fling){
      st.vel.y-=24*dt;z.position.addScaledVector(st.vel,dt);
      const gh=surfaceHeight(z.position.x,z.position.z);
      if(z.position.y<=gh+0.15&&st.vel.y<=0){killZombie(z);continue}
      z.rotation.x+=dt*6;z.rotation.z+=dt*4;
    }else{
      if(dist<16&&player.health>0){dir.copy(toPlayer).sub(z.position);dir.y=0;if(dir.lengthSq()>0.001)dir.normalize();st.speed=rand(2.8,3.8)}
      else{if(!st.wp||z.position.distanceTo(st.wp)<1.2)st.wp=new THREE.Vector3(z.position.x+rand(-8,8),0,z.position.z+rand(-8,8));dir.copy(st.wp).sub(z.position);dir.y=0;if(dir.lengthSq()>0.001)dir.normalize();st.speed=rand(1,1.8)}
      z.position.addScaledVector(dir,st.speed*dt);
      const gh=surfaceHeight(z.position.x,z.position.z);z.position.y=gh+0.05;
      if(dir.lengthSq()>0.01)z.rotation.y=Math.atan2(dir.x,dir.z);
      st.walk+=dt*8;const swing=Math.sin(st.walk)*0.5;
      z.children[2].rotation.x=swing;z.children[3].rotation.x=-swing;z.children[4].rotation.x=-swing*0.7;z.children[5].rotation.x=swing*0.7;
      if(dist<1.35&&player.health>0&&player.hitCd<=0){player.hitCd=0.8;damagePlayer(3)}
    }
  }
}
function spawnWave(){
  wave++;
  const n=Math.min(8+wave*3,40);let spawned=0;
  const corners=[{x:OX+3,z:OZ+3},{x:OX+W-4,z:OZ+3},{x:OX+3,z:OZ+D-4},{x:OX+W-4,z:OZ+D-4}];
  for(let i=0;i<n;i++){if(zombies.length>=40)break;const c=corners[i%corners.length];createZombie(c.x+rand(-2,2),c.z+rand(-2,2));spawned++}
  toast('🧟 第 '+wave+' 波（+'+spawned+'只僵尸）');
}

const gunGroup=new THREE.Group();
{const gMat=new THREE.MeshLambertMaterial({color:0x4a4a4a});const dMat=new THREE.MeshLambertMaterial({color:0x2c2c2c});const mMat=new THREE.MeshLambertMaterial({color:0x8a5a3a});const bMat=new THREE.MeshLambertMaterial({color:0x999999});

const raycaster=new THREE.Raycaster();const ndc=new THREE.Vector2(0,0);
function spawnImpact(point,color,big,count){const n=count||(big?14:9);for(let i=0;i<n;i++){const a2=rand(0,Math.PI*2),b=rand(0.2,3);const sp=rand(2,big?9:6);particles.spawn({x:point.x,y:point.y,z:point.z,vx:Math.sin(b)*Math.cos(a2)*sp,vy:Math.abs(Math.sin(b))*sp,vz:Math.sin(b)*Math.sin(a2)*sp,life:rand(0.15,0.4),size:big?rand(0.25,0.5):rand(0.15,0.35),gravity:6,color})}if(big)spawnRing(point,3)}
function shoot(){
  recoil=1;muzzleT=0.06;gunGroup.userData.muzzle.visible=true;muzzleLight.intensity=30;playShoot();
  for(let i=0;i<4;i++)particles.spawn({x:player.pos.x,y:player.pos.y+EYE,z:player.pos.z,vx:rand(-0.6,0.6),vy:rand(-0.4,0.4),vz:rand(-0.6,0.6),life:rand(0.06,0.15),size:rand(0.2,0.45),gravity:0,color:0xffdd44});
  raycaster.setFromCamera(ndc,camera);
  const zHits=raycaster.intersectObjects(zombies,true);
  const bHits=raycaster.intersectObjects(Object.values(typeMeshes).filter(m=>!!m),false);
  let zHit=null,bHit=null;
  if(zHits.length){let o=zHits[0].object;while(o&&!o.userData.z)o=o.parent;if(o&&o.userData.z)zHit={group:o,dist:zHits[0].distance,point:zHits[0].point}}
  if(bHits.length)bHit={dist:bHits[0].distance,point:bHits[0].point};
  let target=null;
  if(zHit&&(!bHit||zHit.dist<=bHit.dist))target=zHit;else if(bHit)target=bHit;
  if(!target)return;
  spawnImpact(target.point,0xffdd44,false,9);
  if(target===zHit)damageZombie(zHit.group,1,target.point);
}
function damageZombie(z,dmg,point){const st=z.userData.z;if(st.dead)return;st.hp-=dmg;st.flashT=0.15;if(point)spawnImpact(point,0xff4444,false,4);if(st.hp<=0)killZombie(z)}
function updateShoot(dt){
  shootCd-=dt;
  if(shooting&&shootCd<=0&&!player.dead){shootCd=0.20;shoot()}
  recoil=Math.max(0,recoil-dt*7);muzzleT-=dt;
  if(muzzleT<=0){gunGroup.userData.muzzle.visible=false;muzzleLight.intensity=Math.max(0,muzzleLight.intensity-dt*400)}
  const moving=Math.hypot(player.vel.x,player.vel.z);
  bobPhase+=dt*(moving>0.5?11:4);
  const bobX=Math.sin(bobPhase)*0.018*Math.min(moving*0.25,1);
  const bobY=Math.abs(Math.cos(bobPhase))*0.014*Math.min(moving*0.25,1);
  gunGroup.position.set(0.42+bobX,-0.38+bobY,-0.85+recoil*0.18);
  gunGroup.rotation.x=recoil*0.55;
}

// ============================ 网络（MQTT联机） ============================
let netOk=false,mqttClient=null,isHost=false;
const myId=Math.random().toString(36).slice(2,10);
let myName="",room="1";
const peers=new Map(),actors=new Map(),_allIds=[];
const remoteZombies=new Map();
const RZMAT=new THREE.MeshLambertMaterial({color:0x5d8c4a});
const RZGEO=new THREE.BoxGeometry(0.8,1.8,0.4);
const RZHEAD=new THREE.BoxGeometry(0.62,0.62,0.62);
const RZHEADMAT=new THREE.MeshLambertMaterial({color:0x9cbb6b});

function _updateHost(){_allIds.sort();isHost=_allIds[0]===myId}
function netStart(){
  if(typeof mqtt==="undefined"){toast("联机模块加载失败（单机模式）");return}
  const opts={clientId:"shoot_"+myId,connectTimeout:4000,reconnectPeriod:3000,clean:true};
  function tryConnect(url){return new Promise((resolve,reject)=>{try{const c=mqtt.connect(url,opts);const timer=setTimeout(()=>{try{c.end(true)}catch(_){};reject("timeout")},5000);c.on("connect",()=>{clearTimeout(timer);resolve(c)});c.on("error",e=>{clearTimeout(timer);reject(e)})}catch(e){reject(e)}})}
  tryConnect("wss://broker.emqx.io:8084/mqtt").catch(()=>tryConnect("wss://b21-mqtt.section.io:8884/mqtt")).then(c=>{
    mqttClient=c;netOk=true;_allIds.length=0;_allIds.push(myId);_updateHost();
    c.subscribe("game/"+room+"/#");
    c.publish("game/"+room+"/join",JSON.stringify({id:myId,name:myName}));
    c.on("message",(topic,msg)=>{try{handleNet(JSON.parse(msg.toString()))}catch(_){}});
    setInterval(()=>{
      if(!netOk)return;_updateHost();
      netSend({t:"hb",id:myId,name:myName,x:+player.pos.x.toFixed(1),y:+player.pos.y.toFixed(1),z:+player.pos.z.toFixed(1),yaw:+player.yaw.toFixed(2),hp:player.health,wave,waveT:Math.max(0,waveTimer)},0);
      if(isHost){const zs=[];for(const z of zombies){if(z.userData.z.dead)continue;zs.push({x:+z.position.x.toFixed(1),y:+z.position.y.toFixed(1),z:+z.position.z.toFixed(1),hp:z.userData.z.hp})}netSend({t:"zs",zs},0)}
    },100);
    toast("✅ 联机成功"+(_allIds.length>1?"（"+_allIds.length+"人在线）":""));
  }).catch(()=>{toast("联机失败（单机模式）")});
}
function netSend(obj,qos){if(!mqttClient||!netOk)return;try{mqttClient.publish("game/"+room+"/"+myId,JSON.stringify(obj),{qos:qos||0})}catch(_){}}
function handleNet(msg){
  if(msg.id===myId)return;
  if(!_allIds.includes(msg.id)){_allIds.push(msg.id);_updateHost()}
  if(msg.t==="hb"){
    if(!peers.has(msg.id)){peers.set(msg.id,{pos:new THREE.Vector3(msg.x,msg.y,msg.z),yaw:msg.yaw,hp:msg.hp,name:msg.name||"??",last:performance.now()});
      const g=new THREE.Group();const bm2=new THREE.MeshLambertMaterial({color:0x3366ff});
      g.add(new THREE.Mesh(new THREE.BoxGeometry(0.8,0.9,0.4),bm2),new THREE.Mesh(new THREE.BoxGeometry(0.62,0.62,0.62),bm2));
      g.children[0].position.y=1.15;g.children[1].position.y=1.92;scene.add(g);actors.set(msg.id,g);
      toast("👋 "+msg.name+" 加入了游戏（"+_allIds.length+"人在线）");
    }else{const p=peers.get(msg.id);p.last=performance.now();p.pos.set(msg.x,msg.y,msg.z);p.yaw=msg.yaw;p.hp=msg.hp;p.name=msg.name||p.name}
    if(msg.wave!==undefined&&msg.wave>wave){wave=msg.wave;waveTimer=msg.waveT||15}
  }else if(msg.t==="zs"&&!isHost){
    const seen=new Set();
    for(let i=0;i<msg.zs.length;i++){const d=msg.zs[i];seen.add(i);let rz=remoteZombies.get(i);
      if(!rz){const m=new THREE.Group();m.add(new THREE.Mesh(RZGEO,RZMAT),new THREE.Mesh(RZHEAD,RZHEADMAT));m.children[0].position.y=1.15;m.children[1].position.y=1.92;scene.add(m);rz={mesh:m};remoteZombies.set(i,rz)}
      rz.mesh.position.set(d.x,d.y,d.z);
    }
    remoteZombies.forEach((rz,idx)=>{if(!seen.has(idx)){scene.remove(rz.mesh);remoteZombies.delete(idx)}});
  }else if(msg.t==="zk"){
    let best=null,bestD=Infinity;
    for(const z of zombies){if(z.userData.z.dead)continue;const d=Math.hypot(z.position.x-msg.x,z.position.y-msg.y,z.position.z-msg.z);if(d<bestD){bestD=d;best=z}}
    if(best&&bestD<3)killZombie(best);
  }else if(msg.t==="pl"){
    const a=actors.get(msg.id);if(a)a.children.forEach(c=>{c.material.emissive.setHex(0xff0000);setTimeout(()=>c.material.emissive.setHex(0),200)});
  }
}
function updatePeers(){actors.forEach((mesh,id)=>{const p=peers.get(id);if(!p||performance.now()-p.last>6000){scene.remove(mesh);actors.delete(id);peers.delete(id);return}mesh.position.copy(p.pos);mesh.rotation.y=p.yaw})}

const clock=new THREE.Clock();

function updateCamera(dt){
  camera.position.set(player.pos.x,player.pos.y+EYE,player.pos.z);
  if(shakeAmp>0.001){camera.position.x+=rand(-1,1)*shakeAmp*0.45;camera.position.y+=rand(-1,1)*shakeAmp*0.45;camera.position.z+=rand(-1,1)*shakeAmp*0.45;shakeAmp*=Math.exp(-5.5*dt)}
  camera.rotation.set(player.pitch+recoil*0.07,player.yaw,0);
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  updateClouds(dt);updateRings(dt);updateBoomLight(dt);updateTimers(dt);particles.update(dt);
  if(!player.dead){
    updateSky(dt);updatePlayer(dt);updateShoot(dt);
    if(isHost){updateZombies(dt);waveTimer-=dt;if(waveTimer<=0){spawnWave();waveTimer=Math.max(8,20-wave)}}
    updatePeers();
  }
  if(vignetteAmp>0){vignetteAmp=Math.max(0,vignetteAmp-dt*1.4);$('vignette').style.opacity=vignetteAmp}
  const fl=$('flash');if(parseFloat(fl.style.opacity||0)>0)fl.style.opacity=Math.max(0,parseFloat(fl.style.opacity)-dt*2.5);
  updateCamera(dt);renderer.render(scene,camera);
  $('online-info').textContent='玩家 '+(peers.size+1)+(netOk?(isHost?' (主机)':' (客户端)'):' (单机)');
}

// ============================ 启动 ============================
function startGame(){
  ac();$('overlay-start').classList.add('hidden');
  myName=($('name').value||"玩家").slice(0,12);
  room=($('room').value||"1").replace(/[^a-zA-Z0-9]/g,"")||"1";
  canvas.requestPointerLock();
  player.pos.set(0,surfaceHeight(0,0)+3,0);
  netStart();
  toast("⚔️ 射击僵尸，和好友联机闯关！");
}
$('start-btn').onclick=startGame;
$('restart-btn').onclick=()=>location.reload();
document.addEventListener('pointerlockchange',()=>{});
canvas.addEventListener("click",()=>{if(!document.pointerLockElement)canvas.requestPointerLock()});
document.addEventListener('mousedown',e=>{if(document.pointerLockElement===canvas&&e.button===0)shooting=true});
document.addEventListener('mouseup',e=>{if(e.button===0)shooting=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
updateHealthUI();
$('ammo').textContent='🔫 普通子弹（无限子弹）';
window.P=player;window.zombies=zombies;window.netOk=netOk;window.isHost=isHost;window.peers=peers;
animate();
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>昙花一现 · 五彩粒子爱心</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#080614}
canvas{display:block}
#hint{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    color:rgba(120,140,190,0.7);
    font-size:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    pointer-events:none;user-select:none;
    animation:fadeOut 4s ease forwards;
}
@keyframes fadeOut{
    0%,40%{opacity:1}
    100%{opacity:0}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">空格 = 重新散落 · ESC = 退出</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Config ───
const BG = [8, 6, 20];
const NUM = 500;
const TRAIL_A = 0.086;
const MAX_STARS = 4;

// ─── HSL → RGB ───
function hslToRgb(h, s, l) {
    // h: 0-360, s: 0-1, l: 0-1
    h /= 360;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => {
        const k = (n + h * 12) % 12;
        return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    };
    return [f(0) * 255 | 0, f(1) * 255 | 0, f(2) * 255 | 0];
}

function randomColor() {
    return hslToRgb(Math.random() * 360, 0.75 + Math.random() * 0.25, 0.55 + Math.random() * 0.25);
}

// ─── Heart shape ───
function heartXY(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [x, -y];
}

const SCALE = 17;
const targets = [];
for (let i = 0; i < NUM; i++) {
    const t = i / NUM * 2 * Math.PI + (Math.random() - 0.5) * 0.03;
    let [x, y] = heartXY(t);
    x += (Math.random() - 0.5) * 0.2;
    y += (Math.random() - 0.5) * 0.2;
    targets.push([x * SCALE, y * SCALE]);
}

// ─── Glow texture cache ───
const glowCache = new Map();
function getGlow(radius) {
    const r = Math.max(1, Math.round(radius));
    if (glowCache.has(r)) return glowCache.get(r);
    const size = r * 2;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const cx = c.getContext('2d');
    const grad = cx.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.15, 'rgba(255,255,255,0.55)');
    grad.addColorStop(0.4, 'rgba(255,255,255,0.15)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    cx.fillStyle = grad;
    cx.fillRect(0, 0, size, size);
    glowCache.set(r, c);
    return c;
}

// ─── Particle ───
class Particle {
    constructor(idx) {
        this.idx = idx;
        const [tx, ty] = targets[idx];
        this.ox = tx;
        this.oy = ty;
        this.reset();

        this.color = randomColor();
        this.size = 2 + Math.random() * 3.5;
        this.baseA = 0.55 + Math.random() * 0.45;
        this.phase = Math.random() * 2 * Math.PI;
        this.glowMul = 1 + Math.random() * 1.5;
        this.spSpeed = 1.5 + Math.random() * 2;
        this.spPhase = Math.random() * 2 * Math.PI;
    }

    reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = 0;
        this.vy = 0;
    }

    update(breath, t, cx, cy) {
        const tx = this.ox * breath + cx;
        const ty = this.oy * breath + cy;

        const dx = tx - this.x;
        const dy = ty - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0.3) {
            const force = 0.006 + 0.003 * Math.min(dist / 50, 1);
            this.vx += dx * force;
            this.vy += dy * force;
            this.vx *= 0.93;
            this.vy *= 0.93;
            this.x += this.vx;
            this.y += this.vy;
        } else {
            this.x += (tx - this.x) * 0.06;
            this.y += (ty - this.y) * 0.06;
        }

        const bm = 0.7 + 0.3 * Math.sin(t * 0.9 + this.phase);
        const sp = 0.88 + 0.12 * Math.sin(t * this.spSpeed + this.spPhase);
        this._alpha = this.baseA * bm * sp;
        this._pulse = this.size * (0.92 + 0.08 * Math.sin(t * 0.6 + this.phase * 0.7));
    }

    draw() {
        const a = this._alpha;
        if (a < 0.01) return;
        const px = this.x, py = this.y;
        const s = this._pulse;
        const [r, g, b] = this.color;

        // Glow halo
        const gr = s * this.glowMul;
        ctx.globalAlpha = a * 0.5;
        ctx.drawImage(getGlow(gr), px - gr, py - gr);

        // Colored core
        const cr = Math.max(1, s * 0.45);
        ctx.globalAlpha = a;
        ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
        ctx.beginPath();
        ctx.arc(px, py, cr, 0, Math.PI * 2);
        ctx.fill();

        // White hot center
        ctx.globalAlpha = a * 0.85;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, Math.max(1, cr * 0.4), 0, Math.PI * 2);
        ctx.fill();
    }
}

// ─── Shooting Star ───
class ShootingStar {
    constructor() {
        this.reset();
    }

    reset() {
        // Spawn from top or top-sides
        const roll = Math.random();
        if (roll < 0.55) {
            this.x = 20 + Math.random() * (W - 40);
            this.y = -10 - Math.random() * 25;
        } else if (roll < 0.78) {
            this.x = -15 - Math.random() * 30;
            this.y = Math.random() * H * 0.35;
        } else {
            this.x = W + 15 + Math.random() * 30;
            this.y = Math.random() * H * 0.35;
        }

        // Diagonal down
        const angle = Math.PI / 3.5 + Math.random() * Math.PI / 4;
        const speed = 7 + Math.random() * 9;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        if (this.x > W / 2) this.vx = -this.vx;
        this.speed = speed;

        this.life = 1;
        this.decay = 0.006 + Math.random() * 0.01;
        this.active = true;

        // Color tint per star
        const hue = Math.random() * 360;
        this.rgb = hslToRgb(hue, 0.85, 0.75);
        this.colorStr = `rgb(${this.rgb[0]},${this.rgb[1]},${this.rgb[2]})`;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        if (this.life <= 0 || this.y > H + 60 || this.x < -120 || this.x > W + 120) {
            this.active = false;
        }
    }

    draw() {
        if (!this.active || this.life <= 0) return;

        const l = this.life;
        const len = 45 + 30 * l;
        const sp = this.speed;
        const tx = this.x - (this.vx / sp) * len;
        const ty = this.y - (this.vy / sp) * len;

        // Tail dots (colored, fading)
        for (let i = 0; i < 12; i++) {
            const t = i / 11;
            const px = this.x + (tx - this.x) * t;
            const py = this.y + (ty - this.y) * t;
            const a = l * (1 - t * 0.92);
            ctx.globalAlpha = a * 0.3;
            ctx.fillStyle = this.colorStr;
            ctx.beginPath();
            ctx.arc(px, py, 4 * (1 - t * 0.7), 0, Math.PI * 2);
            ctx.fill();
        }

        // Head glow — reuse cached white glow, tint by overlay
        ctx.globalAlpha = l * 0.35;
        ctx.drawImage(getGlow(9), this.x - 9, this.y - 9);

        // Colored head
        ctx.globalAlpha = l * 0.55;
        ctx.fillStyle = this.colorStr;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fill();

        // White core
        ctx.globalAlpha = l * 0.85;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ─── Init ───
let cx = W >> 1, cy = (H >> 1) - 15;
const particles = Array.from({ length: NUM }, (_, i) => new Particle(i));
const stars = Array.from({ length: MAX_STARS }, () => new ShootingStar());
// Initially all inactive
stars.forEach(s => s.active = false);
let starTimer = 1.5; // seconds until first star
let elapsed = 0, lastTime = 0;

// Ambient center glow
const centerGlowSize = 200;
const cgCanvas = document.createElement('canvas');
cgCanvas.width = centerGlowSize * 2;
cgCanvas.height = centerGlowSize * 2;
const cgCtx = cgCanvas.getContext('2d');
const cgGrad = cgCtx.createRadialGradient(centerGlowSize, centerGlowSize, 0,
    centerGlowSize, centerGlowSize, centerGlowSize);
cgGrad.addColorStop(0, 'rgba(100,140,200,0.06)');
cgGrad.addColorStop(0.5, 'rgba(80,120,180,0.03)');
cgGrad.addColorStop(1, 'rgba(0,0,0,0)');
cgCtx.fillStyle = cgGrad;
cgCtx.fillRect(0, 0, centerGlowSize * 2, centerGlowSize * 2);

// ─── Spawn shooting star ───
function spawnStar() {
    // Find an inactive star slot
    for (const s of stars) {
        if (!s.active) {
            s.reset();
            return;
        }
    }
}

// ─── Main loop ───
function frame(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    elapsed += dt;
    cx = W >> 1;
    cy = (H >> 1) - 15;

    const breath = 1 + 0.18 * Math.sin(elapsed * 1.1);

    // Trail: semi-transparent BG overlay
    ctx.fillStyle = `rgba(${BG[0]},${BG[1]},${BG[2]},${TRAIL_A})`;
    ctx.fillRect(0, 0, W, H);

    // Ambient center glow
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(elapsed * 0.3);
    ctx.drawImage(cgCanvas, cx - centerGlowSize, cy - centerGlowSize);

    // Shooting star spawn timer
    starTimer -= dt;
    if (starTimer <= 0) {
        const activeCount = stars.filter(s => s.active).length;
        if (activeCount < MAX_STARS) {
            spawnStar();
            // Next spawn: 2-5 seconds
            starTimer = 1.5 + Math.random() * 3.5;
        } else {
            starTimer = 0.5; // retry soon
        }
    }

    // Update & draw shooting stars
    for (const s of stars) {
        if (s.active) {
            s.update();
            s.draw();
        }
    }

    // Particles
    ctx.globalAlpha = 1;
    for (const p of particles) {
        p.update(breath, elapsed, cx, cy);
        p.draw();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

// ─── Controls ───
document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
        e.preventDefault();
        for (const p of particles) p.reset();
        elapsed = 0;
        starTimer = 0.5;
    }
    if (e.code === 'Escape') {
        window.close();
    }
});

window.addEventListener('resize', () => {
    resize();
    cx = W >> 1;
    cy = (H >> 1) - 15;
});
</script>
</body>
</html>

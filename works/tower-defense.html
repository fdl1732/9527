<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🏰 方块世界塔防</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Microsoft YaHei",sans-serif;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(255,255,255,.8)}
#cross::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#cross::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#hp-wrap{position:absolute;top:10px;left:10px;width:160px;background:rgba(0,0,0,.55);border:2px solid #555;border-radius:4px;padding:3px}
#hp-bar{height:14px;width:100%;background:linear-gradient(#5fe03a,#3fae22);border-radius:2px;transition:width .15s}
#hp-text{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#fff;font-size:10px;font-weight:bold;text-shadow:1px 1px 2px #000}
#info{position:absolute;top:10px;right:10px;color:#fff;font-size:12px;text-shadow:1px 1px 2px #000;text-align:right;line-height:1.8}
#res{font-size:14px;margin-bottom:4px}
#res span{margin-left:10px;padding:2px 6px;border-radius:3px}
#stone-count{background:rgba(136,136,136,.5);color:#ccc}
#iron-count{background:rgba(204,136,68,.5);color:#ffd93d}
#wave-info{color:#f88;font-size:14px}
#score-info{color:#8f8}
#hotbar{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:4px;background:rgba(0,0,0,.65);border:2px solid #555;border-radius:5px}
.hs{width:52px;height:52px;background:rgba(255,255,255,.08);border:2px solid #666;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;cursor:pointer;pointer-events:auto;transition:border-color .15s}
.hs.act{border-color:#ffd93d;background:rgba(255,215,0,.18);box-shadow:0 0 8px rgba(255,215,0,.35)}
.hs .ct{position:absolute;bottom:2px;right:4px;font-size:10px;color:#fff;text-shadow:1px 1px 1px #000}
.hs .lb{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:#aaa;white-space:nowrap}
.hs.act .lb{color:#ffd93d}
#touch{position:fixed;bottom:0;left:0;right:0;height:220px;pointer-events:none;z-index:20}
#joy{position:absolute;left:24px;bottom:24px;width:150px;height:150px;background:rgba(255,255,255,.1);border-radius:50%;border:2px solid rgba(255,255,255,.2);pointer-events:auto}
#joy-k{position:absolute;width:60px;height:60px;background:rgba(255,255,255,.3);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.tb{position:absolute;width:68px;height:68px;background:rgba(255,255,255,.12);border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none}
#b-jump{right:24px;bottom:80px}
#b-act{right:100px;bottom:80px;background:rgba(255,120,60,.22);border-color:rgba(255,120,60,.4);flex-direction:column}
#b-act span{font-size:11px;margin-top:2px}
#b-del{right:24px;bottom:160px;background:rgba(255,60,60,.22);border-color:rgba(255,60,60,.4)}
.tb:active{background:rgba(255,255,255,.3);transform:scale(.92)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
.ov h1{font-size:30px;margin-bottom:8px}.ov .sub{color:#aaa;font-size:13px;margin-bottom:18px;text-align:center;line-height:1.7}
.ov button{padding:12px 36px;font-size:16px;border:none;border-radius:6px;cursor:pointer;margin:5px;color:#fff;font-family:inherit}
.bgo{background:#4a8;font-size:18px}
.brs{background:#f66}
#toast{position:absolute;top:36%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 20px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
#boss-warn{position:absolute;top:20%;left:50%;transform:translateX(-50%);color:#f44;font-size:28px;font-weight:bold;text-shadow:2px 2px 4px #000;opacity:0;transition:opacity .5s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div id="cross"></div>
<div id="hp-wrap"><div id="hp-bar"></div><span id="hp-text">20/20</span></div>
<div id="info">
<div id="res"><span id="stone-count">⬜ 0</span><span id="iron-count">🟠 0</span></div>
<div id="wave-info">准备开始</div>
<div id="score-info">🎯 0</div>
</div>
<div id="hotbar"></div>
<div id="boss-warn"></div>
<div id="toast"></div>
</div>
<div id="touch">
<div id="joy"><div id="joy-k"></div></div>
<div id="b-jump" class="tb">⬆</div>
<div id="b-act" class="tb">🔨<span>建造</span></div>
<div id="b-del" class="tb">❌</div>
</div>
<div class="ov" id="ov-start">
<h1>🏰 方块世界塔防</h1>
<div class="sub">
⬜ 石头 → 建造围墙阻挡僵尸<br>
🟠 铁块 → 建造防护塔自动攻击<br>
🧟 击杀僵尸获取资源，守住你的基地！
</div>
<div class="sub" style="font-size:11px;color:#888">
<b style="color:#ffd93d">PC操作：</b><br>
WASD移动 | 鼠标视角 | 左键建造 | 右键拆除<br>
空格跳跃 | 1/2切换物品 | 滚轮切换 | Q/E建造 | X/R拆除
</div>
<div class="sub" style="font-size:11px;color:#888">
<b style="color:#ffd93d">平板操作：</b><br>
左摇杆移动 | <b style="color:#fff">拖动屏幕转动视角</b><br>
点击底部⬜围墙/🏹箭塔切换 | 🔨建造 ❌拆除<br>
中央准星对准位置 → 点🔨建造
</div>
<button class="bgo" id="btn-go">⚔️ 开始战斗</button>
</div>
<div class="ov" id="ov-death" style="display:none">
<h1>💀 基地沦陷</h1>
<div class="sub" id="dinfo"></div>
<button class="brs" onclick="location.reload()">重新开始</button>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import*as T from"three";
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const C=(v,a,b)=>Math.max(a,Math.min(b,v));

function hash2(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function noise2(x,z){
const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);
const ux=xf*xf*(3-2*xf),uz=zf*zf*(3-2*zf);
return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz}
function fbm2(x,z,oct){let v=0,a=1,f=1;for(let i=0;i<oct;i++){v+=a*noise2(x*f,z*f);a*=.5;f*=2}return v}

const W=60,D=60;
const BL={AIR:0,GRASS:1,DIRT:2,STONE:3,WATER:4};
const BC={1:0x5fb84f,2:0x866043,3:0x888888,4:0x2255aa}; // 草绿/泥土棕/石头灰/水蓝 - 模仿我的世界
// Player built blocks
const BW={WALL:10,TOWER:11,TOWER_TOP:12,BULLET:13,TRAIL:14};
const BWC={10:0x999999,11:0x8B4513,12:0xCD853F,13:0xffff00,14:0xff8800};

const cv=$("c");
const ren=new T.WebGLRenderer({canvas:cv,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.setSize(innerWidth,innerHeight);
const sc=new T.Scene();
sc.background=new T.Color(0x87ceeb);
sc.fog=new T.Fog(0x87ceeb,45,100);
const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,0.1,200);
const hemi=new T.HemisphereLight(0xffffff,0x888888,0.7);sc.add(hemi);
const dl=new T.DirectionalLight(0xffffff,0.8);dl.position.set(40,60,30);sc.add(dl);
const amb=new T.AmbientLight(0x444455,0.4);sc.add(amb);
const rc=new T.Raycaster();
const ndc=new T.Vector2(0,0);

let blocks=new Map(),builtBlocks=new Map();
let tm={},bm={}; // terrain meshes, built meshes
let stone=0,iron=0,score=0,hp=20,mhp=20;
let gameTime=0,dayLen=80,wave=0,waveT=25;
let zombies=[],bullets=[],particles=[],towers=[];
let slot=0,hbar=[10,11]; // 0=wall, 1=tower
let gameStarted=false,paused=false;
let keys={},jF=0,jB=0,jL=0,jR=0,jJ=0,jA=0;
let P={pos:new T.Vector3(30,15,30),vel:new T.Vector3(),yaw:0,pitch:0,og:false,dead:false,hcd:0};

// Terrain
function getH(x,z){return Math.floor(6+fbm2(x*0.04,z*0.04,4)*5)}

function genWorld(){
blocks.clear();
for(let x=0;x<W;x++)for(let z=0;z<D;z++){
const h=getH(x,z);
for(let y=0;y<=h;y++){
let t=BL.STONE;
if(y===h)t=BL.GRASS;else if(y>=h-2)t=BL.DIRT;
blocks.set(x+","+y+","+z,t) }
// Water
if(h<=5)for(let y=h+1;y<=6;y++)if(!blocks.get(x+","+y+","+z))blocks.set(x+","+y+","+z,BL.WATER);
}
// Flat base area
for(let x=24;x<=36;x++)for(let z=24;z<=36;z++){
const h=getH(x,z);
for(let y=1;y<=h;y++)blocks.set(x+","+y+","+z,y===h?BL.GRASS:BL.DIRT);
}
// Start resources
stone=15;iron=3;
}

// Rendering
const GEO=new T.BoxGeometry(1,1,1);
const MATS={};
Object.keys(BC).forEach(k=>{MATS[k]=new T.MeshLambertMaterial({color:BC[k]})});
Object.keys(BWC).forEach(k=>{MATS[k]=new T.MeshLambertMaterial({color:BWC[k]})});

function rebuildTerrain(){
Object.values(tm).forEach(m=>{if(m)sc.remove(m)});tm={};
const g3={};
blocks.forEach((t,k)=>{if(!t)return;if(!g3[t])g3[t]=[];const[x,y,z]=k.split(",").map(Number);g3[t].push(x,y,z)});
const m4=new T.Matrix4();
Object.entries(g3).forEach(([t,a])=>{
const n=a.length/3;if(!n)return;
const mt=MATS[t]||MATS[1];
const m=new T.InstancedMesh(GEO,mt,n);
for(let i=0;i<n;i++){m4.makeTranslation(a[i*3]+.5,a[i*3+1]+.5,a[i*3+2]+.5);m.setMatrixAt(i,m4)}
m.instanceMatrix.needsUpdate=true;sc.add(m);tm[t]=m});
}

function rebuildBuilt(){
Object.values(bm).forEach(m=>{if(m)sc.remove(m)});bm={};
const g={};
builtBlocks.forEach((t,k)=>{if(!g[t])g[t]=[];const[x,y,z]=k.split(",").map(Number);g[t].push(x,y,z)});
const m4=new T.Matrix4();
Object.entries(g).forEach(([t,a])=>{
const n=a.length/3;if(!n)return;
const mt=MATS[t]||MATS[10];
const m=new T.InstancedMesh(GEO,mt,n);
for(let i=0;i<n;i++){m4.makeTranslation(a[i*3]+.5,a[i*3+1]+.5,a[i*3+2]+.5);m.setMatrixAt(i,m4)}
m.instanceMatrix.needsUpdate=true;sc.add(m);bm[t]=m});
}

function rebuild(){rebuildTerrain();rebuildBuilt()}

// Player physics
const PW=.3,PH=1.7,EY=1.5;
function gb(x,y,z){return blocks.get(x+","+y+","+z)||0}
function bb(x,y,z){return builtBlocks.get(x+","+y+","+z)||0}

function collides(px,py,pz){
const x0=Math.floor(px-PW),x1=Math.floor(px+PW);
const y0=Math.floor(py),y1=Math.floor(py+PH);
const z0=Math.floor(pz-PW),z1=Math.floor(pz+PW);
for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++){
if(gb(x,y,z)||bb(x,y,z))return true}return false}

function moveA(a,d){const p=P.pos.clone();p[a]+=d;if(!collides(p.x,p.y,p.z)){P.pos[a]+=d;return false}return true}

function updatePlayer(dt){
const sp=5;
const fw=new T.Vector3(-Math.sin(P.yaw),0,-Math.cos(P.yaw));
const rt=new T.Vector3(Math.cos(P.yaw),0,-Math.sin(P.yaw));
let mx=0,mz=0;
if(keys.KeyW||jF)mz-=1;if(keys.KeyS||jB)mz+=1;
if(keys.KeyA||jL)mx-=1;if(keys.KeyD||jR)mx+=1;
if(mx||mz){const l=Math.sqrt(mx*mx+mz*mz);mx/=l;mz/=l;
const mv=fw.clone().multiplyScalar(-mz).add(rt.clone().multiplyScalar(mx)).normalize().multiplyScalar(sp*dt);
moveA("x",mv.x);moveA("z",mv.z)}
if((keys.Space||jJ)&&P.og)P.vel.y=8;
P.vel.y-=22*dt;P.og=false;
if(moveA("y",P.vel.y*dt)){if(P.vel.y<0)P.og=true;P.vel.y=0}
P.pos.x=C(P.pos.x,1,W-2);P.pos.z=C(P.pos.z,1,D-2);
if(P.pos.y<-5){P.pos.y=15;P.vel.set(0,0,0)}
P.hcd=Math.max(0,P.hcd-dt)}

// Block targeting
function getTarget(nx,ny){
  const vx=(nx!==undefined)?nx:ndc.x, vy=(ny!==undefined)?ny:ndc.y;
  rc.setFromCamera(new T.Vector2(vx,vy),cam);
  const allMeshes=[...Object.values(tm),...Object.values(bm)].filter(m=>!!m);
  const hits=rc.intersectObjects(allMeshes,false);
  if(!hits.length)return null;
  const p=hits[0].point,n=hits[0].face.normal;
  return{
    x:Math.floor(p.x-n.x*.5),y:Math.floor(p.y-n.y*.5),z:Math.floor(p.z-n.z*.5),
    nx:Math.floor(p.x+n.x*.5),ny:Math.floor(p.y+n.y*.5),nz:Math.floor(p.z+n.z*.5)}}


// Highlight
let hlMesh=null;
let rangeIndicator=null;
let previewMesh=null;
function createHL(){
const g=new T.BoxGeometry(1.03,1.03,1.03);
const e=new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.6});
hlMesh=new T.LineSegments(new T.EdgesGeometry(g),e);
hlMesh.visible=false;sc.add(hlMesh);
// Range indicator for towers
const rangeGeo=new T.RingGeometry(13.5,14.5,64);
const rangeMat=new T.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:0.2,side:T.DoubleSide});
rangeIndicator=new T.Mesh(rangeGeo,rangeMat);
rangeIndicator.rotation.x=-Math.PI/2;
rangeIndicator.visible=false;sc.add(rangeIndicator);
// Preview mesh for building
previewMesh=new T.Mesh(new T.BoxGeometry(1,1,1),new T.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:0.4}));
previewMesh.visible=false;sc.add(previewMesh)}

// Build actions
function doBuild(t){
  if(!t)t=getTarget();if(!t)return;
  const it=hbar[slot];
  if(it===10){
    // Wall - needs stone, place at target
    if(stone<=0){showToast("石头不足！");return}
    if(bb(t.nx,t.ny,t.nz)||gb(t.nx,t.ny,t.nz))return;
    // Don't build too high
    if(t.ny>getH(t.nx,t.nz)+6)return;
    stone--;
    builtBlocks.set(t.nx+","+t.ny+","+t.nz,BW.WALL);
    rebuildBuilt();showToast("🧱 建造围墙")}
  else if(it===11){
    // Arrow Tower - needs iron, place at target
    if(iron<=0){showToast("铁块不足！");return}
    if(bb(t.nx,t.ny,t.nz)||gb(t.nx,t.ny,t.nz))return;
    if(t.ny>getH(t.nx,t.nz)+6)return;
    iron--;
    // Arrow Tower = wooden base + walls + pointed top
    const bx=t.nx,by=t.ny,bz=t.nz;
    builtBlocks.set(bx+","+by+","+bz,BW.TOWER);
    builtBlocks.set(bx+","+(by+1)+","+bz,BW.TOWER);
    builtBlocks.set(bx+","+(by+2)+","+bz,BW.TOWER);
    builtBlocks.set(bx+","+(by+3)+","+bz,BW.TOWER_TOP);
    // Create tower entity with arrow tower properties
    towers.push({x:bx+.5,y:by+4,z:bz+.5,hp:15,atk:4,range:14,cd:0,key:bx+","+by+","+bz,type:"arrow"});
    rebuildBuilt();showToast("🏹 建造箭塔！")}
}

function doDemolish(t){
  if(!t)t=getTarget();if(!t)return;
  const k=t.x+","+t.y+","+t.z;
const bt=builtBlocks.get(k);
if(!bt){showToast("无可拆除的方块");return}
if(bt===BW.WALL){stone++;builtBlocks.delete(k);showToast("⬜ 回收石头")}
else if(bt===BW.TOWER||bt===BW.TOWER_TOP){
// Remove whole arrow tower
let baseK=k;
if(bt===BW.TOWER_TOP)baseK=t.x+","+(t.y-1)+","+t.z;
// Find the bottom of tower
for(let dy=0;dy<4;dy++){
const checkK=t.x+","+(t.y-dy)+","+t.z;
if(builtBlocks.get(checkK)===BW.TOWER)baseK=checkK;
}
// Remove all tower blocks
for(let dy=0;dy<4;dy++){
const tk=t.x+","+(t.y-3+dy)+","+t.z;
builtBlocks.delete(tk);
}
iron++;towers=towers.filter(tw=>tw.key!==baseK);
showToast("🟠 回收铁块")}
rebuildBuilt()}

// Zombies
function createZombie(x,z,isBoss){
const g=new T.Group();
const bm2=new T.MeshLambertMaterial({color:isBoss?0x440000:0x2d6b2d});
const body=new T.Mesh(new T.BoxGeometry(.7,.9,.4),bm2);body.position.y=.95;
const hd=new T.Mesh(new T.BoxGeometry(.45,.45,.45),bm2);hd.position.y=1.65;
const e1=new T.Mesh(new T.BoxGeometry(.08,.08,.08),new T.MeshBasicMaterial({color:0xff0000}));
e1.position.set(-.1,1.7,.24);
const e2=new T.Mesh(new T.BoxGeometry(.08,.08,.08),new T.MeshBasicMaterial({color:0xff0000}));
e2.position.set(.1,1.7,.24);
const a1=new T.Mesh(new T.BoxGeometry(.18,.5,.18),bm2);a1.position.set(-.45,.9,-.15);a1.rotation.x=-.6;
const a2=new T.Mesh(new T.BoxGeometry(.18,.5,.18),bm2);a2.position.set(.45,.9,-.15);a2.rotation.x=-.6;
const l1=new T.Mesh(new T.BoxGeometry(.18,.45,.18),bm2);l1.position.set(-.15,.25,0);
const l2=new T.Mesh(new T.BoxGeometry(.18,.45,.18),bm2);l2.position.set(.15,.25,0);
g.add(body,hd,e1,e2,a1,a2,l1,l2);
// Health bar with Billboard effect
const hbGroup=new T.Group();
hbGroup.position.y=2.3;
// Background
const hbBg=new T.Mesh(new T.PlaneGeometry(1.2,0.2),new T.MeshBasicMaterial({color:0x333333,side:T.DoubleSide}));
// Fill
const hbFill=new T.Mesh(new T.PlaneGeometry(1,0.15),new T.MeshBasicMaterial({color:0xff0000,side:T.DoubleSide}));
hbFill.position.z=0.01;
hbGroup.add(hbBg,hbFill);
g.add(hbGroup);g.userData.healthBar=hbFill;g.userData.healthBarGroup=hbGroup;
const h=getH(Math.floor(x),Math.floor(z));
g.position.set(x,h+1,z);
sc.add(g);zombies.push(g);
g.userData={
hp:isBoss?30:8,maxHp:isBoss?30:8,
sp:isBoss?3.5:R(2,3),
dead:false,walk:R(0,6.28),flash:0,atkCd:0,
boss:isBoss,scale:isBoss?1.5:1};
if(isBoss)g.scale.setScalar(1.5);
return g}

function spawnWave(){
wave++;const isBoss=wave%5===0;
const n=isBoss?Math.min(6+wave*2,40):Math.min(2+wave,25);
let sp=0;
for(let i=0;i<n;i++){
if(zombies.length>=50)break;
const a=R(0,Math.PI*2),d=R(22,38);
const x=C(P.pos.x+Math.cos(a)*d,2,W-3);
const z=C(P.pos.z+Math.sin(a)*d,2,D-3);
createZombie(x,z,isBoss);sp++}
if(isBoss){
showBossWarn("💀 BOSS 第"+wave+"波！(×"+sp+")");
showToast("BOSS波！巨型僵尸来袭！")}
else showToast("🧟 第"+wave+"波！(×"+sp+")")}

function killZ(z){
z.userData.dead=true;
// Drop resources with animation
const px=z.position.x,py=z.position.y+1,pz=z.position.z;
if(z.userData.boss){
iron+=2;stone+=3;
// Spawn resource collection animation
spawnResourceAnimation(px,py,pz,'iron',2);
spawnResourceAnimation(px,py,pz,'stone',3);
showToast("💀 BOSS击杀！铁+2 石+3")}
else{
if(Math.random()<0.3){
iron++;
spawnResourceAnimation(px,py,pz,'iron',1);
showToast("🟠 获得铁块！")}
else{
stone+=2;
spawnResourceAnimation(px,py,pz,'stone',2);
showToast("⬜ 获得石头×2")}}
score+=z.userData.boss?20:5}

// Resource collection animation
let resourceAnimations=[];
function spawnResourceAnimation(x,y,z,type,count){
for(let i=0;i<count;i++){
const canvas=document.createElement('canvas');
canvas.width=32;canvas.height=32;
const ctx=canvas.getContext('2d');
ctx.fillStyle=type==='iron'?'#ffd93d':'#cccccc';
ctx.font='20px Arial';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText(type==='iron'?'🟠':'⬜',16,16);
const texture=new T.CanvasTexture(canvas);
const sprite=new T.Sprite(new T.SpriteMaterial({map:texture,transparent:true}));
sprite.position.set(x+R(-0.5,0.5),y+R(0,1),z+R(-0.5,0.5));
sprite.scale.set(0.5,0.5,1);
sc.add(sprite);
resourceAnimations.push({sprite,y:0,life:1.5,maxLife:1.5,type:type})}}
function updateResourceAnimations(dt){
for(let i=resourceAnimations.length-1;i>=0;i--){
const r=resourceAnimations[i];
r.life-=dt;
r.sprite.position.y+=dt*3;
r.sprite.material.opacity=r.life/r.maxLife;
r.sprite.scale.multiplyScalar(0.98);
if(r.life<=0){sc.remove(r.sprite);resourceAnimations.splice(i,1)}}}

function updateZombies(dt){
for(let i=zombies.length-1;i>=0;i--){
const z=zombies[i],st=z.userData;
if(st.dead){z.scale.multiplyScalar(.9);
if(z.scale.x<.05){sc.remove(z);zombies.splice(i,1)}continue}
if(st.flash>0){st.flash-=dt;
z.children.forEach(c=>{if(c.material&&c.material.emissive)
c.material.emissive.setRGB(st.flash*5,st.flash,0)})}
// Update health bar
if(st.healthBarGroup){
const pct=Math.max(0,st.hp/st.maxHp);
st.healthBar.scale.x=pct;
st.healthBar.position.x=-(1-pct)*0.5;
st.healthBar.material.color.setHex(pct>0.5?0x00ff00:pct>0.25?0xffff00:0xff0000);
// Billboard effect - make health bar face camera
st.healthBarGroup.lookAt(cam.position);
}
st.atkCd=Math.max(0,st.atkCd-dt);
const tp=new T.Vector3(P.pos.x,P.pos.y,P.pos.z);
const d=z.position.distanceTo(tp);
const dir=new T.Vector3();
if(d<35&&hp>0){
dir.copy(tp).sub(z.position);dir.y=0;
if(dir.lengthSq()>.001)dir.normalize();
if(d<1.6&&st.atkCd<=0){st.atkCd=1;damagePlayer(st.boss?4:2)}}
else{
if(!st.wp||z.position.distanceTo(st.wp)<1.5)
st.wp=new T.Vector3(z.position.x+R(-10,10),0,z.position.z+R(-10,10));
dir.copy(st.wp).sub(z.position);dir.y=0;
if(dir.lengthSq()>.001)dir.normalize()}
z.position.addScaledVector(dir,st.sp*dt);
z.position.x=C(z.position.x,1,W-2);z.position.z=C(z.position.z,1,D-2);
const zh=getH(Math.floor(z.position.x),Math.floor(z.position.z));
z.position.y=zh+1;
if(dir.lengthSq()>.01)z.rotation.y=Math.atan2(dir.x,dir.z);
st.walk+=dt*8;const sw=Math.sin(st.walk)*.5;
z.children[4].rotation.x=-sw;z.children[5].rotation.x=sw;
z.children[6].rotation.x=-sw*.7;z.children[7].rotation.x=sw*.7;
// Collision with walls - zombies attack walls
const bx=Math.floor(z.position.x),by=Math.floor(z.position.y),bz=Math.floor(z.position.z);
for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
const wk=(bx+dx)+","+by+","+(bz+dz);
if(builtBlocks.get(wk)===BW.WALL){
// Attack wall occasionally
if(Math.random()<dt*0.5){
builtBlocks.delete(wk);
for(let j=0;j<4;j++)spawnP(bx+dx+.5,by+.5,bz+dz+.5,0x999999);
rebuildBuilt()}}}
}}

// Tower shooting - Arrow tower
function updateTowers(dt){
towers.forEach(tw=>{
tw.cd=Math.max(0,tw.cd-dt);
if(tw.cd>0)return;
// Find nearest zombie
let nearest=null,nd=Infinity;
zombies.forEach(z=>{if(z.userData.dead)return;
const d=Math.sqrt((z.position.x-tw.x)**2+(z.position.y-tw.y)**2+(z.position.z-tw.z)**2);
if(d<tw.range&&d<nd){nd=d;nearest=z}});
if(!nearest)return;
tw.cd=1.0; // Fire rate
// Create arrow projectile
const dir=new T.Vector3().copy(nearest.position).add(new T.Vector3(0,1,0)).sub(new T.Vector3(tw.x,tw.y,tw.z)).normalize();
// Arrow visual - thin cylinder with point
const arrow=new T.Group();
const shaft=new T.Mesh(new T.CylinderGeometry(0.03,0.03,1.2,4),new T.MeshLambertMaterial({color:0x8B4513}));
shaft.rotation.x=Math.PI/2;
const head=new T.Mesh(new T.ConeGeometry(0.08,0.3,4),new T.MeshLambertMaterial({color:0x666666}));
head.position.z=-0.75;
head.rotation.x=-Math.PI/2;
arrow.add(shaft,head);
arrow.position.set(tw.x,tw.y,tw.z);
arrow.lookAt(nearest.position.x,nearest.position.y+1,nearest.position.z);
sc.add(arrow);
// Create trail for arrow
const trail=[];
for(let j=0;j<5;j++){
const tp=new T.Mesh(new T.SphereGeometry(0.02,4,4),new T.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:0.6-j*0.1}));
tp.visible=false;sc.add(tp);trail.push(tp)}
bullets.push({mesh:arrow,x:tw.x,y:tw.y,z:tw.z,vx:dir.x*20,vy:dir.y*20,vz:dir.z*20,life:2,dmg:tw.atk,trail:trail,trailTimer:0});
// Muzzle flash
for(let j=0;j<3;j++)spawnP(tw.x,tw.y+.5,tw.z,0xffaa00);
})}

function updateBullets(dt){
for(let i=bullets.length-1;i>=0;i--){
const b=bullets[i];
b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.life-=dt;
if(b.mesh){b.mesh.position.set(b.x,b.y,b.z);b.mesh.lookAt(b.x+b.vx,b.y+b.vy,b.z+b.vz)}
// Update trail
if(b.trail){
b.trailTimer+=dt;
if(b.trailTimer>0.02){
b.trailTimer=0;
// Move trail points
for(let j=b.trail.length-1;j>0;j--){
b.trail[j].position.copy(b.trail[j-1].position);
b.trail[j].visible=b.trail[j-1].visible}
b.trail[0].position.set(b.x,b.y,b.z);
b.trail[0].visible=true;
}
}
if(b.life<=0){
// Remove trail
if(b.trail){b.trail.forEach(t=>sc.remove(t))}
if(b.mesh)sc.remove(b.mesh);
bullets.splice(i,1);continue}
// Hit zombie check
for(let j=zombies.length-1;j>=0;j--){
const z=zombies[j];if(z.userData.dead)continue;
const d=Math.sqrt((z.position.x-b.x)**2+(z.position.y+1-b.y)**2+(z.position.z-b.z)**2);
if(d<1.5){
z.userData.hp-=b.dmg;z.userData.flash=0.15;
// Spawn hit particles
for(let k=0;k<8;k++)spawnP(b.x,b.y,b.z,0xff4400);
// Spawn damage number
spawnDamageNumber(b.x,b.y+2,b.z,Math.round(b.dmg));
if(z.userData.hp<=0)killZ(z);
// Remove bullet with trail
if(b.trail){b.trail.forEach(t=>sc.remove(t))}
if(b.mesh)sc.remove(b.mesh);
bullets.splice(i,1);break}}}}

// Particles
function spawnP(px,py,pz,c){
for(let i=0;i<4;i++){
particles.push({x:px,y:py,z:pz,vx:R(-2,2),vy:R(1,4),vz:R(-2,2),
life:.5,maxLife:.5,color:c,size:R(.04,.1)})}}
function updateParticles(dt){
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
p.vy-=10*dt;p.life-=dt;
if(p.life<=0)particles.splice(i,1)}}

// Damage numbers system
let damageNumbers=[];
function spawnDamageNumber(x,y,z,dmg){
const canvas=document.createElement('canvas');
canvas.width=64;canvas.height=32;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#ff4444';ctx.font='bold 24px Arial';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('-'+dmg,32,16);
const texture=new T.CanvasTexture(canvas);
const sprite=new T.Sprite(new T.SpriteMaterial({map:texture,transparent:true}));
sprite.position.set(x,y,z);
sprite.scale.set(1,0.5,1);
sc.add(sprite);
damageNumbers.push({sprite,y:0,life:1.5,maxLife:1.5})}
function updateDamageNumbers(dt){
for(let i=damageNumbers.length-1;i>=0;i--){
const d=damageNumbers[i];
d.life-=dt;
d.sprite.position.y+=dt*2;
d.sprite.material.opacity=d.life/d.maxLife;
if(d.life<=0){sc.remove(d.sprite);damageNumbers.splice(i,1)}}}

function damagePlayer(d){
if(P.hcd>0)return;
hp=Math.max(0,hp-d);P.hcd=0.5;
if(hp<=0){P.dead=true;
$("dinfo").textContent="得分: "+score+" | 第 "+wave+" 波";
$("ov-death").style.display="flex"}}

// UI
function updateUI(){
const pct=Math.max(0,(hp/mhp)*100);
$("hp-bar").style.width=pct+"%";
$("hp-bar").style.background=hp<6?"linear-gradient(#e33,#a22)":"linear-gradient(#5fe03a,#3fae22)";
$("hp-text").textContent=Math.max(0,Math.round(hp))+"/"+mhp;
$("hp-wrap").style.borderColor=hp<6?"#f44":"#555";
$("stone-count").textContent="⬜ "+stone;
$("iron-count").textContent="🟠 "+iron;
$("score-info").textContent="🎯 "+score;
// Wave preview with next wave info
const nextWave=wave+1;
const isNextBoss=nextWave%5===0;
const nextCount=isNextBoss?Math.min(6+nextWave*2,40):Math.min(2+nextWave,25);
const waveText=wave>0?"⚔️ 第 "+wave+" 波 | 下一波 "+Math.max(0,Math.ceil(waveT))+"s":"准备开始";
const previewText=wave>0?" (:"+nextCount+(isNextBoss?" BOSS":"")+")":"";
$("wave-info").textContent=waveText+previewText;
// Hotbar
let hb="";
for(let i=0;i<2;i++){
const it=hbar[i],act=i===slot?"act":"";
const icon=it===10?"⬜":"🏹";
const lb=it===10?"围墙":"箭塔";
const ct=it===10?stone:iron;
hb+='<div class="hs '+act+'" onclick="window.selectSlot('+i+')">'+icon+'<span class="lb">'+lb+'</span><span class="ct">'+ct+'</span></div>'}
$("hotbar").innerHTML=hb}

function showToast(msg){
$("toast").textContent=msg;$("toast").className="show";
setTimeout(()=>$("toast").className="",2000)}
function showBossWarn(msg){
const el=$("boss-warn");el.textContent=msg;el.style.opacity=1;
setTimeout(()=>el.style.opacity=0,3000)}

window.selectSlot=i=>{slot=i;updateUI()};
// Expose state for debugging
window.gameState=()=>({stone,iron,score,hp,wave,zombies:zombies.length,towers:towers.length,gameStarted,builtBlocks:builtBlocks.size})
// Expose variables for testing (use getters for live values)
Object.defineProperties(window,{
stone:{get:()=>stone,set:v=>stone=v},
iron:{get:()=>iron,set:v=>iron=v},
score:{get:()=>score,set:v=>score=v},
hp:{get:()=>hp,set:v=>hp=v},
mhp:{get:()=>mhp},
wave:{get:()=>wave,set:v=>wave=v},
zombies:{get:()=>zombies},
towers:{get:()=>towers},
builtBlocks:{get:()=>builtBlocks},
gameStarted:{get:()=>gameStarted,set:v=>gameStarted=v},
particles:{get:()=>particles},
bullets:{get:()=>bullets},
P:{get:()=>P}
});
// Expose functions for testing
window.createZombie=createZombie;window.killZ=killZ;window.spawnWave=spawnWave;
window.damagePlayer=damagePlayer;window.collides=collides;window.rebuildBuilt=rebuildBuilt;

// Touch controls
let joyActive=false,joySX=0,joySY=0,joyId=null;
const joyEl=$("joy"),joyK=$("joy-k");
joyEl.addEventListener("touchstart",e=>{e.preventDefault();
  if(joyId!==null)return;
  const t=e.changedTouches[0];joyId=t.identifier;
  const r=joyEl.getBoundingClientRect();joySX=r.left+r.width/2;joySY=r.top+r.height/2;joyActive=true},{passive:false});
joyEl.addEventListener("touchmove",e=>{e.preventDefault();if(!joyActive)return;
  let t=null;for(const ct of e.changedTouches)if(ct.identifier===joyId){t=ct;break}
  if(!t)return;
  const dx=t.clientX-joySX,dy=t.clientY-joySY;
  const maxD=55;const cx=C(dx,-maxD,maxD),cy=C(dy,-maxD,maxD);
  joyK.style.transform="translate("+(cx/maxD*26)+"px,"+(cy/maxD*26)+"px)";
  jF=dy<-22?1:0;jB=dy>22?1:0;jL=dx<-22?1:0;jR=dx>22?1:0},{passive:false});
const endJoy=e=>{for(const ct of e.changedTouches)if(ct.identifier===joyId){joyId=null;joyActive=false;jF=jB=jL=jR=0;joyK.style.transform="translate(-50%,-50%)"}};
joyEl.addEventListener("touchend",endJoy);joyEl.addEventListener("touchcancel",endJoy);
$("b-jump").addEventListener("touchstart",e=>{e.preventDefault();jJ=1},{passive:false});
$("b-jump").addEventListener("touchend",()=>{jJ=0});
$("b-jump").addEventListener("touchcancel",()=>{jJ=0});
$("b-act").addEventListener("touchstart",e=>{e.preventDefault();doBuild()},{passive:false});
$("b-del").addEventListener("touchstart",e=>{e.preventDefault();doDemolish()},{passive:false});

// Touch camera look (drag anywhere on canvas that isn't a control)
let lookIds={};
cv.addEventListener("touchstart",e=>{e.preventDefault();
  for(const t of e.changedTouches)lookIds[t.identifier]={x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY,t0:performance.now()};},{passive:false});
cv.addEventListener("touchmove",e=>{e.preventDefault();
  for(const t of e.changedTouches){
    const p=lookIds[t.identifier];if(!p)continue;
    const dx=t.clientX-p.x,dy=t.clientY-p.y;
    P.yaw-=dx*.006;P.pitch=C(P.pitch-dy*.006,-1.5,1.5);
    p.x=t.clientX;p.y=t.clientY;}},{passive:false});
const endLook=e=>{for(const t of e.changedTouches){
  const p=lookIds[t.identifier];if(!p)continue;
  const moved=Math.hypot(t.clientX-p.sx,t.clientY-p.sy);
  const dur=performance.now()-p.t0;
  // Quick tap (no drag) = build at tapped point
  if(moved<12&&dur<300){buildAtPoint(t.clientX,t.clientY)}
  delete lookIds[t.identifier];}};
cv.addEventListener("touchend",endLook);cv.addEventListener("touchcancel",endLook);

// Build at an arbitrary screen point (tablet tap-to-build)
function buildAtPoint(cx,cy){
  const rect=cv.getBoundingClientRect();
  const nx=((cx-rect.left)/rect.width)*2-1;
  const ny=-((cy-rect.top)/rect.height)*2+1;
  const t=getTarget(nx,ny);
  if(!t){showToast("请对准地面或方块");return}
  doBuild(t);
}

// Keyboard/mouse
let mouseDown={};
cv.addEventListener("mousedown",e=>{
  mouseDown[e.button]=true;
  if(e.button===0)doBuild();
  if(e.button===2)doDemolish();
  if(!document.pointerLockElement)cv.requestPointerLock();
});
cv.addEventListener("mouseup",e=>{mouseDown[e.button]=false});
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("mousemove",e=>{
  if(document.pointerLockElement===cv){
    P.yaw-=e.movementX*.002;P.pitch=C(P.pitch-e.movementY*.002,-1.5,1.5)}
  else if(mouseDown[2]){
    P.yaw-=e.movementX*.002;P.pitch=C(P.pitch-e.movementY*.002,-1.5,1.5)}
});
cv.addEventListener("wheel",e=>{
  if(!gameStarted)return;
  if(e.deltaY<0){slot=(slot+1)%hbar.length}
  else{slot=(slot-1+hbar.length)%hbar.length}
  updateUI();e.preventDefault();
},{passive:false});
addEventListener("keydown",e=>{keys[e.code]=true;
  if(e.code==="Space")e.preventDefault();
  if(e.code==="Digit1")window.selectSlot(0);
  if(e.code==="Digit2")window.selectSlot(1);
  if(e.code==="KeyE"||e.code==="KeyQ")doBuild();
  if(e.code==="KeyX"||e.code==="KeyR")doDemolish()});
addEventListener("keyup",e=>{keys[e.code]=false});
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

// Start
function startGame(){
gameStarted=true;
const ov=$("ov-start");if(ov)ov.style.display="none";
genWorld();rebuild();createHL();
P.pos.set(30,getH(30,30)+3,30);P.vel.set(0,0,0);
try{cv.requestPointerLock();}catch(e){}
updateUI();
showToast("⚔️ 建造围墙和防护塔，抵御僵尸！")}

$("btn-go").onclick=startGame;
cv.addEventListener("click",()=>{if(gameStarted&&!document.pointerLockElement)cv.requestPointerLock()});

// Main loop
let lt=performance.now();
function animate(){
requestAnimationFrame(animate);
const now=performance.now(),dt=Math.min((now-lt)/1000,.05);lt=now;
if(!gameStarted||paused)return;
gameTime+=dt;
if(!P.dead){
updatePlayer(dt);
cam.position.copy(P.pos);cam.position.y+=EY;
cam.rotation.order="YXZ";cam.rotation.y=P.yaw;cam.rotation.x=P.pitch;
const tgt=getTarget();
if(tgt&&hlMesh){hlMesh.visible=true;hlMesh.position.set(tgt.x+.5,tgt.y+.5,tgt.z+.5);
// Show range indicator for tower building
if(hbar[slot]===11){
rangeIndicator.visible=true;
rangeIndicator.position.set(tgt.nx+.5,tgt.ny+.1,tgt.nz+.5);
// Show preview
previewMesh.visible=true;
previewMesh.position.set(tgt.nx+.5,tgt.ny+.5,tgt.nz+.5);
previewMesh.material.color.setHex(iron>0?0x00ff00:0xff0000);
}else{
rangeIndicator.visible=false;
previewMesh.visible=true;
previewMesh.position.set(tgt.nx+.5,tgt.ny+.5,tgt.nz+.5);
previewMesh.material.color.setHex(stone>0?0x00ff00:0xff0000);
}
}
else if(hlMesh){hlMesh.visible=false;rangeIndicator.visible=false;previewMesh.visible=false}
// Waves
waveT-=dt;
if(waveT<=0&&hp>0){spawnWave();waveT=Math.max(15,30-wave)}
updateZombies(dt);updateTowers(dt);updateBullets(dt);updateParticles(dt);updateDamageNumbers(dt);updateResourceAnimations(dt);
if(zombies.length>50){for(let i=0;i<5;i++)if(zombies[0]&&!zombies[0].userData.dead){sc.remove(zombies[0]);zombies.splice(0,1)}}
}
ren.render(sc,cam);updateUI()}
animate();
</script>
</body>
